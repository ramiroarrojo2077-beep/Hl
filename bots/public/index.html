        ${top.length ? html`<ul class="top-bots" aria-label="Quién gastó más hoy">${top.map(([id, v]) => { const b = bot(id); return html`<li>${av(b, 22, { s: "idle" })}<span>${b?.nombre || "(ya no está)"}</span><span class="bar-h" aria-hidden="true"><i style="width:${((v / max) * 100).toFixed(0)}%"></i></span><span class="mono">${usd(v)}</span></li>`; })}</ul>` : ""}</section>

function formHabilidad(h) {

// ================================================================ editor visual de automatizaciones
// Cada regla es un flujo de tres nodos: Cuando (evento) → Quién (compañero) → Qué hace (indicación).
// Para crear una, se toca un nodo de cada columna y se escribe la indicación.
const AUT = { evento: null, botId: null };
function pintarAutomatizaciones() {
  const el = $("#autom");
  if (!el) return;
  const A_ = S.autom;
  if (!A_) { el.innerHTML = `<div class="carga" role="status">Cargando…</div>`; return; }
  const nodo = (tipo, titulo, sub, extra = "") => html`<div class="nodo ${tipo}" ${crudo(extra)}><small>${tipo === "ev" ? "Cuando" : tipo === "qui" ? "Quién" : "Qué hace"}</small><b>${titulo}</b>${sub ? html`<span>${sub}</span>` : ""}</div>`;
  const flecha = html`<span class="flecha" aria-hidden="true">${ico("right", "s")}</span>`;
  pintar(el, html`<header class="pag-h"><div class="tt"><h1>Automatizaciones</h1><p>Flujos «si pasa esto, que tal compañero haga esto». Cada evento dispara una vez por regla (como mucho 20 por hora). Lo que mande afuera igual pide aprobación.</p></div></header>
    <div class="sec-h"><h2>Flujos <span>${A_.reglas.length}</span></h2></div>
    ${A_.reglas.length ? html`<div class="flujos">${A_.reglas.map((a) => html`<div class="flujo ${a.activa ? "" : "pausado"}">${nodo("ev", A_.eventos[a.evento] || a.evento, "")}${flecha}${nodo("qui", bot(a.botId)?.nombre || "(ya no está)", bot(a.botId)?.titulo || "")}${flecha}${nodo("acc", a.nombre, a.instrucciones.slice(0, 90))}
      <div class="flujo-a"><span class="tag">${a.disparos} disparos</span><button class="btn ghost sm" data-a="autom-activa" data-id="${a.id}" data-v="${a.activa ? "0" : "1"}" aria-pressed="${String(a.activa)}">${a.activa ? "Pausar" : "Activar"}</button><button class="btn ghost sm" data-a="autom-borrar" data-id="${a.id}" aria-label="Borrar ${a.nombre}">Borrar</button></div></div>`)}</div>` : html`<p class="muted" style="font-size:13px">Todavía no hay flujos.</p>`}
    <div class="sec-h"><h2>Armar un flujo</h2></div>
    ${S.bots.length ? html`<div class="armar">
      <div class="col"><small>1 · Cuando</small>${Object.entries(A_.eventos).map(([k, t]) => html`<button class="nodo ev sel-${AUT.evento === k}" data-a="aut-ev" data-v="${k}" aria-pressed="${String(AUT.evento === k)}"><b>${t}</b></button>`)}</div>
      <div class="col"><small>2 · Quién</small>${S.bots.map((b) => html`<button class="nodo qui sel-${AUT.botId === b.id}" data-a="aut-bot" data-v="${b.id}" aria-pressed="${String(AUT.botId === b.id)}"><b>${b.nombre}</b><span>${b.titulo}</span></button>`)}</div>
      <form class="col" data-f="aut-crear"><small>3 · Qué hace</small><label class="fld"><span class="sr">Nombre</span><input class="inp" name="nombre" required maxlength="80" placeholder="Nombre del flujo"></label><label class="fld"><span class="sr">Indicación</span><textarea class="inp" name="instrucciones" rows="4" required maxlength="4000" placeholder="Ej.: averiguá qué la bloquea y proponé una solución"></textarea></label><p class="err" role="alert"></p><button class="btn pri" ${si(!AUT.evento || !AUT.botId, "disabled")}>Conectar</button></form>
    </div>` : html`<p class="muted">Primero sumá un compañero.</p>`}`);
}

// ================================================================ Gravity Studio
// Apps web de un solo archivo: se describen, el modelo las escribe en computadora/studio/<nombre>/ y se ven
// en la vista previa aislada. Los errores de la página llegan por postMessage y se pueden mandar a arreglar.
const STU = { apps: null, cargando: false, errores: [], v: 0 };
async function generarDesdeStudio(nombre, pedido, errores) {
  STU.cargando = true; pintarStudio();
  try {
    await api("POST", "/api/studio", { nombre, pedido, errores });
    STU.errores = []; STU.v++;
    await cargarStudio();
    toast(errores ? "Listo: corregí los errores." : "Listo: mirá cómo quedó.");
  } catch (err) { const e = $("#studio .err"); if (e) e.textContent = err.message; else fallo(err); }
  finally { STU.cargando = false; pintarStudio(); }
}
async function cargarStudio() { try { STU.apps = await api("GET", "/api/studio"); pintarStudio(); } catch {} }
window.addEventListener("message", (e) => {
  const f = $("#stu-vista");
  if (!f || e.source !== f.contentWindow || !e.data?.gravityVista || !e.data.error) return;
  if (STU.errores.length < 20 && !STU.errores.includes(e.data.error)) { STU.errores.push(String(e.data.error)); pintarErroresStudio(); }
});
function pintarErroresStudio() {
  const el = $("#stu-err");
  if (!el) return;
  el.hidden = !STU.errores.length;

// ================================================================ sala con robots
// Los participantes de una reunión como robots alrededor de una mesa holográfica: cada uno con su color;
// el que habla se ilumina y se mueve (sin animación si se pidió reducir el movimiento).
function mesaRobots(fac, ps, habla) {
  const todos = [fac, ...ps].filter(Boolean).slice(0, 12);
  const W = 260, H = 210, cx = W / 2, cy = 118, rx = 100, ry = 62;
  const color = (b) => avatarDe(b).color || "#6CD3F0";
  const txt = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const robots = todos.map((b, i) => {
    const a = -Math.PI / 2 + (i * 2 * Math.PI) / todos.length;
    const x = cx + rx * Math.cos(a), y = cy + ry * Math.sin(a) - 10;
    const c = color(b), on = habla.includes(b.id);
    return `<g class="rob ${on ? "habla" : ""}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><g class="cuerpo">
      <ellipse cx="0" cy="22" rx="13" ry="8" fill="#E3E7EE" stroke="#AEB7C5" stroke-width=".6"/>
      <rect x="-14" y="-12" width="28" height="24" rx="11" fill="#F3F5F9" stroke="#AEB7C5" stroke-width=".6"/>
      <rect x="-10" y="-7" width="20" height="13" rx="6" fill="#05070D"/>
      <rect x="-6.5" y="-3.5" width="4" height="5" rx="2" fill="${c}"/><rect x="2.5" y="-3.5" width="4" height="5" rx="2" fill="${c}"/>
      <circle cx="-15" cy="0" r="3" fill="${on ? c : "#C9D0DB"}"/><circle cx="15" cy="0" r="3" fill="${on ? c : "#C9D0DB"}"/>
      ${on ? `<circle cx="0" cy="0" r="22" fill="none" stroke="${c}" stroke-opacity=".55" stroke-width="2"/>` : ""}
    </g><text x="0" y="40" text-anchor="middle" font-size="9.5" fill="var(--tx2)">${txt(b.nombre)}</text></g>`;
  }).join("");
  return crudo(`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Sala: ${todos.length} participantes${habla.length ? `; habla ${txt(todos.filter((b) => habla.includes(b.id)).map((b) => b.nombre).join(", "))}` : ""}" class="mesa-sala">
    <defs><radialGradient id="mesa-luz"><stop offset="0" stop-color="#6CD3F0" stop-opacity=".35"/><stop offset="1" stop-color="#9B7BFF" stop-opacity=".06"/></radialGradient></defs>
    <ellipse cx="${cx}" cy="${cy + 6}" rx="${rx - 30}" ry="${ry - 26}" fill="url(#mesa-luz)" stroke="#6CD3F0" stroke-opacity=".45"/>
    <ellipse cx="${cx}" cy="${cy + 6}" rx="${rx - 48}" ry="${ry - 40}" fill="none" stroke="#9B7BFF" stroke-opacity=".35" stroke-dasharray="3 4"/>
    ${robots}</svg>`);
}

// ================================================================ Gravity Data Lab
// Tablas reales de la computadora (CSV, TSV, JSON, Excel): perfil de columnas, preguntas en lenguaje
// natural, constructor de gráficos con filtros, comparar períodos, anomalías, pronóstico con intervalo,
// limpiar y unir tablas, informes y tableros que se recalculan con los datos actuales.
const DL = { archivos: null, ruta: null, info: null, res: null, q: null, tipo: "barras", extra: null, tableros: null, tablero: null, cargando: false, pestana: "explorar" };
const DL_MET = { contar: "Contar filas", suma: "Suma", promedio: "Promedio", minimo: "Mínimo", maximo: "Máximo", mediana: "Mediana" };
const DL_PER = { dia: "Día", semana: "Semana", mes: "Mes", trimestre: "Trimestre", "año": "Año" };
const dlNum = (n) => (typeof n === "number" ? n.toLocaleString("es-AR", { maximumFractionDigits: 2 }) : n ?? "");
async function montarDatos() {
  const el = $("#datalab");
  if (!el) return;
  DL.archivos = await api("GET", "/api/datos/archivos");
  if (DL.ruta && !DL.archivos.some((a) => a.ruta === DL.ruta)) { DL.ruta = null; DL.info = null; }
  pintarDatos();
}
async function dlAbrir(ruta) {
  DL.ruta = ruta; DL.info = null; DL.res = null; DL.extra = null; DL.cargando = true; pintarDatos();
  try { DL.info = await api("POST", "/api/datos/analizar", { ruta }); } finally { DL.cargando = false; pintarDatos(); }
}
// Gráficos SVG (barras, líneas con banda de incertidumbre opcional, torta), accesibles y con la tabla al lado.
function dlGrafico(grupos, tipo = "barras", op = {}) {
  const xs = grupos.slice(0, 60);
  if (!xs.length) return html`<p class="muted">Sin datos para graficar.</p>`;
  const W = 640, H = 260, m = { l: 56, r: 12, t: 12, b: 46 };
  const banda = op.banda || [];
  const vals = [...xs.map((g) => g.valor), ...banda.flatMap((b) => [b.bajo, b.alto])];
  const max = Math.max(0, ...vals), min = Math.min(0, ...vals), rango = max - min || 1;
  const y = (v) => m.t + (H - m.t - m.b) * (1 - (v - min) / rango);
  const n = xs.length + banda.length, paso = (W - m.l - m.r) / Math.max(1, n);
  const txt = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const ejes = [0, 0.25, 0.5, 0.75, 1].map((k) => { const v = min + rango * k; return `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" class="g-l"/><text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end" class="g-t">${txt(dlNum(Math.round(v * 100) / 100))}</text>`; }).join("");
  const etiquetas = xs.map((g, i) => (n <= 14 || i % Math.ceil(n / 14) === 0 ? `<text x="${m.l + paso * (i + 0.5)}" y="${H - m.b + 16}" text-anchor="middle" class="g-t">${txt(String(g.grupo).slice(0, 12))}</text>` : "")).join("");
  let cuerpo = "";
  if (tipo === "torta") {
    const total = xs.reduce((a, g) => a + Math.max(0, g.valor), 0) || 1;
    let a0 = -Math.PI / 2;
    const cs = ["#6CD3F0", "#9B7BFF", "#63D3B1", "#FFB07A", "#E8ECF5", "#5B6478"];
    cuerpo = xs.slice(0, 8).map((g, i) => { const a1 = a0 + (Math.max(0, g.valor) / total) * Math.PI * 2, cx = 160, cy = 130, r = 105; const d = `M${cx},${cy} L${cx + r * Math.cos(a0)},${cy + r * Math.sin(a0)} A${r},${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${cx + r * Math.cos(a1)},${cy + r * Math.sin(a1)} Z`; a0 = a1; return `<path d="${d}" fill="${cs[i % cs.length]}"><title>${txt(g.grupo)}: ${txt(dlNum(g.valor))}</title></path><rect x="320" y="${24 + i * 26}" width="14" height="14" rx="3" fill="${cs[i % cs.length]}"/><text x="342" y="${36 + i * 26}" class="g-t g-tl">${txt(String(g.grupo).slice(0, 28))} · ${txt(dlNum(g.valor))} (${Math.round((Math.max(0, g.valor) / total) * 100)}%)</text>`; }).join("");
    return crudo(`<svg viewBox="0 0 ${W} ${H}" class="dl-g" role="img" aria-label="${txt(op.titulo || "Gráfico de torta")}">${cuerpo}</svg>`);
  }
  if (tipo === "lineas") {
    const pts = xs.map((g, i) => `${m.l + paso * (i + 0.5)},${y(g.valor)}`).join(" ");
    const bandaPts = banda.length ? [...banda.map((b, k) => `${m.l + paso * (xs.length + k + 0.5)},${y(b.alto)}`), ...banda.slice().reverse().map((b, k) => `${m.l + paso * (xs.length + banda.length - k - 0.5)},${y(b.bajo)}`)].join(" ") : "";
    const pron = banda.length ? `<polygon points="${bandaPts}" class="g-banda"/><polyline points="${m.l + paso * (xs.length - 0.5)},${y(xs.at(-1).valor)} ${banda.map((b, k) => `${m.l + paso * (xs.length + k + 0.5)},${y(b.valor)}`).join(" ")}" class="g-pron"/>` : "";
    cuerpo = `${pron}<polyline points="${pts}" class="g-linea"/>${xs.map((g, i) => `<circle cx="${m.l + paso * (i + 0.5)}" cy="${y(g.valor)}" r="3.5" class="g-p"><title>${txt(g.grupo)}: ${txt(dlNum(g.valor))}</title></circle>`).join("")}`;
  } else {
    cuerpo = xs.map((g, i) => `<rect x="${m.l + paso * i + paso * 0.15}" y="${Math.min(y(g.valor), y(0))}" width="${paso * 0.7}" height="${Math.abs(y(0) - y(g.valor))}" rx="3" class="g-b"><title>${txt(g.grupo)}: ${txt(dlNum(g.valor))}</title></rect>`).join("");
  }
  return crudo(`<svg viewBox="0 0 ${W} ${H}" class="dl-g" role="img" aria-label="${txt(op.titulo || "Gráfico")}">${ejes}${cuerpo}${etiquetas}</svg>`);
}
const dlTablaRes = (r) => html`<details class="mas"><summary>${ico("right", "s")}Tabla (${r.grupos.length})</summary><div class="dl-tw"><table class="dl-t"><thead><tr><th>Grupo</th><th>Valor</th><th>Filas</th></tr></thead><tbody>${r.grupos.map((g) => html`<tr><td>${g.grupo}</td><td>${dlNum(g.valor)}</td><td>${g.n}</td></tr>`)}</tbody></table></div></details>`;

    ${DL.pestana === "explorar" ? html`
      <div class="dl-cols">${cols.map((c) => html`<div class="dl-col"><b title="${c.nombre}">${c.nombre}</b><span class="tag">${c.tipo}</span><small>${c.tipo === "número" ? `${dlNum(c.min)} a ${dlNum(c.max)} · media ${dlNum(c.media)} · mediana ${dlNum(c.mediana)}` : c.tipo === "fecha" ? `${c.min} a ${c.max}` : `${c.distintos} distintos${c.frecuentes?.[0] ? ` · más común: ${c.frecuentes[0].valor} (${c.frecuentes[0].n})` : ""}`}${c.vacios ? ` · ${c.vacios} vacíos` : ""}</small></div>`)}</div>

      <form class="dl-armar" data-f="dl-consultar">
        <label class="fld"><span>Agrupar por</span><select class="inp" name="agrupar">${opt(cols, q.agrupar, "Sin agrupar")}</select></label>
        <label class="fld"><span>Período (si es fecha)</span><select class="inp" name="periodo"><option value="">—</option>${Object.entries(DL_PER).map(([k, t]) => html`<option value="${k}" ${si(q.periodo === k, "selected")}>${t}</option>`)}</select></label>
        <label class="fld"><span>Cálculo</span><select class="inp" name="metrica">${Object.entries(DL_MET).map(([k, t]) => html`<option value="${k}" ${si(q.metrica === k, "selected")}>${t}</option>`)}</select></label>

function lbGrafo(nodos, aristas, op = {}) {
  // Acomodo por fuerzas (o por niveles si hay «nivel») en SVG.
  const W = 900, H = op.alto || 480, P = new Map();
  const porNivel = nodos.some((n) => n.nivel != null);
  if (porNivel) { const niveles = [...new Set(nodos.map((n) => n.nivel))].sort((a, b) => a - b); for (const lv of niveles) { const xs = nodos.filter((n) => n.nivel === lv); xs.forEach((n, i) => P.set(n.id, { x: 90 + (niveles.indexOf(lv) / Math.max(1, niveles.length - 1)) * (W - 180), y: ((i + 1) / (xs.length + 1)) * H })); } }
  else {
    nodos.forEach((n, i) => P.set(n.id, { x: W / 2 + Math.cos(i * 2.4) * (60 + i * 6), y: H / 2 + Math.sin(i * 2.4) * (40 + i * 4), vx: 0, vy: 0 }));
    for (let it = 0; it < 220; it++) {
      for (const a of P.values()) for (const b of P.values()) { if (a === b) continue; const dx = a.x - b.x, dy = a.y - b.y, d2 = Math.max(dx * dx + dy * dy, 80), f = 2600 / d2; a.vx += dx * f / Math.sqrt(d2); a.vy += dy * f / Math.sqrt(d2); }
      for (const e of aristas) { const a = P.get(e.de), b = P.get(e.a); if (!a || !b) continue; const dx = b.x - a.x, dy = b.y - a.y, d = Math.max(1, Math.hypot(dx, dy)), f = (d - 110) * 0.03; a.vx += dx / d * f; a.vy += dy / d * f; b.vx -= dx / d * f; b.vy -= dy / d * f; }
      for (const q of P.values()) { q.vx += (W / 2 - q.x) * 0.004; q.vy += (H / 2 - q.y) * 0.004; q.x = Math.max(60, Math.min(W - 60, q.x + q.vx * 0.5)); q.y = Math.max(20, Math.min(H - 20, q.y + q.vy * 0.5)); q.vx *= 0.5; q.vy *= 0.5; }
    }
  }
  const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const lin = aristas.map((e) => { const a = P.get(e.de), b = P.get(e.a); return a && b ? `<line x1="${a.x.toFixed(0)}" y1="${a.y.toFixed(0)}" x2="${b.x.toFixed(0)}" y2="${b.y.toFixed(0)}"${e.critica ? ' style="stroke:#e0283c;stroke-opacity:1;stroke-width:2.5"' : ""}><title>${esc(e.tipo || "")}</title></line>` : ""; }).join("");

  return crudo(`<svg class="lb-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(op.titulo || "Grafo")}">${lin}${nod}</svg>`);
}

function cdRoles(total) {
  const n = total - 1, r = {}; let resto = n;
  const tomar = (k, c) => { const x = Math.min(c, resto); if (x > 0) r[k] = (r[k] || 0) + x; resto -= x; };
  const lideres = n > 29 ? Math.ceil(n / 15) : 0; resto -= lideres;
  const m = resto;
  if (m >= 3) tomar("arquitecto", 1); tomar("tester", Math.max(1, Math.round(m * 0.15))); if (m >= 3) tomar("revisor", Math.max(1, Math.round(m * 0.12)));
  if (m >= 6) tomar("debugger", 1); if (m >= 5) tomar("diseñador", 1); if (m >= 10) tomar("documentador", 1); if (m >= 12) tomar("devops", 1);
  if (m >= 8) { const f = Math.floor(resto / 2); tomar("frontend", f); tomar("backend", resto); } else tomar("programador", resto);
  return `1 coordinador${lideres ? ` · ${lideres} líderes` : ""} · ${Object.entries(r).map(([k, c]) => `${c} ${k}`).join(" · ")}`;
}

function escenaUniverso(T, cont, cfg = univCfg()) {

  const pm = new T.PMREMGenerator(renderer);

  escena.environmentIntensity = 0.85;

  const sol = new T.DirectionalLight(0xfff5ec, 1.6 * cfg.luz); sol.position.set(5, 12, 8); escena.add(sol);
  const bordeA = new T.DirectionalLight(0x6cd3f0, 1.4); bordeA.position.set(-8, 4, -6);
  const bordeV = new T.DirectionalLight(new T.Color(VIOLETA), 1.6); bordeV.position.set(8, 3, -8);
  escena.add(bordeA, bordeV);
  // Estrellas en dos capas y una nebulosa suave
  const estrellas = (n, tam, color) => {
    const pos = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) { const r = 38 + Math.random() * 30, a = Math.random() * Math.PI * 2, y = -4 + Math.random() * 40; pos.set([Math.cos(a) * r, y, Math.sin(a) * r], i * 3); }
    const geo = new T.BufferGeometry(); geo.setAttribute("position", new T.BufferAttribute(pos, 3));
    return new T.Points(geo, new T.PointsMaterial({ color, size: tam, sizeAttenuation: true, transparent: true, opacity: 0.85, depthWrite: false }));
  };
  if (ESC.estrellas) escena.add(estrellas(700, 0.14, 0xa9bbe0), estrellas(160, 0.3, 0xe8ecf5));
  for (const [x, y, z, c, s] of [[-26, 12, -30, "#9B7BFF", 40], [28, 8, -22, "#6CD3F0", 34]]) { const n = new T.Mesh(new T.PlaneGeometry(s, s), matBrillo(T, c, 0.16, true)); n.position.set(x, y, z); n.lookAt(0, 4, 0); escena.add(n); }
  // Piso: disco oscuro metálico, grilla radial y anillos de luz
  const piso = new T.Mesh(new T.CircleGeometry(bots0 > 30 ? 30 : 17, 96), new T.MeshStandardMaterial({ color: ESC.piso, roughness: 0.85, metalness: 0.25, envMapIntensity: 0.25 }));
  piso.rotation.x = -Math.PI / 2; escena.add(piso);
  const lineas = [];
  for (let i = 0; i < 48; i++) { const a = (i / 48) * Math.PI * 2; lineas.push(Math.cos(a) * 2.2, 0.012, Math.sin(a) * 2.2, Math.cos(a) * 16.5, 0.012, Math.sin(a) * 16.5); }
  const gl = new T.BufferGeometry(); gl.setAttribute("position", new T.Float32BufferAttribute(lineas, 3));

    const sel = $("#univ-seguir"); if (sel) sel.value = seguido || "";
    pintarUnivObs(seguido);
    if (seguido) { dist = 7; ultimoToque = performance.now(); }
    else dist = bots.length > 60 ? 46 : bots.length > 30 ? 36 : bots.length > 16 ? 26 : bots.length > 6 ? 19 : 14;
  }
  function caminarA(x, destinoMundo, { quedarse = false, alLlegar = null } = {}) {
    const desde = x.r.raiz.position.clone(), hasta = enLocal(x, destinoMundo);
    hasta.y = x.casa.y;
    const largo = desde.distanceTo(hasta);
    x.ruta = { desde, hasta, t0: performance.now(), dur: Math.max(900, largo * 520), quedarse, alLlegar };
  }
  const volver = (x) => caminarA(x, enMundo(x, x.casa));
  const parti = [];
  function festejar(id) {
    const x = porId(id); if (!x) return;
    x.festejo = performance.now();
    const n = 90, pos = new Float32Array(n * 3), vel = [], origen = enMundo(x, new T.Vector3(0, 1.6, -0.4));
    for (let i = 0; i < n; i++) { pos.set([origen.x, origen.y, origen.z], i * 3); const a = Math.random() * Math.PI * 2, u = Math.random() * 0.9 + 0.2; vel.push(new T.Vector3(Math.cos(a) * u * 2.2, 2.5 + Math.random() * 3, Math.sin(a) * u * 2.2)); }
    const geo = new T.BufferGeometry(); geo.setAttribute("position", new T.BufferAttribute(pos, 3));
    const mat = new T.PointsMaterial({ color: [0x6cd3f0, 0x9b7bff, 0x63d3b1, 0xffb07a][Math.floor(Math.random() * 4)], size: 0.16, transparent: true, depthWrite: false, blending: T.AdditiveBlending });
    const puntos = new T.Points(geo, mat); escena.add(puntos);
    parti.push({ puntos, vel, t0: performance.now() });
  }
  function visitar(deId, aId) {
    const de = porId(deId), a = porId(aId);
    if (!de || !a || de === a || de.sentado) return;
    const frente = enMundo(a, new T.Vector3(0, 0, 1.7));
    caminarA(de, frente, { alLlegar: () => setTimeout(() => { if (!de.sentado) volver(de); }, 1800) });
  }
  function reunir(ids, activa) {
    const xs = ids.map(porId).filter(Boolean);
    xs.forEach((x, i) => {
      if (activa) {
        const a = (i / xs.length) * Math.PI * 2;
        x.sentado = true;
        caminarA(x, new T.Vector3(Math.cos(a) * 3.4, 0, Math.sin(a) * 3.4), { quedarse: true });
      } else if (x.sentado) { x.sentado = null; volver(x); }
    });
  }
  cont.univ = { seguir, festejar, visitar, reunir, luz: (v) => { sol.intensity = 1.6 * v; } };
  for (const r of reunionesVivas()) reunir([r.facilitadorId, ...r.participantes], true);
  const cuadro = (now) => {
    if (!cont.isConnected) { ro.disconnect(); envRT.dispose(); renderer.dispose(); return; }
    const t = (now - t0) / 1000;
    if (!arrastre && !pellizco && now - ultimoToque > 2500) giro += 0.0012;
    // En pantallas verticales (celular) se aleja para que entre el anillo entero.
    const d = dist * (camara.aspect < 1 ? Math.pow(1 / camara.aspect, 0.6) : 1);
    camara.position.set(Math.cos(giro) * d * Math.cos(inclin), Math.sin(inclin) * d, Math.sin(giro) * d * Math.cos(inclin));
    // Modo observador: la cámara se acerca y gira alrededor del compañero seguido.
    const xs = seguido && porId(seguido);
    if (xs) objetivoDeseado.copy(xs.g.localToWorld(xs.r.raiz.position.clone()).setY(1.3)); else objetivoDeseado.set(0, 1.4, 0);
    objetivo.lerp(objetivoDeseado, 0.06);
    camara.position.add(objetivo).sub(new T.Vector3(0, 1.4, 0));
    camara.lookAt(objetivo);
    marca.rotation.y = t * 0.35; marca.position.y = 2.4 + Math.sin(t * 0.8) * 0.12;
    satelite.position.set(Math.cos(t * 1.3 + 0.8) * 1.5, Math.sin(t * 1.3 + 0.8) * 1.5, Math.sin(t * 0.9) * 0.35);
    satBrillo.position.copy(satelite.position); satBrillo.quaternion.copy(camara.quaternion).premultiply(marca.quaternion.clone().invert());
    anillos.forEach((a, i) => { a.material.opacity = [0.6, 0.28, 0.28, 0.22, 0.4][i] * (0.75 + 0.25 * Math.sin(t * 1.2 + i)); });
    if (now - ultimoEstado > 500) {
      ultimoEstado = now;
      for (const x of estaciones) {
        const b = bot(x.id), e = est(b), firma = `${e}|${b?.accion || ""}|${b?.tareasAbiertas || 0}|${b?.nombre}`;
        x.estado = e;
        if (firma !== x.firma) {
          x.firma = firma; dibujar(x.p, b, e);
          const c = UNIV_EST[e][1];
          x.bordeM.color.setHex(c); x.haloM.uniforms.color.value.setHex(c); x.rayoM.color.setHex(c); x.r.M.pecho.color.setHex(c);
          x.haloM.uniforms.opacidad.value = e === "idle" ? 0.25 : 0.6;
        }
      }
    }
    for (const x of estaciones) {
      const trabaja = x.estado === "work", espera = x.estado === "wait";
      // Caminata (flotando, con paso): avanza por la ruta mirando hacia donde va.
      let caminando = false;
      if (x.ruta) {
        const k = Math.min(1, (now - x.ruta.t0) / x.ruta.dur), e2 = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
        x.r.raiz.position.lerpVectors(x.ruta.desde, x.ruta.hasta, e2);
        const dx = x.ruta.hasta.x - x.ruta.desde.x, dz = x.ruta.hasta.z - x.ruta.desde.z;
        if (k < 1) { x.r.raiz.rotation.y = Math.atan2(dx, dz); caminando = true; }
        else {
          const fin = x.ruta; x.ruta = null;
          // En la sala de reuniones mira al centro; de vuelta en su estación, al frente.
          const cL = x.g.worldToLocal(new T.Vector3(0, 0, 0));
          x.r.raiz.rotation.y = fin.quedarse ? Math.atan2(cL.x - x.r.raiz.position.x, cL.z - x.r.raiz.position.z) : 0;
          fin.alLlegar?.();
        }
      }
      const fest = (now - x.festejo) / 1000;
      const festejando = fest >= 0 && fest < 2.6;
      x.r.raiz.position.y = 0.06 + (caminando ? Math.abs(Math.sin(t * 9 + x.fase)) * 0.08 : Math.sin(t * 1.4 + x.fase) * 0.04) + (festejando ? Math.abs(Math.sin(fest * 7)) * 0.35 * (1 - fest / 2.6) : 0);
      if (festejando && !x.ruta) x.r.raiz.rotation.y = fest * 5;
      else if (!x.ruta && !x.sentado && fest >= 2.6 && fest < 2.8) x.r.raiz.rotation.y = 0;
      x.balizaM.opacity = x.estado === "wait" ? 0.22 + Math.sin(t * 4 + x.fase) * 0.12 : 0;
      x.r.cabeza.rotation.y = espera ? Math.sin(t * 1.6 + x.fase) * 0.45 : trabaja ? Math.sin(t * 0.7 + x.fase) * 0.12 : Math.sin(t * 0.4 + x.fase) * 0.25;
      x.r.cabeza.rotation.x = trabaja ? 0.18 : espera ? -0.1 : 0;
      for (const a of x.r.brazos) {
        a.codo.rotation.x = trabaja ? -0.75 + Math.sin(t * 11 + x.fase + a.s * 1.7) * 0.12 : -0.75;
        a.hombro.rotation.x = festejando ? -2.7 + Math.sin(fest * 12 + a.s) * 0.3 : caminando ? Math.sin(t * 9 + a.s * Math.PI) * 0.5 : espera && a.s > 0 ? -2.3 + Math.sin(t * 4 + x.fase) * 0.25 : -0.95;
      }
      x.pantallaM.opacity = trabaja ? 0.9 + Math.sin(t * 9 + x.fase) * 0.08 : espera ? 0.8 + Math.sin(t * 3) * 0.18 : 0.75;
      x.pantalla.position.y = 2.25 + Math.sin(t * 1.1 + x.fase) * 0.04;
      x.rayoM.opacity = trabaja ? 0.14 + Math.sin(t * 9 + x.fase) * 0.05 : espera ? 0.12 : 0.05;
      x.tecladoM.opacity = trabaja ? 0.5 + Math.sin(t * 14 + x.fase) * 0.3 : 0.25;
    }
    // Partículas de festejo
    for (let i = parti.length - 1; i >= 0; i--) {
      const q = parti[i], dt = (now - q.t0) / 1000, pa = q.puntos.geometry.attributes.position;
      if (dt > 2.4) { escena.remove(q.puntos); q.puntos.geometry.dispose(); q.puntos.material.dispose(); parti.splice(i, 1); continue; }
      for (let k = 0; k < q.vel.length; k++) { pa.setXYZ(k, pa.getX(k) + q.vel[k].x * 0.016, pa.getY(k) + q.vel[k].y * 0.016, pa.getZ(k) + q.vel[k].z * 0.016); q.vel[k].y -= 6 * 0.016; }
      pa.needsUpdate = true; q.puntos.material.opacity = 1 - dt / 2.4;
    }
    renderer.render(escena, camara);
    if (!document.hidden) requestAnimationFrame(cuadro); else setTimeout(() => requestAnimationFrame(cuadro), 700);
  };
  requestAnimationFrame(cuadro);
}

// ================================================================ mapa de conocimiento
// Compañeros a la izquierda (agrupados por equipo, con su manager), proyectos a la derecha y una línea
// por cada participación (coordina o tiene tareas). Todo sale de los datos reales.
function pintarMapa() {
  const el = $("#mapa");
  if (!el) return;
  const bots = [];
  const agregar = (b, nivel) => { bots.push({ b, nivel }); for (const h of S.bots.filter((x) => x.reportaA === b.id).sort(porNombre)) agregar(h, nivel + 1); };
  for (const b of S.bots.filter((x) => !x.reportaA || !bot(x.reportaA)).sort(porNombre)) agregar(b, 0);
  const proys = (S.proyectos || []).filter((p) => p.estado !== "archivado");
  const FILA = 44, W = 720, xB = 16, xP = 470, alto = Math.max(bots.length, proys.length) * FILA + 30;
  const yB = new Map(bots.map((x, i) => [x.b.id, 24 + i * FILA]));
  const yP = new Map(proys.map((p, i) => [p.id, 24 + i * FILA]));
  const lineas = [];
  for (const p of proys) {
    const ids = new Set([p.coordinadorId, ...p.tareas.map((t) => t.asignadoA)].filter(Boolean));
    for (const id of ids) if (yB.has(id)) lineas.push({ y1: yB.get(id), y2: yP.get(p.id), coord: id === p.coordinadorId });
  }
  const txt = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const svg = `<svg viewBox="0 0 ${W} ${alto}" width="100%" role="img" aria-label="Mapa: ${bots.length} compañeros y ${proys.length} proyectos" style="max-width:${W}px;display:block">
    ${lineas.map((l) => `<path d="M${xB + 230} ${l.y1} C ${xB + 330} ${l.y1}, ${xP - 100} ${l.y2}, ${xP} ${l.y2}" fill="none" stroke="var(${l.coord ? "--sig" : "--ion"})" stroke-opacity="${l.coord ? 0.75 : 0.45}" stroke-width="${l.coord ? 2 : 1.5}"/>`).join("")}
    ${bots.map(({ b, nivel }) => { const y = yB.get(b.id), x = xB + nivel * 18; return `${nivel ? `<path d="M${x - 10} ${y - FILA + 12} V ${y} H ${x}" fill="none" stroke="var(--line2)"/>` : ""}<a href="#/chats/${b.id}"><rect x="${x}" y="${y - 15}" width="${230 - nivel * 18}" height="30" rx="15" fill="var(--s2)" stroke="var(--line2)"/><circle cx="${x + 15}" cy="${y}" r="5" fill="var(${est(b) === "work" ? "--ion" : est(b) === "wait" ? "--sig" : "--tx3"})"/><text x="${x + 28}" y="${y + 4}" font-size="12.5" fill="var(--tx)">${txt(b.nombre)}<tspan fill="var(--tx3)"> · ${txt(b.titulo).slice(0, 22)}</tspan></text></a>`; }).join("")}
    ${proys.map((p) => { const y = yP.get(p.id); return `<a href="#/proyectos/${p.id}"><rect x="${xP}" y="${y - 15}" width="234" height="30" rx="8" fill="var(--s1)" stroke="var(--line2)"/><text x="${xP + 12}" y="${y + 4}" font-size="12.5" fill="var(--tx)">${txt(p.nombre).slice(0, 26)}<tspan fill="var(--tx3)"> · ${p.progreso.porcentaje}%</tspan></text></a>`; }).join("")}
  </svg>`;
  pintar(el, html`<header class="pag-h"><div class="tt"><h1>Mapa</h1><p>Quién trabaja con quién (por equipo) y en qué proyectos. Naranja: coordina; cian: tiene tareas. Tocá un nombre para abrirlo.</p></div></header>
    ${bots.length || proys.length ? html`<div class="card" style="margin-top:14px;overflow-x:auto">${crudo(svg)}</div>` : html`<div class="vacio-p" style="margin-top:14px"><b>Todavía no hay nada que mapear</b><span>Armá un equipo o un proyecto.</span></div>`}`);
}

// ================================================================ Gravity Architect
// Objetivo → propuesta del modelo (no crea nada) → revisar, sacar miembros → crear. Al crear, el
// equipo arranca con las primeras tareas del proyecto.
const ARQ = { objetivo: "", propuesta: null, cargando: false, fuera: new Set() };
function pintarArq() {
  const el = $("#arq");
  if (!el) return;
  const p = ARQ.propuesta;
  const grupo = (id) => (S.gruposHerramientas || []).find((g) => g.id === id)?.nombre || id;
  const persona = (m, i) => html`<article class="tk"><div class="tk-h"><b>${m.nombre} · ${m.titulo}</b>${i === null ? html`<span class="tag">Manager</span>` : html`<label class="chk" style="margin:0"><input type="checkbox" data-c="arq-incluir" data-i="${i}" ${si(!ARQ.fuera.has(i), "checked")}><span>Incluir</span></label>`}</div>
    <p class="muted" style="margin:0;font-size:13px">${m.descripcion}</p>
    <span class="tk-m">${m.temporal ? html`<span class="tag">Temporal</span>` : ""}${m.apagar.length ? `Sin: ${m.apagar.map(grupo).join(" · ")}` : "Con todas las herramientas"}</span></article>`;
  pintar(el, html`<header class="pag-h"><div class="tt"><span class="micro">Gravity Architect</span><h1>Contá qué querés lograr</h1><p>Te propongo un equipo con sus puestos, qué herramientas necesita cada uno (lo mínimo), rutinas, un proyecto con tareas y el flujo de trabajo. No se crea nada hasta que lo apruebes.</p></div></header>

    <div class="sec-h"><h2>En espera <span>${abiertas.length + S.aprobaciones.length}</span></h2>${S.aprobaciones.length ? html`<a class="btn out sm" href="#/aprobaciones">Ver aprobaciones</a>` : ""}</div>

      const max = Math.max(1, ...xs.map((e) => e.tareasCompletas + e.tareasTrabadas));

    })() : ""}

    ${(S.actividad || []).length ? html`<ul class="hist">${S.actividad.map((x) => html`<li><span class="tag ${x.ok ? "" : "sig"}">${x.tipo === "aprobacion" ? (x.ok ? "Aprobado" : "Negado") : x.ok ? "OK" : "Error"}</span> <b>${bot(x.botId)?.nombre || "Un compañero"}</b> · ${x.que} <small class="muted">· ${diaHora(x.fecha)}${!x.ok && x.detalle ? ` — ${x.detalle.slice(0, 140)}` : ""}</small></li>`)}</ul>` : html`<p class="muted" style="font-size:13px">Todavía no hay acciones registradas.</p>`}
    <div class="sec-h"><h2>Rendimiento</h2><button class="btn out sm" data-a="rendimiento">${ico("refresh", "s")}${r ? "Actualizar" : "Medir"}</button></div>

// ================================================================ proyectos
// Un objetivo con tareas (responsable, dependencias, prioridad, plazo y criterio de «listo»). El progreso
// sale de las tareas completadas. Cuando una tarea queda lista, el motor se la pasa a su responsable.
const EST_TAREA = { pendiente: "Pendiente", planificando: "Planificando", en_curso: "En curso", verificando: "Verificando", esperando_aprobacion: "Espera aprobación", pausada: "Pausada", reintentando: "Reintentando", completada: "Completada", fallida: "Falló", cancelada: "Cancelada" };
const EST_PROY = { activo: "Activo", pausado: "Pausado", terminado: "Terminado", archivado: "Archivado" };
const CERRADA = (t) => t.estado === "completada" || t.estado === "fallida" || t.estado === "cancelada";
async function cargarProyectos() {
  try { S.proyectos = await api("GET", "/api/proyectos"); } catch (err) { fallo(err); S.proyectos ??= []; }
  programar("proyectos");
}
function guardarProyecto(p) {
  S.proyectos ??= [];
  const i = S.proyectos.findIndex((x) => x.id === p.id);
  if (i >= 0) S.proyectos[i] = p; else S.proyectos.unshift(p);
  programar("proyectos");
}
function montarProyectos() {
  $("#vista").innerHTML = `<div class="pag"><div class="pag-in" id="proys"></div></div>`;
  if (S.proyectos) pintarProyectos(); else $("#proys").innerHTML = `<div class="carga" role="status">Cargando proyectos…</div>`;
  cargarProyectos();
}
function pintarProyectos() {
  const el = $("#proys");
  if (!el || !S.proyectos) return;
  if (S.ruta.id) return pintarProyecto(el, S.proyectos.find((x) => x.id === S.ruta.id));
  const todas = [...new Set(S.proyectos.flatMap((p) => p.etiquetas || []))].sort();
  if (S.proyEtiqueta && !todas.includes(S.proyEtiqueta)) S.proyEtiqueta = null;
  const xs = S.proyectos.filter((p) => p.estado !== "archivado" && (!S.proyEtiqueta || (p.etiquetas || []).includes(S.proyEtiqueta)));
  const archivados = S.proyectos.filter((p) => p.estado === "archivado").length;
  pintar(el, html`<header class="pag-h"><div class="tt"><h1>Proyectos</h1><p>Un objetivo con sus tareas, responsables y dependencias. Cuando una tarea queda lista para arrancar, Gravity se la pasa a quien la tiene.</p></div>
    <div class="acts"><button class="btn pri" data-a="nuevo-proyecto">${ico("plus", "s")}Nuevo proyecto</button></div></header>
    ${todas.length ? html`<div class="chips" role="group" aria-label="Filtrar por etiqueta" style="margin-top:14px"><button class="chip" data-a="proy-etq" data-v="" aria-pressed="${String(!S.proyEtiqueta)}">Todos</button>${todas.map((e) => html`<button class="chip" data-a="proy-etq" data-v="${e}" aria-pressed="${String(S.proyEtiqueta === e)}">${e}</button>`)}</div>` : ""}
    ${xs.length ? html`<div class="proys" style="margin-top:18px">${xs.map(tarjetaProyecto)}</div>` : html`<div class="vacio-p" style="margin-top:18px"><b>Todavía no hay proyectos</b><span>Creá uno con su objetivo y agregale tareas, o pedíselo a un compañero: ellos también pueden armarlos y avanzar sus tareas.</span></div>`}
    ${archivados ? html`<p class="muted" style="font-size:13px;margin-top:12px">${plural(archivados, "proyecto archivado", "proyectos archivados")}: cambiá su estado para verlo acá.</p>${S.proyectos.filter((p) => p.estado === "archivado").map((p) => html`<a class="btn ghost sm" href="#/proyectos/${p.id}">${p.nombre}</a>`)}` : ""}`);
}
function tarjetaProyecto(p) {
  const g = p.progreso;
  return html`<a class="proy" href="#/proyectos/${p.id}"><b>${p.nombre}</b><span class="barra" role="img" aria-label="${g.porcentaje}% completado"><i style="width:${g.porcentaje}%"></i></span>
    <span class="tk-m"><span>${g.hechas} de ${plural(g.total, "tarea", "tareas")}</span>${g.bloqueadas ? html`<span class="tag sig">${plural(g.bloqueadas, "bloqueada", "bloqueadas")}</span>` : ""}${g.vencidas ? html`<span class="tag sig">${plural(g.vencidas, "vencida", "vencidas")}</span>` : ""}${p.estado !== "activo" ? html`<span class="tag">${EST_PROY[p.estado]}</span>` : ""}${p.coordinadorId && bot(p.coordinadorId) ? html`<span>Coordina ${bot(p.coordinadorId).nombre}</span>` : ""}${(p.etiquetas || []).map((e) => html`<span class="tag">${e}</span>`)}</span></a>`;
}
function pintarProyecto(el, p) {
  if (!p) { pintar(el, html`<div class="vacio-p"><b>No existe ese proyecto</b><span>Puede que lo hayan borrado.</span><a class="btn out sm" href="#/proyectos">Volver a Proyectos</a></div>`); return; }
  const g = p.progreso;
  const titulo = (id) => p.tareas.find((x) => x.id === id)?.titulo || id;
  const lista = (t) => t.dependeDe.every((d) => p.tareas.find((x) => x.id === d)?.estado === "completada");
  const opcBots = (sel) => html`<option value="">Sin responsable</option>${S.bots.map((b) => html`<option value="${b.id}" ${si(sel === b.id, "selected")}>${b.nombre} · ${b.titulo}</option>`)}`;
  const tarea = (t) => {
    const bloq = t.estado === "pendiente" && !lista(t);
    const etiqueta = bloq ? "Bloqueada" : EST_TAREA[t.estado] || t.estado;
    return html`<article class="tk ${bloq ? "bloq" : ""}"><div class="tk-h"><b>${t.titulo}</b><span class="tag ${bloq || t.estado === "fallida" ? "sig" : ""}">${etiqueta}</span></div>

// ================================================================ diálogos
const dlg = () => $("#dlg");
let alCerrarDlg = null, cierresIgnorados = 0;
// Con un diálogo abierto, «atrás» (el del celular o el del navegador) lo cierra en vez de cambiar de
// pantalla: al abrir se suma una entrada al historial y al cerrar se saca.
let dlgHist = false, volviendo = false, irPendiente = null;
function soltarHistoria() {
  if (!dlgHist) return;
  dlgHist = false;
  volviendo = true;
  history.back();
  setTimeout(terminarVuelta, 500); // por si el navegador no avisa
}
function terminarVuelta() {
  if (!volviendo) return;
  volviendo = false;
  const h = irPendiente;
  irPendiente = null;
  if (h) ir(h);
}
window.addEventListener("popstate", () => {
  if (volviendo) { terminarVuelta(); return; }
  if (dlgHist) { dlgHist = false; if (dlg().open) dlg().close(); }
});
function abrirDialogo(contenido, chico = false, alCerrar = null) {
  const d = dlg();
  // Uno reemplaza a otro (p. ej. una hoja que abre una confirmación): el anterior se cierra sin
  // que su aviso de cierre borre al nuevo.
  if (d.open) { const f = alCerrarDlg; alCerrarDlg = null; cierresIgnorados++; d.close(); f?.(); }
  d.className = `dlg ${chico ? "chico" : ""}`;
  d.innerHTML = val(contenido);
  alCerrarDlg = alCerrar;
  const foco = d.querySelector("[autofocus]") || d.querySelector("input:not([type=hidden]):not([type=radio]):not([type=checkbox]),select,textarea,button");
  // En el celular el teclado no se abre solo (taparía media hoja): el foco va a la hoja.
  const sinTeclado = celular() && foco?.matches("input,textarea,select");
  if (sinTeclado) { foco.removeAttribute("autofocus"); const f = d.querySelector(".dlg-f"); if (f) { f.tabIndex = -1; f.setAttribute("autofocus", ""); } }
  d.showModal();
  if (!dlgHist && !volviendo) { history.pushState({ dlg: true }, "", location.href); dlgHist = true; }
  if (!sinTeclado) foco?.focus();
}
function cerrarDialogo() { const d = dlg(); if (d.open) { soltarHistoria(); d.close(); } }
dlg().addEventListener("close", () => {
  if (cierresIgnorados) { cierresIgnorados--; return; }
  soltarHistoria();
  const f = alCerrarDlg; alCerrarDlg = null; dlg().innerHTML = ""; f?.();
});
dlg().addEventListener("click", (e) => { if (e.target === dlg()) cerrarDialogo(); });
function confirmar(titulo, texto, si_ = "Confirmar", peligro = false) {
  return new Promise((res) => {
    let ok = false;
    abrirDialogo(html`<form class="dlg-f" data-f="confirmar"><h2 id="dlg-t">${titulo}</h2><p>${texto}</p><div class="acts"><button type="button" class="btn ghost" data-a="cerrar-dlg">Cancelar</button><button class="btn ${peligro ? "out" : "pri"}" autofocus>${si_}</button></div></form>`, true, () => res(ok));
    F.confirmar = () => { ok = true; cerrarDialogo(); };
  });
}

function nombresLibres(n, extra = []) {
  const usados = new Set([...S.bots.map((b) => norm(b.nombre)), ...extra.map(norm)]);
  const out = [];
  for (const x of S.nombres) { if (out.length >= n) break; if (!usados.has(norm(x))) { out.push(x); usados.add(norm(x)); } }
  let i = 2;
  while (out.length < n) { for (const x of S.nombres) { if (out.length >= n) break; const y = `${x} ${i}`; if (!usados.has(norm(y))) { out.push(y); usados.add(norm(y)); } } i++; }
  return out;
}

  pintarPrevEquipo();

const MAX_PUESTO = 29;
const totalEquipo = () => 1 + CE.cant.reduce((a, b) => a + b, 0);
function pintarPrevEquipo() {
  const f = $("#dlg form[data-f=crear-equipo]");
  if (!f || !CE.tpl) return;
  const t = CE.tpl;
  const mn = f.mNombre.value.trim() || "Manager";
  const total = totalEquipo(), tope = topeEquipo();
  // Los mismos nombres que va a elegir el motor (misma lista y mismo orden).
  const nombres = nombresLibres(total - 1, [mn]);
  const ms = [];
  let k = 0;
  t.miembros.forEach((p, i) => { for (let j = 0; j < CE.cant[i]; j++) ms.push({ id: `ce-${k}`, nombre: nombres[k++], cargo: "miembro", titulo: p.titulo }); });
  hue.set("ce-m", HUES[(S.bots.filter((b) => b.cargo === "manager").length) % HUES.length]);
  ms.forEach((x) => hue.set(x.id, hue.get("ce-m")));
  const lista = [`${mn} · ${f.mTitulo.value}`, ...ms.map((x) => `${x.nombre} · ${x.titulo}`)];
  pintar($("#ce-prev"), html`${orbita(av({ id: "ce-m", nombre: mn, cargo: "manager" }, 40, { s: "idle" }), ms, 200, { fantasma: true })}<p>Así queda la órbita nueva</p><ul>${lista.slice(0, 12).map((x) => html`<li>${x}</li>`)}${lista.length > 12 ? html`<li>y ${lista.length - 12} más</li>` : ""}</ul>`);
  const pasa = total > tope;
  const tot = $("#ce-tot");
  tot.className = `tot-eq ${pasa ? "tope" : ""}`;
  tot.innerHTML = html`<span>Total: <b>${plural(total, "compañero", "compañeros")}</b> (1 manager + ${total - 1})</span><span>${pasa ? (tope < (S.limites.maxEquipo || 30) ? `Quedan ${lugaresLibres()} lugares en Gravity` : `Máximo ${tope} por equipo`) : `Máximo ${tope}${tope < (S.limites.maxEquipo || 30) ? " (lugares libres)" : " por equipo"}`}</span>`.s;
  for (const [i, n] of CE.cant.entries()) {
    const menos = f.querySelector(`[data-a=ce-cant][data-n="${i}"][data-d="-1"]`), mas = f.querySelector(`[data-a=ce-cant][data-n="${i}"][data-d="1"]`);
    if (menos) menos.disabled = n <= 1;
    if (mas) mas.disabled = n >= MAX_PUESTO || total >= tope;
  }
  const ok = $("#ce-ok");
  ok.textContent = `Crear ${plural(total, "compañero", "compañeros")}`;
  ok.disabled = pasa;
}
function cambiarCant(i, n, escribiendo = false) {
  const f = $("#dlg form[data-f=crear-equipo]");
  if (!f) return;
  n = Math.round(Number(n));
  if (!Number.isFinite(n)) return;
  n = Math.max(1, Math.min(MAX_PUESTO, n));
  CE.cant[i] = n;
  if (!escribiendo || String(n) !== f[`cant${i}`].value) f[`cant${i}`].value = n;
  pintarPrevEquipo();
}

// Envolvente aproximada (0..1 cada 20 ms) sacada del texto, para cuando la voz no da el audio: un pulso por
// sílaba (la acentuada más fuerte) y bajadas en los espacios y la puntuación.
function envolventeAprox(texto, velocidad = 1) {
  const paso = 20, env = [], marcas = [];
  const v = Math.max(0.5, Math.min(2, Number(velocidad) || 1));
  const msLetra = 1000 / (14.5 * v);
  const empujar = (ms, f) => { const n = Math.max(1, Math.round(ms / paso)); for (let k = 0; k < n; k++) env.push(f(n > 1 ? k / (n - 1) : 0.5)); };
  const re = /([\p{L}\p{N}]+)|([.!?…]+)|([,;:—–]+)|(\s+)/gu;
  let m;
  while ((m = re.exec(String(texto)))) {
    if (m[1]) {
      marcas.push({ i: m.index, ms: env.length * paso });
      const w = m[1];
      const grupos = [...w.matchAll(/[aeiouáéíóúü]+/giu)];
      const sil = Math.max(1, grupos.length);
      let tonica = grupos.findIndex((g) => /[áéíóú]/iu.test(g[0]));
      if (tonica < 0) tonica = sil > 1 ? sil - 2 : 0;
      const msSil = (w.length * msLetra) / sil;
      for (let k = 0; k < sil; k++) {
        const pico = (k === tonica ? 0.92 : 0.6) * (0.88 + Math.min(0.12, w.length / 50));
        empujar(msSil, (x) => 0.06 + pico * Math.pow(Math.sin(Math.PI * Math.min(1, x * 1.1)), 0.8));
      }
    } else if (m[2]) empujar(330 / v, () => 0.02);
    else if (m[3]) empujar(160 / v, () => 0.03);
    else if (m[4]) empujar(35 / v, () => 0.1);
  }
  return { envolvente: env.map((x) => Math.round(Math.min(1, x) * 100) / 100), pasoMs: paso, duracionMs: env.length * paso, marcas };
}

// ================================================================ llamada: del texto del compañero a oraciones habladas
const POSITIVO = /\b(genial|listo|perfecto|excelente|buen[ií]simo|b[áa]rbaro|claro que s[ií]|dale|joya|hecho|me alegra|qu[ée] bueno|de nada|encantad[oa])\b/i;
function limpiarParaVoz(s) {
  return String(s)
    .replace(/!\[[^\]]*\]\([^)]*\)/g, "")
    .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
    .replace(/https?:\/\/[^\s)]+/g, "el enlace que te dejé en el chat")
    .replace(/`([^`\n]{1,40})`/g, "$1")
    .replace(/`[^`\n]*`?/g, " ")
    .replace(/^\s{0,3}#{1,6}\s+/gm, "")
    .replace(/^\s*>\s?/gm, "")
    .replace(/^\s*(?:[-*+•]|\d{1,3}[.)])\s+/gm, "")
    .replace(/(\*\*|__)(.+?)\1/g, "$2")
    .replace(/(^|[\s(])[*_]([^*_\n]+)[*_](?=[\s).,;:!?]|$)/g, "$1$2")
    .replace(/~~(.+?)~~/g, "$1")
    .replace(/\*+/g, "")
    .replace(/\s*\|\s*/g, ", ")
    .replace(/[\p{Extended_Pictographic}️‍]/gu, "")
    .replace(/\s+/g, " ")
    .trim();
}
// Saca las oraciones completas que haya en t.buf desde t.pos (con final, también lo que quede).
// Los bloques de código y las tablas no se leen: se avisa una vez que quedaron en el chat.
function extraerOraciones(t, final) {
  const out = [];
  const menciona = /\ben el chat\b/i;
  for (let vueltas = 0; vueltas < 200; vueltas++) {
    const resto = t.buf.slice(t.pos);
    if (!resto.trim()) { if (final) t.pos = t.buf.length; break; }
    const valla0 = /^\s*```/.exec(resto);
    if (valla0) {
      const cierre = resto.indexOf("```", valla0[0].length);
      if (cierre < 0 && !final) break;
      t.pos += cierre < 0 ? resto.length : cierre + 3;
      if (!t.codigo) { t.codigo = true; if (!menciona.test(t.buf.slice(t.pos))) out.push("Te dejé el código en el chat."); }
      continue;
    }
    if (/^\s*\|/.test(resto)) {
      const nl = resto.indexOf("\n");
      if (nl < 0 && !final) break;
      t.pos += nl < 0 ? resto.length : nl + 1;
      if (!t.tabla) { t.tabla = true; out.push("Te dejé una tabla en el chat."); }
      continue;
    }
    const valla = resto.indexOf("```");
    const tramo = valla < 0 ? resto : resto.slice(0, valla);
    const re = /[.!?…]+["»”')\]]*(?=\s)|\n/g;
    let m, corte = -1;
    while ((m = re.exec(tramo))) {
      const antes = tramo.slice(0, m.index);
      if (m[0] !== "\n" && /(^|\n)\s*\d{1,3}$/.test(antes)) continue; // "1." de una lista
      if (m[0] !== "\n" && /\b(?:Sr|Sra|Dr|Dra|etc|ej|aprox|vs|Ud|Uds|pág|núm)$/i.test(antes)) continue;
      corte = m.index + m[0].length;
      break;
    }
    if (corte < 0) {
      if (valla >= 0) corte = valla;
      else if (final) corte = tramo.length;
      else if (tramo.length > 240) { const c = Math.max(tramo.lastIndexOf(", ", 220), tramo.lastIndexOf("; ", 220)); if (c > 60) corte = c + 1; else break; }
      else break;
    }
    if (corte <= 0) { t.pos += Math.max(1, corte); continue; }
    const crudo_ = tramo.slice(0, corte);
    t.pos += corte;
    const limpio = limpiarParaVoz(crudo_);
    if (/[\p{L}\p{N}]/u.test(limpio)) out.push(limpio);
  }
  return out;
}

function escucharLlamada(demora = 0) {
  clearTimeout(LL.timer);
  if (!LL.activa) return;
  if (aprobacionesDe(LL.botId).length) return fijarFase("aprobacion");
  if (!LL.info.stt) return fijarFase(LL.info.tts ? "escribir" : "sin-voz");
  if (LL.fatal) return;
  if (!LL.mic) return fijarFase("silenciada");
  const ya = () => {
    if (!LL.activa || !LL.mic || LL.fatal) return;
    LL.parcial = ""; pintarParcial();
    fijarFase("escuchando", { sub: LL.sub && LL.fase === "escuchando" ? LL.sub : "" });
    LL.oyendo = true;
    try { Voz.escuchar(LL.idioma || LL.info.idioma); } catch (err) { errorVozLlamada({ origen: "stt", codigo: "inicio", mensaje: String(err?.message || err) }); }

function eventoVoz(e) {

      break;
    }
    case "silencio": LL.oyendo = false; if (LL.fase === "escuchando") { LL.sub = "No te escuché: hablá cuando quieras."; pintarEstadoLlamada(); escucharLlamada(350); } break;
    case "hablando": hablandoLlamada(e); break;
    case "posicion": LL.motor?.cerebro.sincronizar(String(e.id), Number(e.ms)); break;
    case "fin": finVozLlamada(e); break;
    case "error": errorVozLlamada(e); break;
  }
}
function errorVozLlamada(e) {
  if (e.origen === "tts") {
    // Esa frase no salió: queda escrita y se sigue con la próxima.
    LL.sub = "No pude decir una parte: está escrita abajo.";
    if (e.id) finVozLlamada({ id: String(e.id), cortado: true });
    pintarEstadoLlamada();
    return;
  }
  const cod = String(e.codigo ?? "");
  if (SILENCIO_STT.has(cod)) return eventoVoz({ tipo: "silencio" });
  LL.oyendo = false;
  if (LL.fase !== "escuchando" && LL.fase !== "iniciando") return;
  const causa = CAUSA_STT[cod] || e.mensaje || `El reconocimiento de voz falló (${cod || "sin código"}).`;
  if (FATAL_STT.has(cod)) {
    LL.fatal = true;
    fijarFase("error", { causa });
    return;
  }
  // Pasajero (red, ocupado): se reintenta solo un par de veces.
  if (++LL.errores <= 3) { fijarFase("escuchando", { sub: `${causa} Reintento…` }); LL.timer = setTimeout(() => escucharLlamada(), 1200 * LL.errores); return; }
  fijarFase("error", { causa });
}

async function fotoComoJpeg(archivo, lado = 1280) {
  const img = await createImageBitmap(archivo);
  const k = Math.min(1, lado / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  img.close?.();
  for (const q of [0.82, 0.7, 0.55, 0.4]) {
    const url = c.toDataURL("image/jpeg", q);
    const b64 = url.slice(url.indexOf(",") + 1);
    if (b64.length * 0.75 < 680_000) return b64;
  }
  throw new Error("demasiado grande");
}
async function enviarLlamada(texto, foto = null) {
  const b = bot(LL.botId);
  if (!b || !LL.activa) return;
  clearTimeout(LL.timer);
  if (LL.oyendo) { LL.oyendo = false; try { Voz.dejarDeEscuchar(); } catch {} }
  const t = { id: `${LL.id}-${++LL.n}`, texto, abierto: false, terminado: false, enviado: false, cortado: false, buf: "", pos: 0, base: 0, dichas: [], vistas: new Set(), codigo: false, tabla: false };
  LL.turno = t;
  LL.parcial = ""; pintarParcial();
  agregarTrans("vos", texto);
  fijarFase("enviando");
  const ocupado = b.estado !== "libre";
  try {
    if (foto) await api("POST", `/api/bots/${b.id}/foto`, { datos: foto, llamada: t.id });
    else await api("POST", `/api/bots/${b.id}/mensajes`, { texto, llamada: t.id });
    t.enviado = true;
    if (LL.turno === t && !t.abierto && LL.fase === "enviando") fijarFase(ocupado ? "cola" : "pensando");
  } catch (err) {
    if (LL.turno !== t || !LL.activa) return;
    LL.turno = null;
    fijarFase("error", { causa: err.message || "No se pudo mandar el mensaje.", sub: "Vuelvo a escucharte en unos segundos." });
    LL.timer = setTimeout(() => { if (LL.activa && LL.fase === "error" && !LL.fatal) escucharLlamada(); }, 4000);
  }
}

// Eventos del chat del compañero (los mismos que pinta el chat).
function sseLlamada(tipo, d) {
  if (!LL.activa || !d || d.botId !== LL.botId) return;
  const t = LL.turno;
  const vivo = !!t && t.abierto && !t.terminado;
  if (tipo === "cambio") {
    if (d.inicio) {
      if (t && !t.terminado && d.llamada === t.id) { t.abierto = true; t.buf = ""; t.pos = 0; t.base = 0; if (LL.fase === "enviando" || LL.fase === "cola") fijarFase("pensando"); }
      else if (vivo) terminarTurno(t); // arrancó otra cosa: lo nuestro ya terminó
    } else if (vivo) { decirPendiente(t, true); t.base = t.buf.length; } // terminó un mensaje del compañero
  } else if (tipo === "delta") {
    if (vivo) { t.buf += String(d.texto || ""); decirPendiente(t, false); }
  } else if (tipo === "delta-reinicio") {
    if (vivo) { t.buf = t.buf.slice(0, t.base); t.pos = Math.min(t.pos, t.base); }
  } else if (tipo === "estado") {
    if (vivo && d.estado === "libre") terminarTurno(t);
    else if (t && t.enviado && !t.abierto && !t.terminado && d.estado === "libre") {
      // Lo nuestro nunca arrancó (lo detuvieron): se vuelve a escuchar.
      setTimeout(() => { if (LL.activa && LL.turno === t && !t.abierto && !t.terminado && bot(LL.botId)?.estado === "libre") { t.terminado = true; seguirDespuesDeHablar(); } }, 1500);
    }
    if (LL.fase === "pensando" || LL.fase === "cola") pintarEstadoLlamada();
  } else if (tipo === "aprobacion") avisarAprobacionLlamada(d);
}
function decirPendiente(t, final) {
  if (t.cortado) { t.pos = t.buf.length; return; }
  for (const o of extraerOraciones(t, final)) {
    const k = norm(o);
    if (t.vistas.has(k)) continue; // un reintento del modelo repite lo que ya se dijo
    t.vistas.add(k);
    decirLlamada(o, t);
  }
}
function decirLlamada(texto, turno = null) {
  const id = `${LL.id}-o${++LL.k}`;
  if (turno) { turno.dichas.push(id); agregarTrans("bot", texto, id, turno.id); }
  else agregarTrans("sis", texto, id);
  if (!LL.info.tts) return;
  LL.voces.set(id, { texto, turno });
  try { Voz.hablar(id, texto, { voz: LL.av.voz || vozParaIdioma(LL.info.voces, LL.idioma), velocidad: LL.av.velocidad, tono: LL.av.tono || 1, idioma: LL.idioma }); }
  catch (err) { console.warn(err); LL.voces.delete(id); }
}
async function terminarTurno(t) {
  if (t.terminado) return;
  decirPendiente(t, true);
  t.terminado = true;
  // Interrumpido: ya se está escuchando otra vez (o hay otro turno), no hay nada que retomar.
  if (t.cortado || LL.turno !== t) return;
  if (!t.dichas.length) {
    // No llegó texto en vivo (o se perdió en una reconexión): se lee lo que quedó en el chat.
    try {
      const items = await api("GET", `/api/bots/${LL.botId}/conversacion`);
      if (!LL.activa || LL.turno !== t) return;
      let i = items.length - 1;
      while (i >= 0 && !(items[i].tipo === "usuario" && items[i].texto === t.texto)) i--;
      const despues = i >= 0 ? items.slice(i + 1) : [];
      const txt = despues.filter((x) => x.tipo === "bot").map((x) => x.texto).join("\n\n");
      if (txt) { t.buf = txt; t.pos = 0; t.cortado = false; for (const o of extraerOraciones(t, true)) decirLlamada(o, t); }
      else { const av_ = despues.find((x) => x.tipo === "aviso"); if (av_) decirLlamada(av_.error ? `No pude responder: ${av_.texto}` : av_.texto, t); }
    } catch {}
  }
  if (!LL.voces.size) seguirDespuesDeHablar();
}
function hablandoLlamada(e) {
  const id = String(e.id ?? "");
  const v = LL.voces.get(id);
  if (!v || !LL.activa) return;
  marcarOracion(id, "on");
  let env = Array.isArray(e.envolvente) ? e.envolvente : [];
  let paso = Number(e.pasoMs) || 20;
  const dur = Number(e.duracionMs) || 0;
  if (!env.length) {
    // El puente no mandó la envolvente: se estima del texto y se estira a la duración real.
    const ap = envolventeAprox(v.texto, LL.av.velocidad);
    env = ap.envolvente;
    paso = dur > 0 && ap.duracionMs > 0 ? (ap.pasoMs * dur) / ap.duracionMs : ap.pasoMs;
  }
  const t = v.turno;
  const resp = t ? t.buf : v.texto;
  const completa = !t || t.terminado || t.buf.length === t.base;
  const entusiasmo = /[¡!]/.test(v.texto) || (completa && resp.length <= 140 && POSITIVO.test(resp));
  fijarFase("hablando", { robot: entusiasmo ? "entusiasmado" : "hablando" });
  LL.motor?.cerebro.audio({ id, env, paso, t0: performance.now(), texto: v.texto });
}
function finVozLlamada(e) {
  const id = String(e.id ?? "");
  if (!LL.voces.has(id)) return;
  LL.voces.delete(id);
  marcarOracion(id, "dicha");
  const c = LL.motor?.cerebro;
  if (c?.pista?.id === id) c.audio(null);
  if (!LL.voces.size) seguirDespuesDeHablar();
}
function seguirDespuesDeHablar() {
  if (!LL.activa || LL.voces.size || LL.oyendo) return;
  if (aprobacionesDe(LL.botId).length) return fijarFase("aprobacion");
  const t = LL.turno;
  if (t && !t.terminado && !t.cortado) return fijarFase(t.abierto || LL.fase !== "cola" ? "pensando" : "cola");
  // Terminó de responder: asiente una vez antes de volver a escuchar.
  if (t?.terminado && !t.cortado && !t.reaccion && !matchMedia("(prefers-reduced-motion: reduce)").matches) { t.reaccion = true; LL.motor?.cerebro.probarGesto("asentir"); }
  escucharLlamada(220);
}
function avisarAprobacionLlamada(a) {
  pintarAprobLlamada();
  if (!a?.id || LL.apAvisadas.has(a.id)) return;
  LL.apAvisadas.add(a.id);
  clearTimeout(LL.timer);
  if (LL.oyendo) { LL.oyendo = false; try { Voz.dejarDeEscuchar(); } catch {} }
  const titulo = String(a.titulo || "seguir").replace(/\.$/, "");
  decirLlamada(`Necesito tu aprobación para ${minus1(titulo)}. Aprobalo o negalo en la pantalla.`);
  if (LL.fase !== "hablando") fijarFase("aprobacion");
}
function aprobacionResueltaLlamada() {
  pintarAprobLlamada();
  if (LL.fase === "aprobacion" && !aprobacionesDe(LL.botId).length) seguirDespuesDeHablar();
}
function interrumpirLlamada(reescuchar = true) {
  if (!LL.activa) return;
  if (LL.fase === "escuchando" && !LL.voces.size) return;
  if (LL.voces.size) { try { Voz.callar(); } catch {} }
  for (const id of LL.voces.keys()) marcarOracion(id, "dicha");
  LL.voces.clear();
  if (LL.turno && !LL.turno.terminado) LL.turno.cortado = true;
  LL.motor?.cerebro.audio(null);
  if (reescuchar) escucharLlamada(120);
}
function alternarMicrofono() {
  if (!LL.activa) return;
  LL.mic = !LL.mic;
  if (!LL.mic) { clearTimeout(LL.timer); LL.oyendo = false; try { Voz.dejarDeEscuchar(); } catch {} LL.parcial = ""; pintarParcial(); if (LL.fase === "escuchando" || LL.fase === "error") { LL.fatal = false; fijarFase("silenciada"); } }
  else if (LL.fase === "silenciada") escucharLlamada();
  pintarControlesLlamada();
}
function alternarAltavoz() {
  if (!LL.activa || LL.altavoz === null) return;
  if (Voz.altavoz(!LL.altavoz)) LL.altavoz = !LL.altavoz;
  pintarControlesLlamada();
}
function colgarLlamada() {
  if (!LL.activa) { ir("#/chats"); return; }
  const id = LL.botId, dur = reloj(LL.inicio), dichos = LL.n || 0;
  cerrarLlamada();
  // Resumen automático: si hubo charla (2 o más cosas dichas), el compañero deja en el chat las
  // decisiones, notas y tareas que salieron. Es un mensaje normal: se ve y se puede seguir desde ahí.
  if (dichos >= 2) {
    api("POST", `/api/bots/${id}/mensajes`, { texto: "[Fin de la llamada] Resumí lo que hablamos en la llamada: decisiones, notas y tareas que salieron (quién hace qué). Si alguna tarea es tuya, anotala o arrancala; no repitas lo que ya dijiste." }).catch(fallo);
    toast(`Llamada terminada (${dur}). Te dejo el resumen en el chat.`);
  } else toast(`Llamada terminada (${dur}). Quedó todo en el chat.`);
  ir(`#/chats/${id}`);
}
function cerrarLlamada() {
  if (!LL.activa) return;
  LL.activa = false;
  LL.oyendo = false;
  clearTimeout(LL.timer);
  try { Voz.callar(); } catch {}
  try { Voz.dejarDeEscuchar(); } catch {}
  LL.desuscribir?.(); LL.desuscribir = null;
  LL.motor?.destruir(); LL.motor = null;
  LL.voces.clear(); LL.turno = null;
  try { LL.wake?.release?.()?.catch?.(() => {}); } catch {}
  LL.wake = null;
  document.body.classList.remove("en-llamada");
}
// Que no se apague la pantalla durante la llamada (donde se pueda).
async function pedirPantallaPrendida() {
  try { if (LL.activa && !document.hidden && navigator.wakeLock && !LL.wake) { LL.wake = await navigator.wakeLock.request("screen"); LL.wake.addEventListener?.("release", () => { LL.wake = null; }); } } catch {}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && LL.activa) pedirPantallaPrendida(); });

// ================================================================ robot: cerebro (estados, mezcla, gestos según el audio)
// El cerebro no dibuja: decide. Lo usan el robot 3D y el indicador 2D.
const ESTADOS_ROBOT = ["idle", "escuchando", "pensando", "hablando", "entusiasmado"];
// Duración de cada gesto (s): tienen que coincidir con los clips del robot 3D.
const GESTOS = { abrir: 1.5, explicar: 1.45, ambas: 1.1, asentir: 0.95, senalar: 1.45, pecho: 1.7, encoger: 1.5, pulgar: 1.6, saludo: 2.0, festejo: 2.0 };
const NOMBRES_GESTOS = { abrir: "Abrir las manos", explicar: "Explicar", ambas: "Ambas manos", asentir: "Asentir", senalar: "Señalar", pecho: "Mano al pecho", encoger: "Encogerse de hombros", pulgar: "Pulgar arriba", saludo: "Saludar", festejo: "Festejar" };
// Expresiones de los ojos LED según el sentido de lo que dice (sin boca).
function expresionDe(texto) {
  const t = norm(texto || "");
  if (/\b(lo siento|perdon|lamentablemente|no pude|no se pudo|que pena|disculpa)\b/.test(t)) return "apenado";
  if (/\b(no estoy seguro|quizas|tal vez|capaz|depende|no se si|dudo)\b/.test(t) || /\?\s*$/.test(texto || "")) return "duda";
  if (/\b(wow|increible|en serio|que bueno|sorpresa|no lo puedo creer)\b/.test(t) || /!.*!/.test(texto || "")) return "sorpresa";
  if (/\b(lo logramos|terminamos|termine|listo|felicitaciones|genial|excelente|salio perfecto|funciona)\b/.test(t)) return "feliz";

  const mir = { x: 0, y: 0, tx: 0, ty: 0, prox: 0, puntero: null };

function quitarAprobacion(id) {
  anotarAp(id, null);
  const a = S.aprobaciones.find((x) => x.id === id);
  S.aprobaciones = S.aprobaciones.filter((x) => x.id !== id);
  S.sel.delete(id);
  delete S.alcances[id];
  if (a) despues(a.botId);
  if (a && LL.activa && a.botId === LL.botId) aprobacionResueltaLlamada();
}
// Tras un cambio en las aprobaciones de un bot: lo que hay que repintar.
function despues(botId) {
  programar("rail", "side", "bandeja", "equipo");
  if (botId === S.botId) programar("cab", "vivo", "cmp");
}

    rec.onstop = async () => {
      clearInterval(reloj); flujo.getTracks().forEach((x) => x.stop());
      const blob = new Blob(partes, { type: rec.mimeType || "audio/webm" }), ext = /mp4/.test(blob.type) ? "m4a" : /ogg/.test(blob.type) ? "ogg" : "webm";

// ================================================================ repintado agrupado
const pendientes = new Set();
let marco = 0;
function programar(...xs) {
  xs.forEach((x) => pendientes.add(x));
  if (!marco) marco = requestAnimationFrame(repintar);
}
function repintar() {
  marco = 0;
  const p = new Set(pendientes);
  pendientes.clear();
  const v = S.ruta.vista;
  if (p.has("rail")) pintarRail();
  if (p.has("avisos")) pintarAvisos();
  if (v === "chats") {
    if (p.has("side")) pintarSide();
    if (p.has("cab")) { pintarCabecera(); pintarTabs(); }
    if (p.has("cmp")) pintarCompositor();
    if (p.has("vivo")) pintarVivo();
    if (p.has("ctx")) pintarCtx();
    if (p.has("perfil") && S.pestana === "perfil") pintarPerfil();
  }
  if (v === "equipo" && p.has("equipo")) pintarEquipo();
  if ((v === "equipo" || v === "aprobaciones") && p.has("bandeja")) pintarBandejas();
  if (v === "reuniones" && p.has("reuniones")) S.ruta.id ? pintarSala() : pintarReuniones();
  if (v === "ajustes" && p.has("ajustes")) pintarAjustes();
  if (v === "proyectos" && p.has("proyectos")) pintarProyectos();
  if (v === "mapa" && ["proyectos", "rail", "equipo"].some((k) => p.has(k))) pintarMapa();
  if (v === "universo" && ["rail", "equipo", "side", "bandeja"].some((k) => p.has(k))) pintarUnivLista();
  if (v === "operaciones" && ["rail", "equipo", "ctx", "avisos", "side", "reuniones", "proyectos", "ops", "bandeja"].some((k) => p.has(k))) pintarOps();
  if (v === "mensajes" && p.has("msj")) { pintarMsjLista(); montarMsjChat(); }
  else if (v === "mensajes" && p.has("msj-chat")) { pintarMsjLista(); pintarMsjChat(); }
  if (v === "compartido" && p.has("compartido")) pintarCompartido();
  if (v === "llamada" && p.has("cab")) refrescarLlamada();
}

// ================================================================ datos y eventos en vivo
let primera = true;
// Aprobaciones que llegaron (o se resolvieron) en vivo. /api/estado puede responder con una foto
// de antes de ese evento: sin esto, un pedido nuevo desaparecía del chat y de la bandeja.
let verAps = 0;
const cambiosAps = new Map();
function anotarAp(id, a) { cambiosAps.set(id, { ver: ++verAps, a }); }
async function cargarEstado() {
  const v0 = verAps;
  const d = await api("GET", "/api/estado");
  for (const k of ["bots", "habilidades", "reglas", "aprobaciones", "plantillas", "plantillasEquipo", "nombres", "config", "ajustes", "gasto", "cupo", "tareas", "reuniones", "local", "gruposHerramientas", "archivados", "vista"]) S[k] = d[k];
  // Catálogo (servidores viejos no lo traen: se arma con lo que haya).
  S.categorias = d.categorias || [...new Set(S.plantillas.map((p) => p.categoria).filter(Boolean))];
  S.iconos = d.iconos || [];
  S.limites = { maxBots: d.limites?.maxBots || 50, maxEquipo: d.limites?.maxEquipo || 30 };
  for (const [id, c] of cambiosAps) {
    if (c.ver <= v0) { cambiosAps.delete(id); continue; }
    if (c.a && !S.aprobaciones.some((x) => x.id === id)) S.aprobaciones.push(c.a);
    if (!c.a) S.aprobaciones = S.aprobaciones.filter((x) => x.id !== id);
  }
  indexar();
  for (const b of S.bots) if (b.estado !== "libre" && !S.desde[b.id]) S.desde[b.id] = b.tareaId && S.tareas.find((t) => t.id === b.tareaId)?.inicio || null;
  firmaAvisos = "";
  pintarAvisos();
  if (!S.cargado || primera) { S.cargado = true; primera = false; navegar(); return; }
  if (S.ruta.vista === "chats" && S.botId && !bot(S.botId)) { S.botId = null; ir("#/chats"); return; }
  if (S.ruta.vista === "chats" && !S.botId && S.bots.length && !angosto()) { navegar(); return; }
  programar("rail", "side", "cab", "cmp", "vivo", "ctx", "equipo", "bandeja", "reuniones", "ajustes", "perfil", "msj", "compartido");
  if (S.ruta.vista === "chats" && !$("#bh") && S.botId) montarMain();
}
let recarga = null;
const recargarPronto = () => { clearTimeout(recarga); recarga = setTimeout(intentar(cargarEstado), 150); };
function upsertReunion(r) {
  const res = { ...r, turnos: Array.isArray(r.turnos) ? r.turnos.length : r.turnos };
  const i = S.reuniones.findIndex((x) => x.id === r.id);
  if (i >= 0) S.reuniones[i] = res; else S.reuniones.unshift(res);
}

// notificaciones del navegador: solo con la pestaña oculta
let pidioPermiso = false;
function pedirPermisoNotif() {
  if (pidioPermiso || !("Notification" in window) || Notification.permission !== "default") return;
  pidioPermiso = true;
  try { Notification.requestPermission().catch(() => {}); } catch {}
}
function notificar(titulo, cuerpo, tag) {
  if (!document.hidden || !("Notification" in window) || Notification.permission !== "granted") return;
  try { const n = new Notification(titulo, { body: cuerpo, tag, icon: "/iconos/gravity-192.png" }); n.onclick = () => { window.focus(); n.close(); }; } catch {}
}
let ultimaNotif = 0, notifPend = [], notifTimer = null;
function notificarAprobacion(a) {
  if (!document.hidden) return;
  notifPend.push(a);
  if (notifTimer) return;
  notifTimer = setTimeout(() => {
    notifTimer = null;
    const xs = notifPend.filter((x) => S.aprobaciones.some((y) => y.id === x.id));
    notifPend = [];
    if (!xs.length || !document.hidden) return;
    ultimaNotif = Date.now();
    const quien = [...new Set(xs.map((x) => bot(x.botId)?.nombre).filter(Boolean))];
    notificar(xs.length === 1 ? `${quien[0] || "Un compañero"} necesita tu aprobación` : `${xs.length} pedidos esperan tu aprobación`, xs.length === 1 ? xs[0].titulo : `De ${listaY(quien)}.`, "gravity-aprobaciones");
  }, Math.max(1500, ultimaNotif + 30000 - Date.now()));
}

function conectar() {
  const es = new EventSource("/api/eventos");
  const datos = (e) => { try { return JSON.parse(e.data); } catch { return {}; } };
  const on = (tipo, fn) => es.addEventListener(tipo, (e) => { try { fn(datos(e)); } catch (err) { console.warn(err); } });
  es.addEventListener("open", () => { S.stream = {}; S.corte = {}; recargarPronto(); cargarMensajeria(true); if (S.chatId && S.ruta.vista === "mensajes") cargarChat(S.chatId); if (S.botId && S.ruta.vista === "chats" && S.pestana === "chat") cargarConv(S.botId); });
  es.addEventListener("error", () => { if (es.readyState === EventSource.CLOSED) setTimeout(conectar, 3000); });
  on("estado", (d) => {
    const b = bot(d.botId);
    if (!b) return;
    const antes = b.estado;
    Object.assign(b, { estado: d.estado, accion: d.accion, enCola: d.enCola, tareaId: d.tareaId });
    if (d.estado !== "libre" && antes === "libre") S.desde[b.id] = new Date().toISOString();
    if (d.estado === "libre" && antes !== "libre") {
      S.desde[b.id] = null;
      if (b.id !== S.botId || document.hidden || S.pestana !== "chat") { S.sinLeer[b.id] = (S.sinLeer[b.id] || 0) + 1; b.noLeido = true; }
      if (b.cargo === "manager") notificar(`${b.nombre} terminó`, "Tiene novedades para vos.", `gravity-fin-${b.id}`);
    }
    if (S.cola[b.id]?.length > (b.enCola || 0) && antes !== "libre") S.cola[b.id] = S.cola[b.id].slice(-(b.enCola || 0) || S.cola[b.id].length);
    programar("rail", "side", "equipo", "ctx");
    if (b.id === S.botId) programar("cab", "cmp", "vivo");
  });
  on("delta", (d) => { S.stream[d.botId] = (S.stream[d.botId] || "") + d.texto; if (d.botId === S.botId) pintarVivo(); });
  on("delta-reinicio", (d) => { S.stream[d.botId] = ""; S.corte[d.botId] = 0; if (d.botId === S.botId) pintarVivo(); });
  on("cambio", (d) => {
    const id = d.botId;
    if (id === CD.botId && $("#code") && CD.panel === "agentes") cdCargarConv().then(pintarCodePanel);
    if (id === S.botId && S.ruta.vista === "chats" && S.pestana === "chat") { S.corte[id] = (S.stream[id] || "").length; cargarConv(id); }
    else { S.stream[id] = ""; S.corte[id] = 0; delete S.items[id]; S.cola[id] = []; }
  });
  on("aprobacion", (a) => {
    anotarAp(a.id, a);
    if (!S.aprobaciones.some((x) => x.id === a.id)) S.aprobaciones.push(a);
    notificarAprobacion(a);
    despues(a.botId);
  });
  on("aprobacion-resuelta", (d) => quitarAprobacion(d.id));
  let tCanal = null;
  on("monitores", () => { if ($("#invest") && INV.pest === "monitores") montarInvestigacion().catch(() => {}); });
  let tEq = null;
  const refrescarEquipo = () => { if ($("#code") && CD.panel === "equipo" && CD.equipo) { clearTimeout(tEq); tEq = setTimeout(cdCargarEquipo, 600); } };
  on("proyectos", refrescarEquipo); on("estado", refrescarEquipo); on("tarea", refrescarEquipo);
  on("canal", (d) => { if ($("#canales")) { clearTimeout(tCanal); tCanal = setTimeout(() => montarCanales().catch(() => {}), 250); } });
  for (const t of ["bots", "habilidades", "reglas", "ajustes"]) on(t, recargarPronto);
  on("rutinas", (d) => {
    if (d.botId === S.botId && S.pestana === "rutinas" && !S.editRutina) cargarRutinas();
    if (S.ruta.vista === "reuniones" && !S.ruta.id) cargarProgramadas();
    const b = bot(d.botId);
    if (b) api("GET", `/api/bots/${b.id}/rutinas`).then((xs) => { b.rutinas = xs.length; if (b.id === S.botId) programar("cab"); }).catch(() => {});
  });
  on("memoria", (d) => { if (d.botId === S.botId && S.pestana === "memoria") cargarMemoria(); });
  let tCompu = null;
  on("computadora", () => { if ($("#pc")) { clearTimeout(tCompu); tCompu = setTimeout(cargarCompu, 400); } if ($("#code") && CD.p) { clearTimeout(CD.tArch); CD.tArch = setTimeout(async () => { await cargarCodeArchivos().catch(() => {}); pintarCodeArbol(); if (CD.panel === "terminal") pintarCodePanel(); if (CD.panel === "vista") { const f = $("#cd-vivo"); if (f) { CD.vistaV = Date.now(); f.src = `${vistaDe(CD.vistaRuta)}?v=${CD.vistaV}`; } } if (CD.panel === "git") cdCargarGit(); }, 400); } });
  on("tarea", (t) => {
    const i = S.tareas.findIndex((x) => x.id === t.id);
    const u = $("#univ-3d")?.univ;
    if (u) { const antes = i >= 0 ? S.tareas[i].estado : null; if (t.estado === "completa" && antes !== "completa") u.festejar(t.paraId); else if (i < 0 && t.estado === "pendiente") u.visitar(t.deId, t.paraId); }
    // En una llamada: si el compañero (o alguien de su equipo) termina una tarea, el robot festeja.
    if (LL.activa && t.estado === "completa" && (t.paraId === LL.botId || t.deId === LL.botId) && !(i >= 0 && S.tareas[i].estado === "completa")) LL.motor?.cerebro?.festejar();
    if (i >= 0) S.tareas[i] = t; else S.tareas.push(t);
    for (const id of [t.paraId, t.deId]) { const b = bot(id); if (b) b.tareasAbiertas = S.tareas.filter((x) => x.paraId === b.id && tareaAbierta(x)).length; }
    programar("ctx", "equipo", "reuniones");
    if (t.paraId === S.botId || t.deId === S.botId) programar("cab");
  });
  on("reunion", (r) => {
    upsertReunion(r);
    $("#univ-3d")?.univ?.reunir([r.facilitadorId, ...r.participantes], r.estado === "en_curso");
    if (S.reunion?.id === r.id) S.reunion = r;
    programar("rail", "reuniones", "ctx", "equipo");
  });
  on("gasto", (g) => { S.gasto = g; programar("rail", "avisos", "ajustes"); });
  let tProy = null;
  on("proyectos", () => { if (S.ruta.vista !== "proyectos") { S.proyectos = null; return; } clearTimeout(tProy); tProy = setTimeout(cargarProyectos, 250); });
  on("cupo", (c) => { S.cupo = c; programar("avisos"); });
  on("conexiones", () => { if (S.ruta.vista === "conexiones") cargarConexiones(); });
  // Mensajería: lista y conversación abierta al día; las derivaciones avisan en naranja.
  let tMsj = null;
  const tChat = new Map();
  const recargarMsj = () => { clearTimeout(tMsj); tMsj = setTimeout(() => cargarMensajeria(true), 250); };
  const recargarChat = (id) => { if (!id || id !== S.chatId || S.ruta.vista !== "mensajes") return; clearTimeout(tChat.get(id)); tChat.set(id, setTimeout(() => cargarChat(id), 200)); };
  on("mensajeria", (d) => {
    recargarMsj();
    if (d.motivo === "borrada" && d.id === S.chatId && S.ruta.vista === "mensajes") { S.chat = null; toast("Esa conversación se borró."); ir("#/mensajes"); return; }
    if (d.motivo !== "leido") recargarChat(d.id);
  });
  on("mensajeria-apps", (e) => { S.msjEstado = e; pintarAppsAbiertas(); });
  on("mensajeria-saliente", (d) => { recargarChat(d.chatId); if (d.estado === "error" && d.chatId === S.chatId && S.ruta.vista === "mensajes" && d.error) toast(`No salió el mensaje: ${d.error}`, "err"); });
  on("mensajeria-derivada", (d) => {
    const quien = bot(d.botId)?.nombre || "Tu compañero";
    const texto = `${quien} te pasa la charla con ${d.conversacion || "una conversación"}: ${minus1(d.motivo || "").replace(/\.$/, "")}`;
    toast(texto, "sig", { href: rutaChat(d.id), texto: "Ver" });
    notificar(`${quien} te pasa una charla`, `${d.appNombre ? `${d.appNombre} · ` : ""}${d.conversacion}: ${d.motivo}`, `gravity-deriv-${d.id}`);
    recargarMsj();
    recargarChat(d.id);
  });
  on("compartido", () => { if (S.compartidos !== null || S.ruta.vista === "mensajes") cargarCompartidos(); });
  // La llamada de voz escucha lo mismo que el chat (después de que el estado de arriba se actualizó).
  for (const t of ["delta", "delta-reinicio", "cambio", "estado", "aprobacion"]) on(t, (d) => sseLlamada(t, d));
  es.addEventListener("open", () => { if (LL.activa) sseLlamada("reconexion", { botId: LL.botId }); });
}

// relojes
setInterval(() => {
  for (const e of $$("[data-hace]")) e.textContent = hace(e.dataset.hace);
  for (const e of $$("[data-dura]")) if (e.dataset.dura) e.textContent = cuanto(e.dataset.dura) || "ahora";
}, 15000);
setInterval(() => { for (const e of $$("[data-reloj]")) e.textContent = reloj(e.dataset.reloj); }, 1000);

function aplicarTema() {
  const t = leerLocal("gravity-tema", "");
  const estilo = leerLocal("gravity-estilo", "");
  // «Cristal» es oscuro siempre: paneles translúcidos sobre azul profundo con brillos cian y violeta.
  if (estilo === "cristal") { document.documentElement.dataset.estilo = "cristal"; document.documentElement.dataset.theme = "dark"; return; }
  delete document.documentElement.dataset.estilo;
  if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
}
aplicarTema();
window.addEventListener("hashchange", navegar);
let anchoAntes = angosto();
window.addEventListener("resize", () => { const a = angosto(); if (a !== anchoAntes) { anchoAntes = a; if (S.ruta.vista === "chats") navegar(); } });

(async () => {
  try { await cargarEstado(); cargarMensajeria(true); }
  catch (err) { $("#vista").innerHTML = html`<div class="hola"><div class="hola-in"><h1>No se pudo cargar Gravity</h1><p>${err.message}</p><button class="btn pri" onclick="location.reload()">Reintentar</button></div></div>`.s; }
  conectar();
})();
if ("serviceWorker" in navigator) { try { navigator.serviceWorker.register("/sw.js").catch(() => {}); } catch {} }
})();
</script>
</body>
</html>
