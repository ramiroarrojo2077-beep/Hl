<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gravity</title>
<meta name="description" content="Gravity: tu equipo de compañeros de IA, trabajando en tu compu.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#070A12" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#EEF1F6" media="(prefers-color-scheme: light)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/iconos/gravity.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/iconos/apple-touch-icon.png">
<link rel="preload" href="/fuentes/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fuentes/geist-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Geist y Geist Mono (SIL OFL 1.1, ver /fuentes/LICENSE-Geist.txt) */
@font-face{font-family:"Geist";font-style:normal;font-weight:100 900;font-display:swap;src:url(/fuentes/geist-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Geist";font-style:normal;font-weight:100 900;font-display:swap;src:url(/fuentes/geist-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Geist Mono";font-style:normal;font-weight:100 900;font-display:swap;src:url(/fuentes/geist-mono-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Geist Mono";font-style:normal;font-weight:100 900;font-display:swap;src:url(/fuentes/geist-mono-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}

/* ---------- tokens: naranja = "esto te necesita"; cian = trabajando ---------- */
:root{
  color-scheme:dark;
  --font:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --bg:#070A12; --rail:#05070D; --s1:#0B101B; --s2:#111827; --s3:#18213A;
  --line:#1B2438; --line2:#2A3654; --glow:rgba(96,128,232,.09);
  --tx:#E8ECF5; --tx2:#AAB3C8; --tx3:#8D98B0;
  --ion:#6CD3F0; --ion-tx:#7DD9F2; --ion-bg:rgba(108,211,240,.11);
  --sig:#FF9B50; --sig-tx:#FFB07A; --sig-bg:rgba(255,155,80,.10); --sig-line:rgba(255,155,80,.42); --on-sig:#1C0D02;
  --pri:#E8ECF5; --on-pri:#0A0F1A;
  --h-jade:#63D3B1; --h-iris:#9DA9FF; --h-lilac:#C9A9FF; --h-steel:#8FB8E0; --h-orchid:#DDA8E6; --h-sage:#A3CF97; --h-ink:#DCE2EE;
  --shadow:0 18px 48px rgba(0,0,0,.45);
  --scrim:rgba(3,5,10,.62);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#EEF1F6; --rail:#E3E7EF; --s1:#F7F8FB; --s2:#FFFFFF; --s3:#ECEFF6;
    --line:#DCE1EA; --line2:#C5CDDB; --glow:rgba(96,128,232,.10);
    --tx:#0B1220; --tx2:#434E66; --tx3:#566079;
    --ion:#0C86AE; --ion-tx:#086685; --ion-bg:rgba(12,134,174,.10);
    --sig:#E86A12; --sig-tx:#9E4205; --sig-bg:rgba(232,106,18,.09); --sig-line:rgba(206,92,14,.45); --on-sig:#1C0D02;
    --pri:#0B1220; --on-pri:#FFFFFF;
    --h-jade:#0B7A5E; --h-iris:#3A49C9; --h-lilac:#6E3FC4; --h-steel:#2C5D8A; --h-orchid:#8C3A93; --h-sage:#3F6B33; --h-ink:#1A2236;
    --shadow:0 18px 48px rgba(20,30,60,.16);
    --scrim:rgba(20,26,40,.42);
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#EEF1F6; --rail:#E3E7EF; --s1:#F7F8FB; --s2:#FFFFFF; --s3:#ECEFF6;
  --line:#DCE1EA; --line2:#C5CDDB; --glow:rgba(96,128,232,.10);
  --tx:#0B1220; --tx2:#434E66; --tx3:#566079;
  --ion:#0C86AE; --ion-tx:#086685; --ion-bg:rgba(12,134,174,.10);
  --sig:#E86A12; --sig-tx:#9E4205; --sig-bg:rgba(232,106,18,.09); --sig-line:rgba(206,92,14,.45); --on-sig:#1C0D02;
  --pri:#0B1220; --on-pri:#FFFFFF;
  --h-jade:#0B7A5E; --h-iris:#3A49C9; --h-lilac:#6E3FC4; --h-steel:#2C5D8A; --h-orchid:#8C3A93; --h-sage:#3F6B33; --h-ink:#1A2236;
  --shadow:0 18px 48px rgba(20,30,60,.16);
  --scrim:rgba(20,26,40,.42);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:400 14px/1.5 var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
button:disabled{cursor:not-allowed;opacity:.5}
p{margin:0}
h1,h2,h3,h4{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ion);outline-offset:2px;border-radius:6px}
.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.s{width:15px;height:15px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.micro{font:600 12px/1.2 var(--font);letter-spacing:.005em;color:var(--tx3)}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
code,kbd{font-family:var(--mono);font-size:.88em}
.muted{color:var(--tx3)}
.lnk{color:var(--tx);font-weight:500;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.lnk:hover{text-decoration-color:var(--tx3)}
::selection{background:color-mix(in oklab,var(--ion) 30%,transparent)}

/* ---------- marco ---------- */
.app{display:grid;grid-template-columns:76px minmax(0,1fr);height:100vh;height:100dvh}
.zona{display:flex;flex-direction:column;min-width:0;min-height:0}
.vista{flex:1;min-height:0;min-width:0;display:grid;grid-template-columns:minmax(0,1fr)}
.rail{background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:2px;min-height:0;overflow-y:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.logo{display:grid;place-items:center;width:44px;height:44px;margin-bottom:12px;flex:none}
.rl{width:64px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 0 8px;border-radius:12px;color:var(--tx2);font-size:10.5px;font-weight:500;letter-spacing:-.005em;position:relative;flex:none;text-align:center}
.rl .i{width:20px;height:20px}
.rl:hover{background:var(--s2);color:var(--tx)}
.rl.on{color:var(--tx);background:var(--s2)}
.rl.on::before{content:"";position:absolute;left:-6px;top:14px;bottom:14px;width:2px;border-radius:2px;background:var(--tx)}
.bdg{position:absolute;top:4px;left:38px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--sig);color:var(--on-sig);font:650 11px/18px var(--font);font-variant-numeric:tabular-nums;text-align:center}
.live{position:absolute;top:8px;left:40px;width:8px;height:8px;border-radius:50%;background:var(--ion);box-shadow:0 0 0 2px var(--rail)}
.rail .sp{flex:1;min-height:8px}
.gas{width:62px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:12px;color:var(--tx2);flex:none}
.gas:hover{background:var(--s2)}
.gas b{font:600 11.5px/1 var(--mono);color:var(--tx)}
.gas small{font:500 10px/1 var(--mono);color:var(--tx3)}
.gas .gbar{width:38px;height:4px;border-radius:2px;background:var(--line2);overflow:hidden}
.gas .gbar i{display:block;height:100%;background:var(--tx2);border-radius:2px}
.gas.suave .gbar i{background:var(--ion)}
.gas.tope b,.gas.tope small{color:var(--sig-tx)}
.gas.tope .gbar i{background:var(--sig)}
.salir{font-size:10.5px}

/* ---------- avatar planeta + anillo de estado ---------- */
/* --k (0-3) varía el tono y la luz dentro del color del equipo: dos vecinos nunca son el mismo planeta */
.av{--sz:24px;--k:1;position:relative;flex:none;width:var(--sz);height:var(--sz);border-radius:50%;display:inline-grid;place-items:center;
  font:600 calc(var(--sz)*.42)/1 var(--font);letter-spacing:-.01em;color:color-mix(in oklab,var(--h) 86%,var(--tx));
  background:radial-gradient(circle at calc(24% + var(--k)*7%) calc(20% + var(--k)*4%), color-mix(in oklab,var(--h) calc(16% + var(--k)*11%),var(--s2)), color-mix(in oklab,var(--h) calc(6% + var(--k)*4%),var(--s2)) 74%);
  box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--h) calc(24% + var(--k)*8%),transparent)}
.av.dos{font-size:calc(var(--sz)*.36)}
.av>i{position:absolute;inset:-4px;border-radius:50%;pointer-events:none}
.av[data-s=work]>i{border:1.5px solid color-mix(in oklab,var(--ion) 30%,transparent);animation:orbit 4.8s linear infinite}
.av[data-s=work]>i::before{content:"";position:absolute;width:6px;height:6px;top:-3.5px;left:calc(50% - 3px);border-radius:50%;background:var(--ion);box-shadow:0 0 0 1.5px var(--s1),0 0 8px var(--ion)}
.av[data-s=wait]>i{border:2px solid var(--sig);clip-path:polygon(0 0,100% 0,100% 62%,62% 62%,62% 100%,0 100%)}
.av[data-s=wait]::after{content:"";position:absolute;right:-4px;bottom:-4px;width:8px;height:8px;border-radius:50%;background:var(--sig);box-shadow:0 0 0 2px var(--s1)}
.av.mg{box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--h) 40%,transparent),0 0 0 3px var(--s1),0 0 0 4px color-mix(in oklab,var(--h) 30%,transparent)}
.av.dr{box-shadow:inset 0 0 0 1px var(--line2),0 0 0 3px var(--s1),0 0 0 4px var(--line2),0 0 0 7px var(--s1),0 0 0 8px var(--line)}
.av.mg[data-s]>i{inset:-7px}
.av.dr[data-s]>i{inset:-10px}
.av.you{border-radius:30%;background:var(--pri);color:var(--on-pri);box-shadow:none;font-size:calc(var(--sz)*.3)}
@keyframes orbit{to{transform:rotate(360deg)}}

/* ---------- piezas ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 13px;border-radius:10px;font-weight:500;font-size:13px;white-space:nowrap;border:1px solid transparent;transition:background .15s,border-color .15s,opacity .15s}
.btn.pri{background:var(--pri);color:var(--on-pri);font-weight:600}
.btn.pri:hover{opacity:.9}
.btn.sig{background:var(--sig);color:var(--on-sig);font-weight:600}
.btn.sig:hover{filter:brightness(1.06)}
.btn.out{border-color:var(--line2);background:var(--s2);color:var(--tx)}
.btn.out:hover{border-color:var(--tx3)}
.btn.ghost{color:var(--tx2)}
.btn.ghost:hover{background:var(--s3);color:var(--tx)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px;border-radius:8px;gap:6px}
.btn[aria-busy=true]{opacity:.6;pointer-events:none}
.ib{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:9px;color:var(--tx2);flex:none}
.ib:hover{background:var(--s3);color:var(--tx)}
.chip{height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--line2);font-size:12px;font-weight:500;color:var(--tx2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;background:transparent}
.chip:hover{color:var(--tx);border-color:var(--tx3)}
.chip.on,.chip[aria-pressed=true]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.chip .n{font-size:11px;opacity:.85;font-variant-numeric:tabular-nums}
.d{display:inline-block;width:7px;height:7px;border-radius:50%;flex:none}
.d.w{background:var(--ion)} .d.a{background:var(--sig)} .d.l{background:transparent;box-shadow:inset 0 0 0 1.5px var(--tx3)}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;max-width:100%;min-width:0}
.pill>span{overflow:hidden;text-overflow:ellipsis}
.pill .i{width:13px;height:13px}
.pill.w{background:var(--ion-bg);color:var(--ion-tx)}
.pill.a{background:var(--sig-bg);color:var(--sig-tx);box-shadow:inset 0 0 0 1px var(--sig-line)}
.pill.l,.pill.n{background:var(--s3);color:var(--tx2)}
.pill.ok{background:transparent;color:var(--tx2);box-shadow:inset 0 0 0 1px var(--line2)}
.pill .d{width:6px;height:6px}
.seg{display:flex;gap:2px;height:4px;border-radius:4px;overflow:hidden;background:var(--line)}
.seg i{display:block;border-radius:1px}
.seg .w{background:var(--ion)} .seg .a{background:var(--sig)} .seg .l{background:var(--line2)}
.constel{display:inline-flex;gap:3px;align-items:center;flex-wrap:nowrap}
.constel i{width:6px;height:6px;border-radius:50%;display:block;flex:none}
.constel .w{background:var(--ion)} .constel .a{background:var(--sig)} .constel .l{box-shadow:inset 0 0 0 1.2px var(--tx3)}
.constel em{font:500 11px var(--font);color:var(--tx3);font-style:normal;margin-left:2px}
.field{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:10px;background:var(--s2);border:1px solid var(--line);color:var(--tx3)}
.field:focus-within{border-color:var(--ion);box-shadow:0 0 0 3px var(--ion-bg)}
.field input,.field select{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--tx);font-size:13px}
.field input::placeholder{color:var(--tx3)}
.field kbd{font-size:11px;border:1px solid var(--line2);border-radius:5px;padding:1px 5px;color:var(--tx3)}
input.cb{appearance:none;-webkit-appearance:none;margin:0;width:16px;height:16px;border-radius:5px;border:1.5px solid var(--tx3);display:inline-grid;place-items:center;flex:none;background:transparent;cursor:pointer;position:relative}
input.cb:checked{background:var(--tx);border-color:var(--tx)}
input.cb:checked::after{content:"";width:8px;height:4.5px;border-left:2px solid var(--bg);border-bottom:2px solid var(--bg);transform:translateY(-1px) rotate(-45deg)}
input.cb:indeterminate{border-color:var(--tx)}
input.cb:indeterminate::after{content:"";width:8px;height:2px;border-radius:1px;background:var(--tx)}
input.sw{appearance:none;-webkit-appearance:none;margin:0;width:34px;height:20px;border-radius:999px;flex:none;cursor:pointer;
  background:radial-gradient(circle at 10px 50%,var(--tx2) 6px,transparent 6.5px),var(--s3);box-shadow:inset 0 0 0 1px var(--line2);transition:background .15s}
input.sw:checked{background:radial-gradient(circle at calc(100% - 10px) 50%,var(--on-pri) 6px,transparent 6.5px),var(--pri);box-shadow:none}
input[type=radio].rd{appearance:none;-webkit-appearance:none;margin:0;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--tx3);flex:none;cursor:pointer}
input[type=radio].rd:checked{border:5px solid var(--tx)}

/* formularios */
.fld{display:flex;flex-direction:column;gap:6px;min-width:0;border:0;padding:0;margin:0}
.fld>span,.fld>legend{font-size:12.5px;font-weight:500;color:var(--tx2);padding:0}
.fld small,.ayuda{color:var(--tx3);font-size:12px;line-height:1.45}
.inp{height:36px;padding:0 11px;border-radius:10px;background:var(--s2);border:1px solid var(--line2);color:var(--tx);font-size:13.5px;outline:none;width:100%;min-width:0}
textarea.inp{height:auto;min-height:84px;padding:9px 11px;line-height:1.5;resize:vertical}
select.inp{padding-right:28px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--tx3) 50%),linear-gradient(135deg,var(--tx3) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.inp:focus{border-color:var(--ion);box-shadow:0 0 0 3px var(--ion-bg)}
.inp.sm{height:30px;font-size:13px;padding:0 9px}
.inp::placeholder{color:var(--tx3)}
.fila{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.fila>.fld{flex:1 1 160px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.chk{display:flex;align-items:flex-start;gap:10px;font-size:13px;color:var(--tx);line-height:1.45;cursor:pointer}
.chk input{margin-top:2px}
.chk small{display:block;color:var(--tx3);font-size:12px}
.segc{display:inline-flex;padding:3px;border-radius:10px;background:var(--s1);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.segc label{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--tx2);cursor:pointer;white-space:nowrap}
.segc label:has(input:checked){background:var(--s3);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line2)}
.segc label:has(input:focus-visible){outline:2px solid var(--ion);outline-offset:1px}
.segc input{position:absolute;opacity:0;pointer-events:none}
.err{color:var(--sig-tx);font-size:12.5px;min-height:0}
.err:empty{display:none}

/* ---------- órbita (componente firma) ---------- */
.orbit{position:relative;width:100%;max-width:var(--w);aspect-ratio:1;margin:0 auto}
.orbit .rings{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.orbit .rings circle{fill:none;stroke:var(--line2);stroke-width:1;vector-effect:non-scaling-stroke}
.orbit .rings .r2{stroke:var(--line);stroke-dasharray:2 5}
.orbit .rings .r0{stroke:var(--line);opacity:.8}
.o-c,.o-m{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;justify-items:center}
.o-m[data-a]{cursor:pointer}
.o-m em,.o-c em{position:absolute;top:calc(100% + 5px);font:500 11px/1 var(--font);font-style:normal;color:var(--tx2);white-space:nowrap}
.o-m.hl em{color:var(--tx);font-weight:600}
.o-m.hl .av{outline:1.5px solid var(--tx);outline-offset:6px}
.o-c .ctag{font:600 11px/1 var(--font);color:var(--on-pri);background:var(--pri);padding:3px 7px;border-radius:999px;top:calc(100% + 9px)}
.ob{position:absolute;right:-6px;bottom:-6px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;font:650 10.5px/1 var(--font);font-variant-numeric:tabular-nums;padding:0 4px;box-shadow:0 0 0 2px var(--s1)}
.ob.done{background:var(--s3);color:var(--tx2)}
.ob.talk{background:var(--ion);color:var(--on-pri)}
.av.talk>i{border:2px solid var(--ion)!important;animation:none!important;clip-path:none!important}
.av.talk>i::before{display:none}
.av.talk>i::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px solid var(--ion);opacity:0;animation:halo 1.8s ease-out infinite}
@keyframes halo{0%{transform:scale(.85);opacity:.7}100%{transform:scale(1.25);opacity:0}}
.orbit.ghost .o-m .av{background:none;box-shadow:none;border:1.5px dashed var(--tx3);color:var(--tx2)}
.orbit.ghost .o-c .av{background:none;box-shadow:none;border:1.5px dashed var(--tx2);color:var(--tx)}

/* ---------- barra inferior (celular) ---------- */
.mnav{display:none}

/* ---------- avisos globales ---------- */
.avisos{display:flex;flex-direction:column}
.avisos:empty{display:none}
.aviso-g{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 22px;border-bottom:1px solid var(--line);background:var(--s2);font-size:13px;color:var(--tx2)}
.aviso-g b{color:var(--tx);font-weight:600}
.aviso-g>span{flex:1;min-width:200px}
.aviso-g.sig{background:linear-gradient(var(--sig-bg),var(--sig-bg)),var(--s2);border-bottom-color:var(--sig-line);color:var(--sig-tx)}
.aviso-g.sig b{color:var(--sig-tx)}
.aviso-g.ion{background:linear-gradient(var(--ion-bg),var(--ion-bg)),var(--s2)}
.aviso-g label{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap}
.aviso-g .inp{width:90px}

/* ---------- lateral: compañeros ---------- */
.vista.v-chats{grid-template-columns:304px minmax(0,1fr) 316px}
.side{background:var(--s1);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.side-h{display:flex;align-items:center;gap:6px;padding:16px 12px 12px 16px}
.side-h h1{font:600 16px/1.2 var(--font);letter-spacing:-.015em;margin:0;flex:1;display:flex;align-items:baseline;gap:7px}
.side-h h1 span{font:500 12.5px var(--font);font-variant-numeric:tabular-nums;color:var(--tx3)}
.side-h .btn{height:30px;padding:0 10px;font-size:12.5px}
/* marca en el celular (el riel con el logo se oculta) */
.marca-m{display:none;align-items:center;gap:9px;flex:1;min-width:0;font:650 18px/1 var(--font);letter-spacing:-.03em;color:var(--tx)}
.marca-m img{width:28px;height:28px;border-radius:8px;flex:none;box-shadow:0 0 0 1px var(--line)}
.agg{margin:0 12px 10px;padding:11px 12px 12px;border-radius:14px;background:var(--s2);border:1px solid var(--line)}
.agg:empty{display:none}
.agg-t{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--tx2);margin-bottom:9px;flex-wrap:wrap}
.agg-t:last-child{margin-bottom:0}
.agg-t b{font:650 13.5px var(--font);font-variant-numeric:tabular-nums;color:var(--tx);margin-right:2px}
.agg-t span{display:inline-flex;align-items:center;gap:5px}
.agg-t .a b,.agg-t .a{color:var(--sig-tx)}
.agg .seg{height:5px}
.agg-a{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;border-radius:10px;background:var(--sig-bg);box-shadow:inset 0 0 0 1px var(--sig-line);color:var(--sig-tx);font-size:12.5px;font-weight:500;text-align:left;white-space:nowrap;margin-top:10px}
.agg-a:hover{background:color-mix(in oklab,var(--sig) 16%,transparent)}
.agg-a b{font:650 13px var(--font);font-variant-numeric:tabular-nums;color:var(--sig-tx)}
.agg-a .go{margin-left:auto;display:inline-flex;align-items:center;gap:2px;font-weight:600}
.find{padding:0 12px 8px}
.find .chips{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.find .chip{padding:0 9px}
.side-scroll{overflow:auto;flex:1;padding:4px 8px 16px;min-height:0;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.lbl{display:flex;justify-content:space-between;align-items:center;padding:12px 8px 6px}
.lbl .tools{display:flex;align-items:center;gap:2px;margin:-6px -4px -6px 0;white-space:nowrap}
.lbl .tools button{display:inline-flex;align-items:center;gap:3px;height:24px;padding:0 6px;border-radius:7px;color:var(--tx2);font-size:12px}
.lbl .tools button:hover{background:var(--s3);color:var(--tx)}
.row{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;height:34px;padding:0 8px;border-radius:9px;position:relative}
.row:hover{background:var(--s2)}
.row.on{background:var(--s3);box-shadow:inset 0 0 0 1px var(--line2)}
.who{display:flex;align-items:baseline;gap:7px;min-width:0;white-space:nowrap}
.who b{font-weight:500;font-size:13.5px}
.who span{color:var(--tx3);font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.who span.acc{color:var(--ion-tx)}
.rt{display:inline-flex;align-items:center;gap:6px}
.st{font:500 12px/1 var(--font);font-variant-numeric:tabular-nums;white-space:nowrap}
.st.w{color:var(--ion-tx)}
.st.l{color:var(--tx3)}
.st.a{color:var(--sig-tx);background:var(--sig-bg);box-shadow:inset 0 0 0 1px var(--sig-line);padding:4px 8px;border-radius:999px;font-weight:600;font-size:11.5px}
/* sin leer: cian (actividad), no blanco, para no competir con el naranja */
.un{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ion-tx);color:var(--on-pri);font:650 11px/18px var(--font);font-variant-numeric:tabular-nums;text-align:center}
.row.nl .who b,.grp-a.nl .gn b{font-weight:650}
.grp{margin-top:2px}
.grp-h{display:grid;grid-template-columns:18px minmax(0,1fr);gap:4px;align-items:center;border-radius:10px}
.grp-h.on .grp-a{background:var(--s3);box-shadow:inset 0 0 0 1px var(--line2)}
.chev-b{width:18px;height:28px;display:grid;place-items:center;color:var(--tx3);border-radius:6px}
.chev-b:hover{color:var(--tx);background:var(--s2)}
.grp-a{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:9px;align-items:center;padding:8px 8px 8px 6px;border-radius:10px;min-width:0}
.grp-a:hover{background:var(--s2)}
.gt{min-width:0;display:flex;flex-direction:column;gap:5px}
.gn{display:flex;align-items:baseline;gap:7px;white-space:nowrap;min-width:0}
.gn b{font-weight:600;font-size:13.5px}
.gn span{font-size:12.5px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis}
.gsum{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--tx3);white-space:nowrap;min-width:0;overflow:hidden}
.gsum .a{color:var(--sig-tx)}
.gct{font:500 12px var(--font);font-variant-numeric:tabular-nums;color:var(--tx3)}
.grp-b{position:relative;margin:2px 0 6px 25px;padding-left:12px}
.grp-b::before{content:"";position:absolute;left:0;top:-4px;bottom:16px;width:1px;background:linear-gradient(var(--line2),var(--line2) 80%,transparent)}
.grp-b .row::before{content:"";position:absolute;left:-12px;top:50%;width:9px;height:1px;background:var(--line2)}
.side-vacio{padding:18px 12px;color:var(--tx2);font-size:13px;display:flex;flex-direction:column;gap:10px}

/* ---------- principal: compañero ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:radial-gradient(900px 480px at 92% -12%,var(--glow),transparent 70%),var(--bg)}
.bh{position:relative;display:flex;align-items:center;gap:14px;padding:12px 22px 10px 28px;overflow:hidden;flex:none}
.bh-deco{position:absolute;left:-131px;top:-145px;width:360px;height:360px;pointer-events:none}
.bh-deco circle{fill:none;stroke:var(--line);vector-effect:non-scaling-stroke}
.bh-id{display:flex;align-items:center;gap:14px;flex:1;min-width:0;position:relative}
.bh-name{display:flex;align-items:baseline;gap:10px;min-width:0}
.bh-name h2{margin:0;font:600 19px/1.2 var(--font);letter-spacing:-.02em;white-space:nowrap}
.bh-name span{color:var(--tx2);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bh-meta{display:flex;align-items:center;gap:10px;margin-top:5px;font-size:12.5px;color:var(--tx2);white-space:nowrap;min-width:0}
.bh-meta a{color:var(--tx);font-weight:500;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.bh-meta .pill{max-width:min(420px,60vw);flex:0 1 auto;min-width:min(9em,40vw)}
.dotsep{width:3px;height:3px;border-radius:50%;background:var(--tx3);flex:none}
.bh-meta .rep{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 100 auto}
.cola{font:500 12px var(--font);color:var(--tx2);background:var(--s3);border-radius:999px;padding:3px 8px;white-space:nowrap}
.bh-act{display:flex;gap:6px;position:relative;flex:none}
.bh-m{display:none}
.back{display:none!important}
.tabs{display:flex;gap:2px;padding:0 22px;border-bottom:1px solid var(--line);position:relative;flex:none;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{display:inline-flex;align-items:center;gap:7px;height:42px;padding:0 10px;color:var(--tx2);font-size:13.5px;font-weight:500;position:relative;white-space:nowrap}
.tabs a .i{width:16px;height:16px}
.tabs a:hover{color:var(--tx)}
.tabs a.on{color:var(--tx)}
.tabs a.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--tx)}
.tabs .ct{font:600 11px var(--font);font-variant-numeric:tabular-nums;color:var(--tx3);background:var(--s3);border-radius:999px;padding:1px 6px}
.tabs .t-c{display:none}
.tabs .sp{flex:1}
.tabs .tab-note{align-self:center;font-size:12px;color:var(--tx3);display:flex;align-items:center;gap:6px;white-space:nowrap}
.cuerpo{flex:1;min-height:0;display:flex;flex-direction:column;min-width:0}
.cuerpo.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}

.thread{flex:1;overflow:auto;padding:16px 28px 8px;min-height:0;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.tin{max-width:700px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.tin>div{display:contents}
.deleg{border-radius:12px;border:1px dashed var(--line2);font-size:13px;color:var(--tx2)}
.deleg summary{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;list-style:none;min-width:0}
.deleg summary::-webkit-details-marker{display:none}
.deleg .dq{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deleg b{color:var(--tx);font-weight:600}
.deleg .q{color:var(--tx)}
.deleg time{margin-left:auto;font:12px var(--font);font-variant-numeric:tabular-nums;color:var(--tx3);flex:none}
.deleg .chev{color:var(--tx3);transition:transform .15s}
.deleg[open] .chev{transform:rotate(180deg)}
.deleg .oi{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--s3);color:var(--tx2);flex:none}
.deleg-b{padding:0 12px 12px 44px;display:flex;flex-direction:column;gap:8px}
.deleg-b ul{margin:0;padding-left:16px;color:var(--tx);font-size:13px}
.deleg-b pre,.pre{margin:0;padding:10px 12px;background:var(--s1);border:1px solid var(--line);border-radius:10px;font:12px/1.55 var(--mono);color:var(--tx2);overflow:auto;white-space:pre-wrap;word-break:break-word;max-height:320px}
.mu{align-self:flex-end;max-width:88%;display:flex;flex-direction:row;align-items:flex-end;gap:10px}
.mu .bub{background:var(--s3);border:1px solid var(--line2);padding:10px 14px;border-radius:16px 16px 5px 16px;white-space:pre-wrap;word-break:break-word;min-width:0}
.mu .meta{font:12px var(--font);font-variant-numeric:tabular-nums;color:var(--tx3);padding-bottom:4px;white-space:nowrap}
.mu.cola .bub{border-style:dashed;background:transparent}
.turn{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px}
.turn>.av{margin-top:1px}
.turn-c{min-width:0;display:flex;flex-direction:column;gap:10px}
.turn-h{display:flex;align-items:center;gap:8px;margin-bottom:-4px}
.turn-h b{font-weight:600}
.turn-h span{color:var(--tx3);font-size:12.5px}
.turn-h time{font:12px var(--font);font-variant-numeric:tabular-nums;color:var(--tx3);margin-left:auto}
.turn-h .m-av{display:none}
.trail{position:relative;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.trail::before{content:"";position:absolute;left:4px;top:8px;bottom:8px;width:1px;background:var(--line2)}
.tl{position:relative;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx2);min-width:0}
.tl::before{content:"";position:absolute;left:-18px;top:calc(50% - 4.5px);width:9px;height:9px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--tx3)}
.tl .i{width:16px;height:16px;color:var(--tx3)}
.tl b{color:var(--tx);font-weight:500;white-space:nowrap}
.tl .arg{font-family:var(--mono);font-size:12.5px;color:var(--tx);background:var(--s2);border:1px solid var(--line);border-radius:6px;padding:1px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tl .x{color:var(--tx3);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tl button.x{color:var(--tx2);text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px;flex:none}
.tl.err::before{background:var(--tx3);box-shadow:none}
.tag-err{display:inline-flex;align-items:center;gap:3px;font:600 11.5px/1 var(--font);color:var(--tx);border:1px dashed var(--tx3);border-radius:999px;padding:3px 7px 3px 5px;flex:none}
.tag-err .i{width:11px;height:11px;color:var(--tx)}
.tlw{display:flex;flex-direction:column}
.tlw summary{list-style:none;cursor:pointer}
.tlw summary::-webkit-details-marker{display:none}
.tlw .tog{display:inline-flex;align-items:center;gap:2px;color:var(--tx2);font-size:12.5px;white-space:nowrap;flex:none}
.tlw .tog .i{width:14px;height:14px;transition:transform .15s}
.tlw[open] .tog .i{transform:rotate(90deg)}
.tlw pre{margin:8px 0 2px 24px}
.nota{padding:8px 12px;border-radius:12px;background:var(--s1);border:1px solid var(--line);display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:baseline}
.nota .micro{color:var(--ion-tx)}
.nota p,.nota summary{font-size:13px;color:var(--tx2);white-space:pre-wrap;word-break:break-word}
.nota details summary{cursor:pointer;list-style:none}
.nota details summary::-webkit-details-marker{display:none}
.nota details summary u{color:var(--tx);text-decoration-color:var(--line2);text-underline-offset:3px}
.nota details[open] summary{display:none}
.aviso{display:flex;align-items:center;gap:8px;justify-content:center;font-size:12.5px;color:var(--tx3);text-align:center;padding:2px 12px}
.aviso.err{color:var(--tx);border:1px dashed var(--tx3);border-radius:10px;padding:7px 12px;justify-content:flex-start;text-align:left}
.aviso time{font:12px var(--font);font-variant-numeric:tabular-nums}
.vacio{border:1px dashed var(--line2);border-radius:14px;padding:18px;color:var(--tx2);font-size:13.5px;text-align:center}
.chat-vacio{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;padding:48px 16px 12px;color:var(--tx2)}
.chat-vacio b{font:650 18px/1.2 var(--font);letter-spacing:-.02em;color:var(--tx);margin-top:12px}
.chat-vacio .sub{font-size:13px;color:var(--tx3)}
.chat-vacio p{max-width:40ch;font-size:14px;margin-top:10px;text-wrap:pretty}
.md{font-size:14px;line-height:1.6;min-width:0;word-wrap:break-word}
.md>*+*{margin-top:10px}
.md p{margin:0}
.md ul,.md ol{margin:0;padding-left:20px}
.md li{margin:3px 0}
.md li::marker{color:var(--tx3)}
.md h4{font:600 14.5px/1.4 var(--font);margin:14px 0 0}
.md code{background:var(--s2);border:1px solid var(--line);padding:1px 5px;border-radius:5px;color:var(--tx)}
.md pre.code{margin:0;padding:10px 12px;background:var(--s1);border:1px solid var(--line);border-radius:10px;overflow:auto;font:12.5px/1.55 var(--mono)}
.md pre.code code{background:none;border:0;padding:0;font-size:inherit}
.md a{color:var(--ion-tx);text-decoration:underline;text-underline-offset:3px;word-break:break-word}
.md strong{font-weight:600}
.md blockquote{margin:0;padding:2px 0 2px 12px;border-left:2px solid var(--line2);color:var(--tx2)}
.md hr{border:0;border-top:1px solid var(--line)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--s1)}
.md table{border-collapse:collapse;width:100%;font-size:13px}
.md th{font:600 12px var(--font);color:var(--tx2);text-align:left;padding:7px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.md td{padding:6px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.md tr:last-child td{border-bottom:0}
.md td.num,.md th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.caret{display:inline-block;width:2px;height:15px;background:var(--ion);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.vivo-l{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ion-tx);padding:2px 0 2px 42px;min-width:0}
.vivo-l span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orbita-mini{position:relative;width:14px;height:14px;border-radius:50%;border:1.5px solid color-mix(in oklab,var(--ion) 35%,transparent);flex:none;animation:orbit 2.4s linear infinite}
.orbita-mini::before{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:var(--ion);top:-3px;left:calc(50% - 2.5px)}

/* pedido de aprobación */
.appr{border-radius:16px;background:linear-gradient(var(--sig-bg),var(--sig-bg)),var(--s2);box-shadow:inset 0 0 0 1px var(--sig-line);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.appr-h{display:flex;align-items:center;gap:10px}
.appr-h .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--sig);color:var(--on-sig);flex:none}
.appr-h .ic .i{width:17px;height:17px;stroke-width:1.8}
.appr-h div{flex:1;min-width:0}
.appr-h b{display:block;font-weight:600;font-size:14px;word-break:break-word}
.appr-h small{color:var(--tx2);font-size:12.5px}
.porque{font-size:13px;color:var(--tx);line-height:1.5;border-left:2px solid var(--sig-line);padding-left:10px}
.ap-or{font-size:12.5px;color:var(--tx2);display:flex;gap:6px;align-items:center}
.ap-det{max-height:220px}
/* detalle legible (rutinas, reuniones, apps) en vez de JSON */
.det{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0;padding:10px 12px;background:var(--s1);border:1px solid var(--line);border-radius:10px;font-size:13px}
.det dt{color:var(--tx3)}
.det dd{margin:0;color:var(--tx);min-width:0;word-break:break-word;white-space:pre-wrap}
.det dd.lim{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.appr-a{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.siempre{display:inline-flex;align-items:center;gap:0}
.siempre .btn{border-radius:10px 0 0 10px}
.siempre select{height:34px;border-radius:0 10px 10px 0;border:1px solid var(--line2);border-left:0;background-color:var(--s1);font-size:12.5px;color:var(--tx2);padding:0 26px 0 9px;width:auto}
.appr-a .more{margin-left:auto;font-size:12.5px;color:var(--tx2);display:inline-flex;align-items:center;gap:3px}
.appr-a .more b{color:var(--sig-tx);font-family:var(--mono)}
.why{font-size:12px;color:var(--tx3)}

/* compositor */
.cmp{padding:6px 28px 14px;flex:none}
.cmp-box{max-width:700px;margin:0 auto}
.cmp-bar{display:flex;align-items:flex-end;gap:4px;border:1px solid var(--line2);background:var(--s2);border-radius:14px;padding:6px 6px 6px 12px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
.cmp-bar:focus-within{border-color:var(--tx3)}
.cmp textarea{flex:1;min-width:0;resize:none;border:0;background:none;color:var(--tx);font-size:14px;line-height:22px;height:34px;max-height:200px;outline:none;padding:6px 2px}
.cmp textarea::placeholder{color:var(--tx3)}
.cmp-bar .btn{height:32px}
.cmp-bar .env .i{width:16px;height:16px}
.cmp .hint{font-size:12px;color:var(--tx3);margin-top:7px;padding-left:4px;display:flex;align-items:center;gap:6px}
.cmp .hint.w{color:var(--ion-tx)}

/* contexto (derecha) */
.ctx{background:var(--s1);border-left:1px solid var(--line);overflow:auto;padding:18px 18px 24px;display:flex;flex-direction:column;gap:14px;min-height:0;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.box{border-radius:16px;background:var(--s2);border:1px solid var(--line);padding:14px}
.box-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.box-h a{font-size:12px;color:var(--tx2);display:inline-flex;align-items:center;gap:2px}
.box-h a:hover{color:var(--tx)}
.box h3{margin:0 0 2px;font:600 14px/1.3 var(--font);letter-spacing:-.01em}
.box .sub{font-size:12.5px;color:var(--tx2)}
.box .orbit{margin:16px auto 22px}
.legend{display:flex;justify-content:center;gap:14px;font-size:11.5px;color:var(--tx2);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12.5px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.kv dt{color:var(--tx3)}
.kv dd{margin:0;color:var(--tx);min-width:0;overflow:hidden;text-overflow:ellipsis}
.tlist{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.tlist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12.5px;padding:5px 0;border-top:1px solid var(--line)}
.tlist li:first-child{border-top:0}
.tlist li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx)}
.tlist li small{color:var(--tx3)}
.livebox{display:flex;flex-direction:column;gap:10px}
.livehd{display:flex;align-items:center;gap:8px}
.livedot{width:8px;height:8px;border-radius:50%;background:var(--ion);box-shadow:0 0 0 4px var(--ion-bg)}
.stack{display:flex;align-items:center}
.stack .av{box-shadow:0 0 0 2px var(--s2),inset 0 0 0 1px color-mix(in oklab,var(--h) 34%,transparent)}
.stack .av+.av{margin-left:-6px}
.stack .av>i,.stack .av::after{display:none}
.livebox .ft{display:flex;align-items:center;justify-content:space-between}

/* bienvenida / vacío */
.hola{flex:1;overflow:auto;display:grid;place-items:center;padding:28px}
.hola-in{max-width:620px;width:100%;display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center}
.hola h1{font:650 28px/1.12 var(--font);letter-spacing:-.03em;text-wrap:balance}
.hola p{color:var(--tx2);font-size:14.5px;max-width:46ch;text-wrap:pretty}
.hola .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.hola .acts .btn{height:40px;padding:0 16px;font-size:14px;border-radius:12px}
.hola-marca{display:inline-flex;align-items:center;gap:8px;font:650 15px/1 var(--font);letter-spacing:-.02em;color:var(--tx2)}
.hola-marca img{width:22px;height:22px;border-radius:6px;box-shadow:0 0 0 1px var(--line)}
.hola-sub{font:600 12.5px var(--font);color:var(--tx3);margin-top:4px;align-self:stretch;text-align:left}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;width:100%;text-align:left}
.tplc{border:1px solid var(--line);border-radius:14px;padding:11px 12px;display:grid;grid-template-columns:30px minmax(0,1fr);gap:2px 10px;align-items:start;background:var(--s1);text-align:left;transition:border-color .15s,background .15s}
.tplc:hover{border-color:var(--line2);background:var(--s2)}
.tplc>.av{grid-row:1/3;margin-top:1px}
.tplc b{font-size:13.5px;font-weight:600}
.tplc b span{color:var(--tx3);font-weight:500}
.tplc small{color:var(--tx3);font-size:12.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- páginas ---------- */
.pag{min-width:0;min-height:0;overflow:auto;background:radial-gradient(900px 520px at 50% -18%,var(--glow),transparent 70%),var(--bg);scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.pag-in{padding:22px 28px 40px;max-width:1120px;margin:0 auto}
.pag-in.angosta{max-width:820px}
.pag-h{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.pag-h .tt{flex:1;min-width:240px}
.pag-h h1{margin:6px 0 4px;font:650 26px/1.15 var(--font);letter-spacing:-.03em}
.pag-h p{color:var(--tx2);font-size:13.5px}
.pag-h .acts{display:flex;gap:8px;flex-wrap:wrap}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 10px;flex-wrap:wrap}
.sec-h h2{margin:0;font:600 15px/1.2 var(--font);letter-spacing:-.01em}
.sec-h h2 span{font:500 13px var(--font);font-variant-numeric:tabular-nums;color:var(--tx3);margin-left:6px}
.card{border-radius:16px;background:var(--s1);border:1px solid var(--line);padding:16px;min-width:0}
.card>h2{font:600 15px/1.25 var(--font);letter-spacing:-.01em;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.card>.sub{font-size:12.5px;color:var(--tx2);margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.vacio-p{border:1px dashed var(--line2);border-radius:16px;padding:22px;color:var(--tx2);font-size:13.5px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.vacio-p b{color:var(--tx);font-size:14.5px}

/* equipo */
.vista.v-eq{grid-template-columns:minmax(0,1fr) 420px}
.vista.v-eq.sin-bandeja{grid-template-columns:minmax(0,1fr)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.stat{border-radius:14px;background:var(--s1);border:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px;min-width:0}
.stat .v{font:600 24px/1.1 var(--font);font-variant-numeric:tabular-nums;letter-spacing:-.03em;display:flex;align-items:center;gap:9px;flex:none}
.stat .v .d{width:9px;height:9px}
.stat .k{font-size:12.5px;color:var(--tx2);line-height:1.3}
.stat .k small{display:block;font-size:inherit}
.stat.a{background:linear-gradient(var(--sig-bg),var(--sig-bg)),var(--s1);border-color:var(--sig-line)}
.stat.a .v,.stat.a .k{color:var(--sig-tx)}
.stat.a .k b{font-weight:600}
a.stat:hover{border-color:var(--tx3)}
a.stat.a:hover{border-color:var(--sig)}
.bigseg{height:6px;margin-top:14px}
.bar{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.bar .field{width:280px}
.bar .sp{flex:1}
.bar .chips{display:flex;gap:6px;flex-wrap:wrap}
.tree{margin-top:18px;display:flex;flex-direction:column;gap:18px}
.rama{display:flex;flex-direction:column;align-items:stretch}
.dirc{display:flex;align-items:center;gap:12px;width:max-content;max-width:100%;margin:0 auto;padding:10px 16px 10px 12px;border-radius:999px;background:var(--s1);border:1px solid var(--line2);position:relative;z-index:1}
.dirc:hover{border-color:var(--tx3)}
.dirc b{font-weight:600}
.dirc small{display:block;color:var(--tx2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46ch}
.dirc .av{margin:4px}
.bus{position:relative;height:26px}
.bus::before{content:"";position:absolute;left:50%;top:0;height:12px;width:1px;background:var(--line2)}
.bus::after{content:"";position:absolute;top:12px;height:1px;background:var(--line2);left:calc((100% - (var(--cols) - 1) * 12px) / (2 * var(--cols)));right:calc((100% - (var(--cols) - 1) * 12px) / (2 * var(--cols)))}
.sistemas{display:grid;gap:12px}
.sistemas.colg>.sys{position:relative}
.sistemas.colg>.sys::before{content:"";position:absolute;left:50%;top:-15px;height:14px;width:1px;background:var(--line2)}
.sys{border-radius:18px;background:var(--s1);border:1px solid var(--line);padding:14px 14px 12px;min-width:0;display:flex;flex-direction:column}
.sys.sel{border-color:var(--tx3)}
.sys header{display:flex;align-items:center;gap:8px}
.sys h3{margin:0;font:600 14px/1.2 var(--font);letter-spacing:-.01em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sys h3 a:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line2)}
.sys-dot{width:8px;height:8px;border-radius:50%;background:var(--h);flex:none}
.sys-n{font-size:12px;color:var(--tx3)}
.sys-sub{font-size:12.5px;color:var(--tx2);margin-top:3px}
.sys-sub b{color:var(--tx);font-weight:500}
.sys .orbit{margin:10px auto 10px}
.sys-f{display:flex;justify-content:space-between;margin-top:9px;font-size:12px;color:var(--tx2)}
.sys-f b{font:650 13px var(--font);font-variant-numeric:tabular-nums;color:var(--tx);margin-right:2px}
.sys-f .a,.sys-f .a b{color:var(--sig-tx)}
.sys-acts{display:flex;gap:4px;margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.newsys{border-radius:18px;border:1.5px dashed var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:14px 10px;color:var(--tx2);font-size:12.5px;background:transparent;min-height:200px}
.newsys .ring{width:54px;height:54px;border-radius:50%;border:1.5px dashed var(--tx3);display:grid;place-items:center;color:var(--tx)}
.newsys b{color:var(--tx);font-size:13.5px;font-weight:600;display:block;margin-bottom:2px}
.newsys:hover{border-color:var(--tx3);background:var(--s1)}
.tblw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed;min-width:640px}
.tbl th{font:500 12.5px var(--font);color:var(--tx3);text-align:left;padding:0;border-bottom:1px solid var(--line)}
.tbl th button{display:inline-flex;align-items:center;gap:4px;padding:8px 10px;width:100%;text-transform:inherit;letter-spacing:inherit;font:inherit;color:inherit;justify-content:inherit}
.tbl th button:hover{color:var(--tx)}
.tbl th[aria-sort=ascending] button,.tbl th[aria-sort=descending] button{color:var(--tx)}
.tbl th.t-r button{justify-content:flex-end}
.tbl td{padding:3px 10px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl tr:hover td{background:var(--s1)}
.tc-who{display:flex;align-items:center;gap:10px;min-width:0}
.tc-who .tx{display:flex;align-items:baseline;gap:7px;min-width:0}
.tc-who b{font-weight:500;line-height:1.25}
.tc-who small{font-size:12px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc-who .av{margin:5px 3px}
.tteam{display:inline-flex;align-items:center;gap:7px;color:var(--tx2)}
.tteam i{width:7px;height:7px;border-radius:50%;background:var(--h);flex:none}
.now-c{color:var(--tx2)}
.t-r{text-align:right}
td.t-r{color:var(--tx2);font-variant-numeric:tabular-nums}
/* tablero de tareas */
.lotes{display:flex;flex-direction:column;gap:10px}
.lote{border-radius:14px;background:var(--s1);border:1px solid var(--line)}
.lote>summary{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;list-style:none;flex-wrap:wrap}
.lote>summary::-webkit-details-marker{display:none}
.lote>summary b{font-weight:600;font-size:13.5px}
.lote>summary .muted{font-size:12.5px}
.lote>summary .sp{flex:1}
.lote>summary .seg{width:120px}
.lote ul{list-style:none;margin:0;padding:0 8px 8px}
.tk{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 6px;border-top:1px solid var(--line)}
.tk>.av{margin-top:2px}
.tk-1{display:flex;align-items:baseline;gap:8px;min-width:0;flex-wrap:wrap}
.tk-1 b{font-weight:500;font-size:13px}
.tk-1 span{color:var(--tx);font-size:13px}
.tk-2{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px;font-size:12px;color:var(--tx3)}
.tk details{margin-top:6px}
.tk details summary{cursor:pointer;font-size:12.5px;color:var(--tx2)}
.tk details .md{font-size:13px;margin-top:6px}

/* bandeja de aprobaciones */
.inbox{background:var(--s1);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
.inbox.lat{box-shadow:var(--shadow);z-index:2}
.inbox.pagina{border:1px solid var(--line);border-radius:18px;min-height:auto}
.ib-h{display:flex;align-items:flex-start;gap:12px;padding:20px 16px 12px 20px}
.ib-h div{flex:1;min-width:0}
.ib-h h2{margin:5px 0 3px;font:600 20px/1.2 var(--font);letter-spacing:-.02em}
.ib-h p{font-size:12.5px;color:var(--tx2)}
.ib-sel{display:flex;align-items:center;gap:10px;padding:10px 20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--tx2)}
.ib-sel label{display:inline-flex;align-items:center;gap:10px;cursor:pointer}
.ib-list{flex:1;overflow:auto;padding:4px 12px 12px;min-height:0;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.inbox.pagina .ib-list{overflow:visible}
.ib-list h3{margin:14px 8px 6px;font-size:12.5px;display:flex;align-items:center;gap:10px}
.ib-list h3 label{display:inline-flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
.ib-list ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ai{display:grid;grid-template-columns:16px 28px minmax(0,1fr);gap:10px;align-items:start;padding:10px;border-radius:12px;background:var(--s2);border:1px solid var(--line)}
.ai .cb{margin-top:6px}
.ai.sel{border-color:var(--line2);background:linear-gradient(var(--ion-bg),var(--ion-bg)),var(--s2)}
.ai-b{min-width:0;display:flex;flex-direction:column;gap:3px}
.ai-1{display:flex;align-items:baseline;gap:7px;min-width:0}
.ai-1 b{font-weight:600;font-size:13.5px}
.ai-1 span{font-size:12px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai-1 time{margin-left:auto;font:12px var(--font);font-variant-numeric:tabular-nums;color:var(--tx3);white-space:nowrap}
.ai-2{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--tx);min-width:0;word-break:break-word}
.ai-2 .i{color:var(--tx3)}
.ai-p{font-size:12.5px;color:var(--tx2);line-height:1.45}
.ai-o{font-size:12px;color:var(--tx3);display:flex;align-items:center;gap:5px}
.ai-3{display:flex;align-items:center;gap:8px;margin-top:4px;min-width:0}
.ai-3 code,.ai-3 summary{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;color:var(--tx2);background:var(--s1);border:1px solid var(--line);border-radius:7px;padding:4px 8px;display:block}
.ai-3 details{flex:1;min-width:0}
.ai-3 summary{cursor:pointer;list-style:none;font-family:var(--mono)}
.ai-3 summary::-webkit-details-marker{display:none}
.ai-3 details[open] summary{white-space:pre-wrap;word-break:break-word;max-height:240px;overflow:auto}
.ai.solo{grid-template-columns:28px minmax(0,1fr)}
.ai-3 details.leg summary{font-family:var(--font);font-size:12.5px;color:var(--tx)}
.ai-3 details.leg[open] summary{white-space:nowrap;max-height:none}
.ai-3 details.leg .det{margin-top:6px;font-size:12.5px}
.ai-act{display:flex;gap:6px;flex:none;align-self:flex-start}
.ai-act .btn{height:28px}
.ib-bar{border-top:1px solid var(--line);padding:12px 16px 16px 20px;background:var(--s1);position:sticky;bottom:0;border-radius:0 0 18px 18px}
.ib-bar-t{display:flex;align-items:baseline;gap:8px;font-size:13px;margin-bottom:10px;min-width:0}
.ib-bar-t b{font-weight:600;white-space:nowrap}
.ib-bar-t span{color:var(--tx2);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib-bar-a{display:flex;gap:8px;flex-wrap:wrap}
.ib-bar-a>.btn.sig{flex:1}
.ib-note{margin-top:10px;font-size:12px;color:var(--tx3);line-height:1.45}
.ib-vacio{padding:28px 20px;color:var(--tx2);font-size:13.5px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.ib-vacio b{color:var(--tx);font-size:14.5px}
.ib-vacio>.i{width:38px;height:38px;padding:9px;border-radius:50%;background:var(--ion-bg);color:var(--ion-tx);margin-bottom:6px}

/* diálogos */
dialog.dlg{border:1px solid var(--line2);border-radius:20px;background:var(--s1);color:var(--tx);box-shadow:var(--shadow);padding:0;width:min(760px,calc(100% - 24px));max-height:calc(100dvh - 32px)}
dialog.dlg.chico{width:min(480px,calc(100% - 24px))}
dialog.dlg::backdrop{background:var(--scrim)}
.dlg-f{display:flex;flex-direction:column;gap:14px;padding:22px;max-height:calc(100dvh - 34px);overflow:auto}
.dlg-f:focus{outline:none}
.dlg-f h2{margin:4px 0 2px;font:650 20px/1.2 var(--font);letter-spacing:-.025em}
.dlg-f>p,.dlg-f .lead{color:var(--tx2);font-size:13.5px}
.dlg-f .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;position:sticky;bottom:-22px;background:var(--s1);padding:10px 0 0;margin-top:2px}
.dlg-2{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:0 22px}
.dlg-2 .prev{text-align:center;font-size:12px;color:var(--tx3);align-self:start;position:sticky;top:0;display:flex;flex-direction:column;gap:8px;padding-top:30px}
.dlg-2 .prev ul{list-style:none;margin:0;padding:0;font-size:12px;color:var(--tx2);text-align:left;max-height:180px;overflow:auto}
.tpl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tpl label{border:1px solid var(--line2);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:2px;cursor:pointer;position:relative}
.tpl label:hover{border-color:var(--tx3)}
.tpl label:has(input:checked){border-color:var(--tx);box-shadow:inset 0 0 0 1px var(--tx)}
.tpl label:has(input:focus-visible){outline:2px solid var(--ion);outline-offset:2px}
.tpl input{position:absolute;opacity:0;pointer-events:none}
.tpl small{color:var(--tx3);font-size:12px}
.stepper{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--s2);border:1px solid var(--line)}
.stepper input{width:52px;text-align:center;font:600 21px var(--font);font-variant-numeric:tabular-nums;background:none;border:0;color:var(--tx);outline:none;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{display:none}
.stepper .ib{border:1px solid var(--line2)}
.stepper .lb{flex:1;font-size:13px;color:var(--tx2);min-width:0}
.nombres{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px;margin-top:8px}
.nombres .inp{height:30px;font-size:12.5px;padding:0 8px}
.lista-chk{display:flex;flex-direction:column;gap:2px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px;background:var(--s2)}
.lista-chk label{display:flex;align-items:center;gap:10px;padding:5px 6px;border-radius:8px;font-size:13px;cursor:pointer}
.lista-chk label:hover{background:var(--s3)}
.lista-chk small{color:var(--tx3);font-size:12px;margin-left:auto;white-space:nowrap}
details.mas>summary{cursor:pointer;font-size:12.5px;color:var(--tx2);list-style:none;display:inline-flex;align-items:center;gap:4px}
details.mas>summary::-webkit-details-marker{display:none}
details.mas[open]>summary .i{transform:rotate(90deg)}
details.mas>div{margin-top:10px;display:flex;flex-direction:column;gap:12px}
/* hojas: listas de opciones (Más, acciones del compañero) */
.hoja{display:flex;flex-direction:column;margin:0 -8px}
.hf{display:flex;align-items:center;gap:14px;min-height:56px;padding:8px;border-radius:12px;color:var(--tx);text-align:left;width:100%}
@media (hover:hover){.hf:hover{background:var(--s2)}}
.hf>.ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--s2);border:1px solid var(--line);color:var(--tx2);flex:none}
.hf>span:not(.ic){flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;font-size:14.5px;font-weight:500}
.hf small{font-size:12.5px;color:var(--tx3);font-weight:400}
.hf>.i{color:var(--tx3)}
.hf.pel>.ic{color:var(--sig-tx)}
.hoja hr{border:0;border-top:1px solid var(--line);margin:6px 8px}

/* reuniones */
.reus{display:flex;flex-direction:column;gap:8px}
.reu{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--s1);border:1px solid var(--line)}
.reu:hover{border-color:var(--line2)}
.reu .tt{min-width:0}
.reu .tt b{font-weight:600;font-size:14px}
.reu .tt p{font-size:12.5px;color:var(--tx2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reu .meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--tx3);margin-top:4px;flex-wrap:wrap}
.reu.viva{border-color:color-mix(in oklab,var(--ion) 40%,var(--line));box-shadow:0 0 0 3px var(--ion-bg)}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;font:600 11.5px/1 var(--font);background:var(--s3);color:var(--tx2);white-space:nowrap}
.tag.fac{background:var(--pri);color:var(--on-pri)}
.tag.ion{background:var(--ion-bg);color:var(--ion-tx)}
.tag.sig{background:var(--sig-bg);color:var(--sig-tx)}
.livep{display:inline-flex;align-items:center;gap:7px;height:22px;padding:0 10px 0 8px;border-radius:999px;background:var(--ion-bg);color:var(--ion-tx);font:600 12px var(--font)}
.livep i{width:7px;height:7px;border-radius:50%;background:var(--ion);box-shadow:0 0 0 3px color-mix(in oklab,var(--ion) 25%,transparent)}
/* sala */
.mtm{display:grid;grid-template-columns:290px minmax(0,1fr) 372px;grid-template-rows:auto minmax(0,1fr);min-width:0;min-height:0;background:radial-gradient(800px 460px at 20% -10%,var(--glow),transparent 70%),var(--bg)}
.mt-top{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:16px 22px 14px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mt-top .tt{flex:1;min-width:0}
.mt-top h1{margin:5px 0 0;font:600 21px/1.2 var(--font);letter-spacing:-.02em}
.mt-meta{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:12.5px;color:var(--tx2);flex-wrap:wrap}
.mt-meta .mono{color:var(--tx)}
.mt-top .acts{display:flex;gap:8px;flex-wrap:wrap}
.ppl{border-right:1px solid var(--line);overflow:auto;padding:18px 18px 24px;min-height:0;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.ppl .orbit{margin:20px auto 34px}
.ord{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.ord li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:9px;align-items:center;min-height:36px;padding:4px 8px;border-radius:10px;font-size:13px}
.ord b{font-weight:500}
.ord small{color:var(--tx3);font-size:12px;display:block;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ord .tm{font:12px var(--font);font-variant-numeric:tabular-nums;color:var(--tx3)}
.ord li.now{background:var(--s2);box-shadow:inset 0 0 0 1px var(--line2)}
.ord li.now small{color:var(--ion-tx)}
.ord .av>i,.ord .av::after{display:none}
.agenda{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--tx2);white-space:pre-wrap}
.conv{display:flex;flex-direction:column;min-width:0;min-height:0}
.feed{flex:1;overflow:auto;padding:18px 26px 10px;min-height:0;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.feed-in{max-width:660px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.mt{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px}
.mt-b{min-width:0;border-radius:14px;background:var(--s1);border:1px solid var(--line);padding:11px 14px 12px}
.mt-h{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
.mt-h b{font-weight:600}
.mt-h .r{color:var(--tx3);font-size:12.5px}
.mt-h time{margin-left:auto;font:12px var(--font);font-variant-numeric:tabular-nums;color:var(--tx3)}
.mt .md{font-size:13.5px;line-height:1.55}
.mt.fac .mt-b{border-color:var(--line2)}
.mt.you{grid-template-columns:minmax(0,1fr) 32px}
.mt.you>.av{order:2}
.mt.you .mt-b{background:var(--s3);border-color:var(--line2);border-radius:14px 4px 14px 14px}
.mt.talk .mt-b{border-color:color-mix(in oklab,var(--ion) 45%,var(--line));box-shadow:0 0 0 3px var(--ion-bg)}
.mt.talk .md{color:var(--tx2)}
.mt-sis{display:flex;justify-content:center;font-size:12.5px;color:var(--tx3);text-align:center}
.mcmp{padding:8px 26px 18px;flex:none}
.mcmp-box{max-width:660px;margin:0 auto;border:1px solid var(--line2);background:var(--s2);border-radius:16px;padding:10px 10px 8px 14px}
.mcmp-box:focus-within{border-color:var(--tx3)}
.mcmp textarea{display:block;width:100%;resize:none;border:0;background:none;outline:none;font-size:14px;line-height:22px;height:26px;max-height:160px;color:var(--tx);padding:2px 0}
.mcmp textarea::placeholder{color:var(--tx3)}
.mcmp-bar{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.mcmp-bar .sp{flex:1}
.mcmp-bar .menc{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
.mcmp-bar .menc::-webkit-scrollbar{display:none}
.mcmp-bar .chip{height:24px;font-size:11.5px;padding:0 8px}
.mcmp .hint{font-size:12px;color:var(--tx3);max-width:660px;margin:6px auto 0;padding-left:4px}
.sum{border-left:1px solid var(--line);background:var(--s1);display:flex;flex-direction:column;min-height:0}
.sum-h{padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.sum-h h2{margin:0;font:600 17px/1.2 var(--font);letter-spacing:-.015em}
.sum-h p{font-size:12px;color:var(--tx3);margin-top:4px;display:flex;align-items:center;gap:6px}
.sum-h p i{width:6px;height:6px;border-radius:50%;background:var(--ion);flex:none}
.sum-b{flex:1;overflow:auto;padding:6px 20px 16px;min-height:0;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.sum-b section{padding:12px 0 6px}
.sum-b section+section{border-top:1px solid var(--line)}
.sum-b h3{display:flex;justify-content:space-between;margin:0 0 8px}
.sum-b ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.sum-b .res{font-size:13px;line-height:1.55;color:var(--tx)}
.dec li{display:flex;gap:9px;font-size:13px;align-items:flex-start;line-height:1.45}
.dec .i{color:var(--tx2);margin-top:1px;width:16px;height:16px}
.tasks li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;align-items:start;font-size:13px;padding:7px 8px;border-radius:10px;margin:0 -8px}
.tasks li .av>i,.tasks li .av::after{display:none}
.tasks .tt b{font-weight:500;display:block;line-height:1.4}
.tasks .tt small{display:flex;align-items:center;gap:6px;color:var(--tx3);font-size:12px;margin-top:3px;flex-wrap:wrap}
.sum-f{border-top:1px solid var(--line);padding:12px 20px 16px;display:flex;flex-direction:column;gap:10px}
.sum-f .btn{width:100%}
.callout{display:flex;gap:10px;padding:10px 12px;border-radius:12px;border:1px dashed var(--tx3);font-size:13px;line-height:1.45;color:var(--tx)}
.callout.sig{border:1px solid var(--sig-line);background:var(--sig-bg);color:var(--sig-tx)}

/* computadora */
.pc{display:grid;grid-template-columns:280px minmax(0,1fr);gap:12px;min-height:0}
.pc-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.arbol{list-style:none;margin:0;padding:0;font-size:13px}
.arbol ul{list-style:none;margin:0;padding:0 0 0 14px;border-left:1px solid var(--line);margin-left:8px}
.arbol button{display:flex;align-items:center;gap:7px;width:100%;text-align:left;padding:4px 6px;border-radius:7px;color:var(--tx2);min-width:0}
.arbol button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.arbol button small{margin-left:auto;font:11.5px var(--font);font-variant-numeric:tabular-nums;color:var(--tx3);flex:none}
.arbol button:hover{background:var(--s2);color:var(--tx)}
.arbol button[aria-current=true]{background:var(--s3);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line2)}
.arbol .i{width:15px;height:15px;color:var(--tx3)}
.arbol-w{max-height:520px;overflow:auto;margin-top:8px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.visor-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.visor-h b{font:500 13px var(--mono);word-break:break-all}
.visor-h .sp{flex:1}
.visor pre{margin:0;max-height:520px;min-height:120px;white-space:pre-wrap;word-break:break-word}
.term{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.term li{border:1px solid var(--line);border-radius:10px;background:var(--s2)}
.term summary{display:flex;align-items:center;gap:10px;padding:7px 10px;cursor:pointer;list-style:none;min-width:0;font-size:12.5px}
.term summary::-webkit-details-marker{display:none}
.term code{color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.term small{color:var(--tx3);font:12px var(--font);font-variant-numeric:tabular-nums;white-space:nowrap}
.term pre{margin:0 10px 10px}

/* rutinas, memoria, perfil */
.tab-pag{padding:18px 28px 32px;max-width:820px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.tab-pag.ancha{max-width:1120px}
.rut{border-radius:14px;background:var(--s1);border:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.rut-h{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.rut-h .tt{flex:1;min-width:200px}
.rut-h b{font-weight:600;font-size:14px}
.rut-h p{font-size:12.5px;color:var(--tx2);margin-top:2px}
.rut-a{display:flex;gap:4px;flex-wrap:wrap}
.runs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.runs li{display:flex;gap:8px;align-items:baseline;color:var(--tx2);min-width:0}
.runs li span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.runs time{font:12px var(--font);font-variant-numeric:tabular-nums;color:var(--tx3);white-space:nowrap}
.form-card{border-radius:16px;background:var(--s1);border:1px solid var(--line2);padding:16px;display:flex;flex-direction:column;gap:12px}
.form-card .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.mem{border-radius:14px;background:var(--s1);border:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.mem-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mem-h b{font:500 13px var(--mono)}
.mem-h .sp{flex:1}
.mem textarea{font-family:var(--mono);font-size:12.5px;min-height:110px}
.peligro{border-color:var(--line2)}

/* ajustes */
.aj{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.aj .card.full{grid-column:1/-1}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.meter i{display:block;height:100%;background:var(--tx2);border-radius:4px}
.meter.suave i{background:var(--ion)}
.meter.tope i{background:var(--sig)}
.big{font:500 26px/1.1 var(--mono);letter-spacing:-.02em}
.top-bots{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.top-bots li{display:grid;grid-template-columns:22px minmax(0,1fr) 80px auto;gap:8px;align-items:center;font-size:12.5px}
.top-bots .bar-h{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.top-bots .bar-h i{display:block;height:100%;background:var(--tx3)}
.top-bots span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reglas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.reglas li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.reglas li:first-child{border-top:0}
.reglas small{display:block;color:var(--tx3);font-size:12px}
.habs{display:flex;flex-direction:column;gap:8px}
.info{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:13px}
.info dt{color:var(--tx3)}
.info dd{margin:0;font-family:var(--mono);font-size:12.5px;word-break:break-all}

/* conexiones */
.cx{border-radius:16px;background:var(--s1);border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.cx-h{display:flex;align-items:flex-start;gap:12px}
.cx-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--ion-bg);color:var(--ion-tx);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--ion) 22%,transparent);flex:none}
.cx-ic .i{width:20px;height:20px}
.cx-h .tt{flex:1;min-width:0}
.cx-h b{font-weight:600;font-size:14px}
.cx-h p{font-size:12.5px;color:var(--tx2);margin-top:2px;line-height:1.45}
.cx-acc{display:flex;flex-wrap:wrap;gap:5px}
.cx-acc span{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--tx2);background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.cx-acc span.esc{color:var(--sig-tx);background:var(--sig-bg);border-color:var(--sig-line)}
.cx-acc span.esc::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--sig);flex:none}
.cx-a{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.codigo{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:12px;background:var(--sig-bg);box-shadow:inset 0 0 0 1px var(--sig-line);color:var(--sig-tx);font-size:13px}
.codigo b{font:600 22px/1.2 var(--mono);letter-spacing:.12em;color:var(--sig-tx)}
.cx-aviso{display:flex;align-items:flex-start;gap:8px;margin-top:12px;font-size:13px;color:var(--tx2);line-height:1.45}
.cx-aviso .i{color:var(--tx3);margin-top:2px}
.cx-aviso b{color:var(--sig-tx);font-weight:600}
.pasos{margin:0;padding-left:20px;font-size:13px;color:var(--tx2);display:flex;flex-direction:column;gap:4px}

/* toasts */
.toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:100;pointer-events:none;width:min(460px,calc(100% - 24px))}
.toast{pointer-events:auto;background:var(--pri);color:var(--on-pri);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:500;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center}
.toast.err{background:var(--s3);color:var(--tx);box-shadow:var(--shadow),inset 0 0 0 1px var(--tx3)}
.carga{display:grid;place-items:center;flex:1;color:var(--tx3);font-size:13px;padding:40px}

/* ---------- responsivo ---------- */
@media (max-width:1279px){
  .vista.v-chats{grid-template-columns:292px minmax(0,1fr)}
  .vista.v-chats .ctx{display:none}
  .vista.v-eq{grid-template-columns:minmax(0,1fr)}
  .vista.v-eq .inbox.lat{display:none}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mtm{grid-template-columns:250px minmax(0,1fr) 330px}
}
@media (max-width:1100px){
  .mtm{grid-template-columns:minmax(0,1fr) 340px}
  .mtm .ppl{display:none}
  .aj{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:1280px){
  /* sin compañero elegido no hay contexto que mostrar a la derecha */
  .vista.v-chats.sin-bot{grid-template-columns:304px minmax(0,1fr)}
  .vista.v-chats.sin-bot .ctx{display:none}
}
@media (max-width:980px){
  .vista.v-chats{grid-template-columns:minmax(0,1fr)}
  .vista.v-chats .side{display:none}
  .vista.v-chats.sin-bot .side{display:flex;border-right:0}
  .vista.v-chats.sin-bot .main{display:none}
  /* primer uso: la bienvenida (con la marca y las plantillas) en vez de una lista vacía */
  .vista.v-chats.sin-bot.vacia .side{display:none}
  .vista.v-chats.sin-bot.vacia .main{display:flex}
  .back{display:inline-grid!important}
  .bh{padding-left:12px}
  .pc{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:860px){
  .sistemas{grid-template-columns:minmax(0,1fr)!important}
  .bus{display:none}
  .sistemas.colg>.sys::before{display:none}
  .dirc{margin-bottom:0}
  body.en-sala{overflow:auto}
  .mtm{display:flex;flex-direction:column;overflow:auto}
  .mtm>*{flex-shrink:0}
  .mtm .ppl{display:block;border-right:0;border-bottom:1px solid var(--line);padding:12px 16px;overflow:visible}
  .ppl .orbit,.ppl .agenda,.ppl>.micro{display:none}
  .ord{flex-direction:row;overflow-x:auto;gap:6px;margin:0;scrollbar-width:none}
  .ord::-webkit-scrollbar{display:none}
  .ord li{grid-template-columns:24px auto;min-width:max-content;gap:7px;padding:5px 10px 5px 6px;border:1px solid var(--line);border-radius:999px}
  .ord li .tm,.ord li small{display:none}
  .feed{overflow:visible;padding:14px 14px 8px}
  .conv{min-height:auto}
  .sum{border-left:0;border-top:1px solid var(--line)}
  .sum-b{overflow:visible}
  .dlg-2{grid-template-columns:minmax(0,1fr)}
  .dlg-2 .prev{display:none}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);height:calc(100dvh - 62px - env(safe-area-inset-bottom))}
  .rail{display:none}
  .mnav{display:flex;position:fixed;left:0;right:0;bottom:0;height:calc(62px + env(safe-area-inset-bottom));background:var(--rail);border-top:1px solid var(--line);z-index:20;padding:0 6px env(safe-area-inset-bottom)}
  .mnav a,.mnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:500;color:var(--tx2);position:relative;min-width:0}
  .mnav .on{color:var(--tx);font-weight:600}
  .mnav .on::before{content:"";position:absolute;top:7px;left:50%;width:54px;height:30px;margin-left:-27px;border-radius:15px;background:var(--s3);box-shadow:inset 0 0 0 1px var(--line)}
  .mnav .i{width:21px;height:21px;position:relative}
  /* adentro de un chat la barra inferior sobra (la flecha vuelve a la lista); con el teclado, también */
  body.en-chat .mnav,body:has(:is(textarea,input:not([type=checkbox],[type=radio],[type=range])):focus) .mnav{display:none}
  body.en-chat .app,body:has(:is(textarea,input:not([type=checkbox],[type=radio],[type=range])):focus) .app{height:100vh;height:100dvh}
  .mnav .bdg{top:7px;left:calc(50% + 5px)}
  .mnav .live{top:10px;left:calc(50% + 8px)}
  .aviso-g{padding:8px 14px}
  /* lista de compañeros: marca arriba, filas de dos líneas y del tamaño de un dedo */
  .marca-m{display:flex}
  .side-h{padding:14px 10px 12px 16px;gap:4px}
  .side-h h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .side-h .btn{height:34px;padding:0 12px;border-radius:999px}
  .side-h .ib{width:38px;height:38px;border-radius:50%}
  .agg{margin:0 12px 12px}
  .find{padding:0 12px 6px}
  .side-scroll{padding:2px 8px calc(20px + env(safe-area-inset-bottom))}
  .row{height:58px;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;padding:0 10px;border-radius:12px}
  .row>.av{--sz:36px!important}
  .who{flex-direction:column;align-items:flex-start;gap:2px}
  .who b{font-size:15px}
  .who span{font-size:13px;max-width:100%}
  .grp-a{grid-template-columns:40px minmax(0,1fr) auto;gap:12px;padding:10px 8px 10px 6px;border-radius:12px}
  .grp-a>.av{--sz:40px!important}
  .gn{flex-direction:column;align-items:flex-start;gap:2px}
  .gn b{font-size:15px}
  .gn span{font-size:13px;max-width:100%}
  .grp-b{margin-left:30px}
  .chev-b{height:40px}
  .st{font-size:12.5px}
  /* bienvenida en el celular */
  .hola{padding:22px 16px 32px;place-items:start center}
  .hola-in{gap:16px}
  .hola .orbit{max-width:176px}
  .hola h1{font-size:25px}
  .hola .acts{width:100%;flex-direction:column}
  .hola .acts .btn{width:100%;height:46px}
  .tpls{grid-template-columns:minmax(0,1fr)}
  /* cabecera del compañero */
  .bh{padding:10px 10px 8px 4px;gap:6px}
  .bh-deco{display:none}
  .bh-id{gap:10px}
  .bh-id>.av{--sz:34px!important}
  .bh-name h2{font-size:16.5px}
  .bh-name span{display:none}
  .bh-meta{margin-top:3px}
