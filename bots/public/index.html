.hall li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--s1);border:1px solid var(--line);font-size:13.5px}
.reu{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--s1);border:1px solid var(--line)}
.reu:hover{border-color:var(--line2)}
.reu .tt{min-width:0}
.reu .tt b{font-weight:600;font-size:14px}
.reu .tt p{font-size:12.5px;color:var(--tx2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reu .meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--tx3);margin-top:4px;flex-wrap:wrap}
.reu.viva{border-color:color-mix(in oklab,var(--ion) 40%,var(--line));box-shadow:0 0 0 3px var(--ion-bg)}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;font:600 11.5px/1 var(--font);background:var(--s3);color:var(--tx2);white-space:nowrap}
.tag.fac{background:var(--pri);color:var(--on-pri)}
.tag.ion{background:var(--ion-bg);color:var(--ion-tx)}
.tag.sig{background:var(--sig-bg);color:var(--sig-tx)}
.livep{display:inline-flex;align-items:center;gap:7px;height:22px;padding:0 10px 0 8px;border-radius:999px;background:var(--ion-bg);color:var(--ion-tx);font:600 12px var(--font)}
.livep i{width:7px;height:7px;border-radius:50%;background:var(--ion);box-shadow:0 0 0 3px color-mix(in oklab,var(--ion) 25%,transparent)}
/* sala */
.mtm{display:grid;grid-template-columns:290px minmax(0,1fr) 372px;grid-template-rows:auto minmax(0,1fr);min-width:0;min-height:0;background:radial-gradient(800px 460px at 20% -10%,var(--glow),transparent 70%),var(--bg)}
.mt-top{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:16px 22px 14px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mt-top .tt{flex:1;min-width:0}
.mt-top h1{margin:5px 0 0;font:600 21px/1.2 var(--font);letter-spacing:-.02em}
.mt-meta{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:12.5px;color:var(--tx2);flex-wrap:wrap}
.mt-meta .mono{color:var(--tx)}
.mt-top .acts{display:flex;gap:8px;flex-wrap:wrap}
.ppl{border-right:1px solid var(--line);overflow:auto;padding:18px 18px 24px;min-height:0;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.ppl .orbit{margin:20px auto 34px}
.ord{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.ord li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:9px;align-items:center;min-height:36px;padding:4px 8px;border-radius:10px;font-size:13px}
.ord b{font-weight:500}
.ord small{color:var(--tx3);font-size:12px;display:block;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ord .tm{font:12px var(--font);font-variant-numeric:tabular-nums;color:var(--tx3)}
.ord li.now{background:var(--s2);box-shadow:inset 0 0 0 1px var(--line2)}
.ord li.now small{color:var(--ion-tx)}
.ord .av>i,.ord .av::after{display:none}
.agenda{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--tx2);white-space:pre-wrap}
.conv{display:flex;flex-direction:column;min-width:0;min-height:0}
.feed{flex:1;overflow:auto;padding:18px 26px 10px;min-height:0;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.feed-in{max-width:660px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.mt{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px}
.mt-b{min-width:0;border-radius:14px;background:var(--s1);border:1px solid var(--line);padding:11px 14px 12px}
.mt-h{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
.mt-h b{font-weight:600}
.mt-h .r{color:var(--tx3);font-size:12.5px}
.mt-h time{margin-left:auto;font:12px var(--font);font-variant-numeric:tabular-nums;color:var(--tx3)}
.mt .md{font-size:13.5px;line-height:1.55}
.mt.fac .mt-b{border-color:var(--line2)}
.mt.you{grid-template-columns:minmax(0,1fr) 32px}
.mt.you>.av{order:2}
.mt.you .mt-b{background:var(--s3);border-color:var(--line2);border-radius:14px 4px 14px 14px}
.mt.talk .mt-b{border-color:color-mix(in oklab,var(--ion) 45%,var(--line));box-shadow:0 0 0 3px var(--ion-bg)}
.mt.talk .md{color:var(--tx2)}
.mt-sis{display:flex;justify-content:center;font-size:12.5px;color:var(--tx3);text-align:center}
.mcmp{padding:8px 26px 18px;flex:none}
.mcmp-box{max-width:660px;margin:0 auto;border:1px solid var(--line2);background:var(--s2);border-radius:16px;padding:10px 10px 8px 14px}
.mcmp-box:focus-within{border-color:var(--tx3)}
.mcmp textarea{display:block;width:100%;resize:none;border:0;background:none;outline:none;font-size:14px;line-height:22px;height:26px;max-height:160px;color:var(--tx);padding:2px 0}
.mcmp textarea::placeholder{color:var(--tx3)}
.mcmp-bar{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.mcmp-bar .sp{flex:1}
.mcmp-bar .menc{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
.mcmp-bar .menc::-webkit-scrollbar{display:none}
.mcmp-bar .chip{height:24px;font-size:11.5px;padding:0 8px}
.mcmp .hint{font-size:12px;color:var(--tx3);max-width:660px;margin:6px auto 0;padding-left:4px}
.sum{border-left:1px solid var(--line);background:var(--s1);display:flex;flex-direction:column;min-height:0}
.sum-h{padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.sum-h h2{margin:0;font:600 17px/1.2 var(--font);letter-spacing:-.015em}
.sum-h p{font-size:12px;color:var(--tx3);margin-top:4px;display:flex;align-items:center;gap:6px}
.sum-h p i{width:6px;height:6px;border-radius:50%;background:var(--ion);flex:none}
.sum-b{flex:1;overflow:auto;padding:6px 20px 16px;min-height:0;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.sum-b section{padding:12px 0 6px}
.sum-b section+section{border-top:1px solid var(--line)}
.sum-b h3{display:flex;justify-content:space-between;margin:0 0 8px}
.sum-b ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.sum-b .res{font-size:13px;line-height:1.55;color:var(--tx)}
.dec li{display:flex;gap:9px;font-size:13px;align-items:flex-start;line-height:1.45}
.dec .i{color:var(--tx2);margin-top:1px;width:16px;height:16px}
.tasks li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;align-items:start;font-size:13px;padding:7px 8px;border-radius:10px;margin:0 -8px}
.tasks li .av>i,.tasks li .av::after{display:none}
.tasks .tt b{font-weight:500;display:block;line-height:1.4}
.tasks .tt small{display:flex;align-items:center;gap:6px;color:var(--tx3);font-size:12px;margin-top:3px;flex-wrap:wrap}
.sum-f{border-top:1px solid var(--line);padding:12px 20px 16px;display:flex;flex-direction:column;gap:10px}
.sum-f .btn{width:100%}
.callout{display:flex;gap:10px;padding:10px 12px;border-radius:12px;border:1px dashed var(--tx3);font-size:13px;line-height:1.45;color:var(--tx)}
.callout.sig{border:1px solid var(--sig-line);background:var(--sig-bg);color:var(--sig-tx)}

/* computadora */
.pc{display:grid;grid-template-columns:280px minmax(0,1fr);gap:12px;min-height:0}
.pc-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.arbol{list-style:none;margin:0;padding:0;font-size:13px}
.arbol ul{list-style:none;margin:0;padding:0 0 0 14px;border-left:1px solid var(--line);margin-left:8px}
.arbol button{display:flex;align-items:center;gap:7px;width:100%;text-align:left;padding:4px 6px;border-radius:7px;color:var(--tx2);min-width:0}
.arbol button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.arbol button small{margin-left:auto;font:11.5px var(--font);font-variant-numeric:tabular-nums;color:var(--tx3);flex:none}
.arbol button:hover{background:var(--s2);color:var(--tx)}
.arbol button[aria-current=true]{background:var(--s3);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line2)}
.arbol .i{width:15px;height:15px;color:var(--tx3)}
.arbol-w{max-height:520px;overflow:auto;margin-top:8px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.visor-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.visor-h b{font:500 13px var(--mono);word-break:break-all}
.visor-h .sp{flex:1}
.visor pre{margin:0;max-height:520px;min-height:120px;white-space:pre-wrap;word-break:break-word}
.term{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.term li{border:1px solid var(--line);border-radius:10px;background:var(--s2)}
.term summary{display:flex;align-items:center;gap:10px;padding:7px 10px;cursor:pointer;list-style:none;min-width:0;font-size:12.5px}
.term summary::-webkit-details-marker{display:none}
.term code{color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.term small{color:var(--tx3);font:12px var(--font);font-variant-numeric:tabular-nums;white-space:nowrap}
.term pre{margin:0 10px 10px}

/* rutinas, memoria, perfil */
.tab-pag{padding:18px 28px 32px;max-width:820px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.tab-pag.ancha{max-width:1120px}
.rut{border-radius:14px;background:var(--s1);border:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.rut-h{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.rut-h .tt{flex:1;min-width:200px}
.rut-h b{font-weight:600;font-size:14px}
.rut-h p{font-size:12.5px;color:var(--tx2);margin-top:2px}
.rut-a{display:flex;gap:4px;flex-wrap:wrap}
.runs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.runs li{display:flex;gap:8px;align-items:baseline;color:var(--tx2);min-width:0}
.runs li span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.runs time{font:12px var(--font);font-variant-numeric:tabular-nums;color:var(--tx3);white-space:nowrap}
.form-card{border-radius:16px;background:var(--s1);border:1px solid var(--line2);padding:16px;display:flex;flex-direction:column;gap:12px}
.form-card .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.mem{border-radius:14px;background:var(--s1);border:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.mem-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mem-h b{font:500 13px var(--mono)}
.mem-h .sp{flex:1}
.mem textarea{font-family:var(--mono);font-size:12.5px;min-height:110px}
.peligro{border-color:var(--line2)}

/* ajustes */
.aj{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.aj .card.full{grid-column:1/-1}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.meter i{display:block;height:100%;background:var(--tx2);border-radius:4px}
.meter.suave i{background:var(--ion)}
.meter.tope i{background:var(--sig)}
.big{font:500 26px/1.1 var(--mono);letter-spacing:-.02em}
.top-bots{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.top-bots li{display:grid;grid-template-columns:22px minmax(0,1fr) 80px auto;gap:8px;align-items:center;font-size:12.5px}
.top-bots .bar-h{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.top-bots .bar-h i{display:block;height:100%;background:var(--tx3)}
.top-bots span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reglas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.reglas li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.reglas li:first-child{border-top:0}
.reglas small{display:block;color:var(--tx3);font-size:12px}
.habs{display:flex;flex-direction:column;gap:8px}
.info{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:13px}
.info dt{color:var(--tx3)}
.info dd{margin:0;font-family:var(--mono);font-size:12.5px;word-break:break-all}

/* conexiones */
.cx{border-radius:16px;background:var(--s1);border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.cx-h{display:flex;align-items:flex-start;gap:12px}
.cx-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--ion-bg);color:var(--ion-tx);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--ion) 22%,transparent);flex:none}
.cx-ic .i{width:20px;height:20px}
.cx-h .tt{flex:1;min-width:0}
.cx-h b{font-weight:600;font-size:14px}
.cx-h p{font-size:12.5px;color:var(--tx2);margin-top:2px;line-height:1.45}
.cx-acc{display:flex;flex-wrap:wrap;gap:5px}
.cx-acc span{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--tx2);background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.cx-acc span.esc{color:var(--sig-tx);background:var(--sig-bg);border-color:var(--sig-line)}
.cx-acc span.esc::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--sig);flex:none}
.cx-a{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.codigo{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:12px;background:var(--sig-bg);box-shadow:inset 0 0 0 1px var(--sig-line);color:var(--sig-tx);font-size:13px}
.codigo b{font:600 22px/1.2 var(--mono);letter-spacing:.12em;color:var(--sig-tx)}
.cx-aviso{display:flex;align-items:flex-start;gap:8px;margin-top:12px;font-size:13px;color:var(--tx2);line-height:1.45}
.cx-aviso .i{color:var(--tx3);margin-top:2px}
.cx-aviso b{color:var(--sig-tx);font-weight:600}
.pasos{margin:0;padding-left:20px;font-size:13px;color:var(--tx2);display:flex;flex-direction:column;gap:4px}

/* mensajes (WhatsApp y redes por las notificaciones del celular) */
.vista.v-msj{grid-template-columns:340px minmax(0,1fr) 330px}
.vista.v-msj.sin-chat{grid-template-columns:340px minmax(0,1fr)}
.vista.v-msj.sin-chat .ctx{display:none}
.msj-est{display:flex;align-items:center;gap:8px;margin:0 12px 10px;padding:8px 10px 8px 12px;border-radius:12px;background:var(--s2);border:1px solid var(--line);font-size:12.5px;color:var(--tx2)}
.msj-est>span{flex:1;min-width:0}
.msj-est b{color:var(--tx);font-weight:600}
.msj-est .d{margin-right:2px}
.deriv{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:12px;background:var(--sig-bg);box-shadow:inset 0 0 0 1px var(--sig-line);color:var(--sig-tx);font-size:13px;line-height:1.45;text-align:left;width:100%}
.deriv .i{margin-top:1px}
.deriv b{font-weight:600}
.deriv>span{flex:1;min-width:0}
a.deriv:hover{background:color-mix(in oklab,var(--sig) 16%,transparent)}
.derivs{display:flex;flex-direction:column;gap:6px;margin:0 12px 10px}
.mgrp-h{display:flex;align-items:center;gap:8px;padding:14px 8px 6px;font:600 12px var(--font);color:var(--tx3)}
.mgrp-h .gl{width:22px;height:22px;border-radius:7px;box-shadow:none;background:var(--s3)}
.mgrp-h .gl .i{width:13px;height:13px}
.mgrp-h span{font-weight:500;font-variant-numeric:tabular-nums}
.mrow{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:3px 11px;align-items:start;padding:9px 8px;border-radius:12px;color:var(--tx)}
.mrow:hover{background:var(--s2)}
.mrow.on{background:var(--s3);box-shadow:inset 0 0 0 1px var(--line2)}
.mav{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--s3);color:var(--tx2);font:600 13.5px/1 var(--font);box-shadow:inset 0 0 0 1px var(--line2);flex:none}
.mav .i{width:18px;height:18px}
.mav.lg{width:42px;height:42px}
.mtx{min-width:0;display:flex;flex-direction:column;gap:2px}
.mt1{display:flex;align-items:baseline;gap:7px;min-width:0}
.mt1 b{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow.nl .mt1 b{font-weight:700}
.mt2{font-size:12.5px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow.nl .mt2{color:var(--tx2)}
.mt3{display:flex;align-items:center;gap:6px;margin-top:4px;min-width:0}
.mt3 .pill{height:21px;font-size:11.5px;padding:0 8px}
.mrt{display:flex;flex-direction:column;align-items:flex-end;gap:5px;padding-top:2px}
.mrt time{font:12px var(--font);font-variant-numeric:tabular-nums;color:var(--tx3);white-space:nowrap}
.cprow{display:grid;grid-template-columns:38px minmax(0,1fr);gap:2px 11px;align-items:center;padding:8px;border-radius:12px;color:var(--tx)}
.cprow:hover{background:var(--s2)}
.cprow b{font-weight:500;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.cprow small{font-size:12px;color:var(--tx3);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.apps{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--s2);overflow:hidden}
.apps label{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer;min-height:52px;font-size:13.5px}
.apps label:first-child{border-top:0}
.apps label>span:not(.gl){flex:1;min-width:0;display:flex;flex-direction:column}
.apps label small{font-size:12px;color:var(--tx3)}
.apps label.todo{background:var(--s1)}
.msj-vacio{display:flex;flex-direction:column;gap:14px;padding:6px 4px 18px}
.msj-vacio h2{font:650 18px/1.25 var(--font);letter-spacing:-.02em}
.msj-vacio p{font-size:13.5px;color:var(--tx2);line-height:1.5}
.msj-vacio .pasos{font-size:13.5px;color:var(--tx);gap:6px}
.msj-vacio .pasos b{font-weight:600}
.mhint{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--tx3);line-height:1.45}
.mhint .i{flex:none;margin-top:1px}
.mtin{max-width:700px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.ms{display:flex;flex-direction:column;gap:3px;max-width:min(82%,560px);min-width:0}
.ms .q{font:600 12px/1.3 var(--font);color:var(--tx2);display:flex;align-items:center;gap:6px;padding:0 4px;flex-wrap:wrap}
.ms .q .av>i,.ms .q .av::after{display:none}
.ms .bb{padding:8px 12px;border-radius:16px;white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.45}
.ms time,.ms .est{font:11.5px var(--font);font-variant-numeric:tabular-nums;color:var(--tx3);padding:0 4px}
.ms.ext{align-self:flex-start}
.ms.ext .bb{background:var(--s1);border:1px solid var(--line);border-radius:5px 16px 16px 16px;color:var(--tx)}
.ms.yo,.ms.bot{align-self:flex-end;align-items:flex-end}
.ms.yo .bb{background:var(--s3);border:1px solid var(--line2);border-radius:16px 5px 16px 16px}
.ms.bot .bb{background:linear-gradient(var(--ion-bg),var(--ion-bg)),var(--s2);border:1px solid color-mix(in oklab,var(--ion) 34%,var(--line));border-radius:16px 5px 16px 16px}
.ia{font:650 10.5px/1 var(--font);letter-spacing:.02em;color:var(--ion-tx);border:1px solid color-mix(in oklab,var(--ion) 45%,transparent);border-radius:999px;padding:2px 6px}
.ms.pend .bb{border-style:dashed;background:transparent}
.ms.fallo .bb{border-style:dashed;background:transparent;color:var(--tx2)}
.ms.fallo .est{color:var(--tx);display:inline-flex;align-items:center;gap:4px}
.dia-sep{align-self:center;font:500 12px var(--font);color:var(--tx3);padding:6px 0 2px}
.ext-nota{align-self:center;display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--tx3);border:1px dashed var(--line2);border-radius:999px;padding:4px 12px;text-align:center;max-width:100%}
.asig-bar{display:flex;align-items:center;gap:10px;margin:0 22px 0 28px;padding:9px 10px 9px 12px;border-radius:14px;background:var(--s1);border:1px solid var(--line);font-size:13px;color:var(--tx2);flex:none}
.asig-bar>span{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.asig-bar>span>em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.asig-bar b{color:var(--tx);font-weight:600}
.asig-bar.sig{background:var(--sig-bg);border-color:var(--sig-line);color:var(--sig-tx)}
.asig-bar.sig b{color:var(--sig-tx)}
.modos{display:flex;flex-direction:column;gap:6px}
.modos label{display:grid;grid-template-columns:16px minmax(0,1fr);gap:2px 10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line2);cursor:pointer;background:var(--s2);align-items:start}
.modos label:hover{border-color:var(--tx3)}
.modos label:has(input:checked){border-color:var(--tx);box-shadow:inset 0 0 0 1px var(--tx)}
.modos label:has(input:disabled){opacity:.55;cursor:not-allowed}
.modos input{margin-top:2px}
.modos b{font-weight:600;font-size:13.5px}
.modos small{grid-column:2;font-size:12.5px;color:var(--tx3);line-height:1.4}
.cfg{display:flex;flex-direction:column;gap:14px}
.box>.cfg{margin-top:10px}
.cfg .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.cfg-n{font-size:12.5px;color:var(--tx2);display:flex;flex-direction:column;gap:4px}

/* compartido desde otra app del celular */
.cp-prev{border-radius:16px;border:1px solid var(--line);background:var(--s1);overflow:hidden}
.cp-media{display:block;width:100%;max-height:min(440px,52vh);object-fit:contain;background:#000}
img.cp-media{background:var(--s3)}
audio.cp-media{background:none;max-height:none;padding:12px}
.cp-info{display:flex;align-items:center;gap:12px;padding:12px 14px;min-width:0}
.cp-info>span:not(.gl){flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.cp-info b{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp-info small{color:var(--tx3);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp-info a.lnk{word-break:break-all}
.cp-txt{padding:12px 14px;border-top:1px solid var(--line);white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.5;max-height:260px;overflow:auto}
.cp-form{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.sug{display:flex;gap:6px;flex-wrap:wrap}
.sug .chip{height:auto;min-height:28px;white-space:normal;text-align:left;padding:4px 11px;line-height:1.35}

/* toasts */
.toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:100;pointer-events:none;width:min(460px,calc(100% - 24px))}
.toast{pointer-events:auto;background:var(--pri);color:var(--on-pri);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:500;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center}
.toast.err{background:var(--s3);color:var(--tx);box-shadow:var(--shadow),inset 0 0 0 1px var(--tx3)}
.toast.sig{background:var(--sig);color:var(--on-sig)}
.toast>span{flex:1;min-width:0}
.toast a,.toast button{flex:none;font-weight:650;text-decoration:underline;text-underline-offset:3px;color:inherit;padding:4px 2px}
.carga{display:grid;place-items:center;flex:1;color:var(--tx3);font-size:13px;padding:40px}

/* ---------- llamada de voz: robot 3D al centro, transcripción y controles grandes ---------- */
.vista.v-llam{display:block;overflow:hidden}
.vista.v-code{display:flex;overflow:hidden;padding:0}.vista.v-code>.code-pag{flex:1}
.llam{--acc:var(--ion);--vio:#9B7BFF;position:relative;height:100%;min-height:0;display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(52% 40% at 50% 46%,color-mix(in oklab,var(--acc) 13%,transparent),transparent 72%),radial-gradient(70% 50% at 20% 85%,color-mix(in oklab,var(--vio) 9%,transparent),transparent 70%),radial-gradient(900px 480px at 50% -10%,var(--glow),transparent 70%),var(--bg)}
.ll-deco{position:absolute;left:50%;top:46%;width:min(150vw,980px);aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none}
.ll-deco circle{fill:none;stroke:var(--line);vector-effect:non-scaling-stroke}
.ll-deco .r2{stroke-dasharray:2 6}
.ll-top{position:relative;z-index:1;padding:max(14px,env(safe-area-inset-top)) 16px 4px;text-align:center;flex:none}
.ll-top h1{font:650 21px/1.15 var(--font);letter-spacing:-.025em}
.ll-top .pto{color:var(--tx2);font-size:13.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ll-top .pto .i{vertical-align:-2px;margin-right:5px;color:var(--tx3)}
.ll-meta{display:flex;justify-content:center;align-items:center;gap:9px;margin-top:9px;flex-wrap:wrap}
.ll-dur{font:600 13px/1 var(--mono);color:var(--tx2);font-variant-numeric:tabular-nums}
.ll-est{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 12px;border-radius:999px;background:var(--s2);box-shadow:inset 0 0 0 1px var(--line2);font-size:13px;font-weight:600;color:var(--tx);max-width:100%}
.ll-est>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ll-est i{width:8px;height:8px;border-radius:50%;background:var(--tx3);flex:none}
.ll-est[data-f=escuchando] i,.ll-est[data-f=escribir] i{background:var(--acc);animation:ll-late 1.4s ease-in-out infinite}
.ll-est[data-f=hablando] i{background:var(--acc)}
.ll-est:is([data-f=pensando],[data-f=enviando],[data-f=cola]) i{background:var(--vio);animation:ll-late .9s ease-in-out infinite}
.ll-est:is([data-f=aprobacion],[data-f=error]){background:var(--sig-bg);color:var(--sig-tx);box-shadow:inset 0 0 0 1px var(--sig-line)}
.ll-est:is([data-f=aprobacion],[data-f=error]) i{background:var(--sig)}
@keyframes ll-late{50%{transform:scale(.6);opacity:.55}}
.ll-sub{min-height:18px;margin-top:6px;font-size:12.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ll-esc{position:relative;flex:1 1 auto;min-height:150px;display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:pan-y}
.ll-esc canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ll-esc:focus-visible{outline:2px solid var(--acc);outline-offset:-8px;border-radius:28px}
.ll-esc .ll-cargando{color:var(--tx3);font-size:13px}
.ll-top #ll-reint{margin-top:8px}
.ll-baja{position:relative;z-index:1;flex:none;display:flex;flex-direction:column;gap:10px;padding:0 16px;max-width:680px;width:100%;margin:0 auto}
.ll-ap .appr{gap:8px}
.ll-ap .ap-det{max-height:84px}
.ll-tr{max-height:min(27vh,220px);overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:7px;padding:4px 0;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 18px);mask-image:linear-gradient(transparent,#000 18px)}
.ll-tr::-webkit-scrollbar{display:none}
.ll-tr:empty{display:none}
.ll-l{font-size:15px;line-height:1.45;color:var(--tx);min-width:0;overflow-wrap:anywhere}
.ll-l>b{display:block;font-size:12px;font-weight:600;color:var(--tx3);margin-bottom:1px}
.ll-l.vos{align-self:flex-end;max-width:88%;text-align:right}
.ll-l.vos>span{display:inline-block;text-align:left;background:var(--s3);border:1px solid var(--line2);padding:7px 12px;border-radius:15px 15px 5px 15px}
.ll-l.bot{max-width:94%}
.ll-l.bot .o{color:var(--tx2);transition:color .2s}
.ll-l.bot .o.on,.ll-l.bot .o.dicha{color:var(--tx)}
.ll-l.bot .o.on{text-decoration:underline;text-decoration-color:color-mix(in oklab,var(--acc) 70%,transparent);text-decoration-thickness:2px;text-underline-offset:4px}
.ll-l.sis{font-size:13px;color:var(--tx2);display:flex;gap:7px;align-items:flex-start}
.ll-l.sis .i{margin-top:2px;color:var(--sig-tx)}
.ll-parcial{min-height:21px;font-size:15px;font-style:italic;color:var(--tx3);text-align:right;overflow-wrap:anywhere}
.ll-parcial:empty{min-height:0}
.ll-aviso{border-radius:14px;background:var(--s2);border:1px solid var(--line2);padding:12px 14px;font-size:13.5px;color:var(--tx2);display:flex;flex-direction:column;gap:10px}
.ll-aviso b{color:var(--tx)}
.ll-aviso .btn{align-self:flex-start;height:40px;border-radius:12px}
.ll-escr{display:flex;gap:8px}
.ll-escr .inp{height:44px;font-size:16px;border-radius:14px}
.ll-escr .btn{height:44px;border-radius:14px;padding:0 16px}
.ll-ctl{position:relative;z-index:1;flex:none;display:flex;justify-content:center;gap:clamp(10px,5vw,30px);padding:14px 12px max(16px,env(safe-area-inset-bottom))}
.ll-b{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:62px;font-size:12px;font-weight:500;color:var(--tx2)}
.ll-b .c{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:var(--s2);box-shadow:inset 0 0 0 1px var(--line2),0 6px 18px rgba(0,0,0,.18);color:var(--tx);transition:background .15s,transform .1s}
.ll-b .c .i{width:25px;height:25px;stroke-width:1.7}
.ll-b:hover .c{background:var(--s3)}
.ll-b:active .c{transform:scale(.95)}
.ll-b[aria-pressed=true] .c{background:var(--tx);color:var(--bg);box-shadow:none}
.ll-b[aria-pressed=true]{color:var(--tx)}
.ll-b.colgar .c{background:var(--colgar);color:#fff;box-shadow:0 8px 22px color-mix(in oklab,var(--colgar) 35%,transparent)}
.ll-b.colgar:hover .c{filter:brightness(1.07)}
.ll-b:focus-visible{outline:none}
.ll-b:focus-visible .c{outline:2px solid var(--ion);outline-offset:3px}
:root{--colgar:#D92D3F}
/* indicador 2D (sin WebGL o con el robot apagado): la misma cara, en CSS */
.rb2d{--a:0;position:relative;width:min(58vw,250px,62%);aspect-ratio:1;display:grid;place-items:center;pointer-events:none}
.rb2d .o1,.rb2d .o2{position:absolute;inset:0;border-radius:50%;border:1.5px solid color-mix(in oklab,var(--acc) 38%,transparent);transform:scale(calc(.9 + var(--a)*.16))}
.rb2d .o2{inset:-14%;border-style:dashed;border-color:var(--line2);transform:none}
.rb2d .sat{position:absolute;inset:-14%;border-radius:50%;animation:orbit 6s linear infinite}
.rb2d .sat::before{content:"";position:absolute;top:-5px;left:calc(50% - 5px);width:10px;height:10px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc)}
.rb2d .cab{width:66%;aspect-ratio:1.18;border-radius:44% 44% 40% 40%;background:radial-gradient(120% 90% at 30% 20%,#fff,#E3E8F0 60%,#C3CAD6);box-shadow:inset -6px -10px 18px rgba(30,40,70,.18),0 16px 34px rgba(0,0,0,.28);display:grid;place-items:center;transition:transform .5s cubic-bezier(.3,.7,.3,1)}
.rb2d .vis{width:80%;height:58%;border-radius:38% 38% 34% 34%;background:radial-gradient(100% 120% at 30% 15%,#2A3142,#05070C 55%);display:flex;align-items:center;justify-content:center;gap:20%}
.rb2d .vis i{width:13%;height:calc(46% + var(--a)*10%);border-radius:999px;background:var(--acc);box-shadow:0 0 14px var(--acc);transition:height .25s;animation:rb-parpadeo 4.6s infinite}
.rb2d[data-e=escuchando] .cab{transform:rotate(-7deg) translateY(2px)}
.rb2d[data-e=pensando] .vis i{height:16%;animation:rb-procesa 1.1s ease-in-out infinite alternate}
.rb2d[data-e=pensando] .vis i+i{animation-delay:.55s}
.rb2d[data-e=entusiasmado] .cab{animation:rb-salta .7s ease-in-out infinite}
.rb2d[data-e=entusiasmado] .vis i{height:20%;border-radius:999px 999px 0 0}
.rb2d.g .cab{animation:rb-gesto .6s ease-out}
.rb2d:not([data-e=pensando]) .sat{animation-duration:14s}
@keyframes rb-parpadeo{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes rb-procesa{from{opacity:.45}to{opacity:1}}
@keyframes rb-salta{50%{transform:translateY(-6px)}}
@keyframes rb-gesto{40%{transform:translateY(-4px) rotate(3deg)}}
/* perfil: sección Llamadas */
.llm-cfg{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:14px;margin-top:2px}
.llm-cfg h3{font:600 14px/1.2 var(--font);display:flex;align-items:center;gap:7px}
.llm-cfg h3 .i{color:var(--tx2)}
.av-col{display:flex;align-items:center;gap:10px}
.av-col input[type=color]{width:44px;height:36px;padding:2px;border-radius:10px;border:1px solid var(--line2);background:var(--s2);cursor:pointer}
.av-col code{color:var(--tx2)}
.av-col .sw-c{display:flex;gap:6px}
.av-col .sw-c button{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
input.rng{width:100%;accent-color:var(--ion);height:28px;margin:0}
.fld output{font-variant-numeric:tabular-nums;color:var(--tx)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--colgar:#C8283A}}
:root[data-theme="light"]{--colgar:#C8283A}

  .stp .ib{width:36px;height:36px}
  .stp input{width:32px}
  .pe{padding:10px 8px 10px 10px;gap:2px 10px}
  /* mensajes */
  .asig-bar{margin:0 10px;padding:8px 8px 8px 12px}
  .mthread{padding:12px 10px 8px}
  .ms{max-width:88%}
  .mrow{padding:10px 8px;grid-template-columns:42px minmax(0,1fr) auto}
  .mrow>.mav{width:42px;height:42px}
  .mt1 b{font-size:15px}
  .mt2{font-size:13px}
  .msj-est,.derivs{margin-left:12px;margin-right:12px}
  .side-h.msj-h{padding:14px 10px 10px 16px}
  .side-h.msj-h h1{position:static;width:auto;height:auto;overflow:visible;clip:auto;white-space:normal;font-size:20px;letter-spacing:-.02em}
  /* cabecera del compañero */
  .bh{padding:10px 10px 8px 4px;gap:6px}
  .bh-deco{display:none}
  .bh-id{gap:10px}
  .bh-id>.av{--sz:34px!important}
  .bh-name h2{font-size:16.5px}
  .bh-name span{display:none}
  .bh-meta{margin-top:3px}
  .bh-meta .pill{min-width:0}
  .bh-meta .rep,.bh-meta .dotsep,.bh-meta .dura{display:none}
  .bh-act{display:none}
  .bh-m{display:flex;gap:2px;align-items:center;flex:none}
  .bh-m .btn{height:34px;padding:0 12px;border-radius:999px}
  .bh-m .ib{width:38px;height:38px;border-radius:50%}
  /* pestañas: entran las cinco, sin íconos */
  .tabs{padding:0 4px;gap:0}
  .tabs a{flex:1 1 auto;justify-content:center;height:42px;padding:0 6px;gap:5px;font-size:13px}
  .tabs a .i{display:none}
  .tabs a.on::after{left:8px;right:8px}
  .tabs .t-l{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .tabs .t-c{display:inline}
  .tabs .sp,.tabs .tab-note{display:none}
  /* hilo */
  .thread{padding:14px 12px 8px}
  .mu{max-width:88%;flex-direction:column-reverse;align-items:flex-end;gap:4px}
  .mu .meta{padding:0 4px 0 0;font-size:11.5px}
  .turn{grid-template-columns:minmax(0,1fr)}
  .turn>.av{display:none}
  .turn-h .m-av{display:inline-grid}
  .vivo-l{padding-left:0}
  .tl{flex-wrap:wrap;row-gap:2px}
  .tl::before{top:6px}
  .md pre.code{white-space:pre-wrap;word-break:break-word}
  .appr{padding:12px}
  .appr-a .btn{flex:1 1 auto;height:42px}
  .siempre{flex:1 1 100%}
  .siempre .btn{flex:1}
  .siempre select{height:42px}
  .appr-a .more{margin-left:0;width:100%;justify-content:center;margin-top:2px}
  .md table{font-size:12.5px}
  .md th,.md td{padding-left:7px;padding-right:7px}
  /* compositor: sin Detener (está en la cabecera) y Enviar redondo */
  .cmp{padding:6px 10px calc(10px + env(safe-area-inset-bottom))}
  .cmp #cmp-det{display:none}
  .cmp-bar{border-radius:24px;padding:5px 5px 5px 16px;align-items:center}
  .cmp textarea{font-size:16px;line-height:22px;height:36px;padding:7px 0}
  .cmp-bar .env{width:38px;height:38px;padding:0;border-radius:50%;flex:none}
  .cmp-bar .env .t{display:none}
  .cmp-bar .env .i{width:18px;height:18px}
  .cmp .hint{display:none}
  .cmp .hint.w{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:10px;margin-top:6px}
  /* páginas */
  .pag-in{padding:16px 16px 28px}
  .pag-h .tt{min-width:0}
  .pag-h h1{font-size:21px;margin:2px 0 3px}
  .pag-h p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pag-h .acts{width:100%}
  .pag-h .acts .btn{flex:1}
  .bar .field{width:100%}
  .tab-pag{padding:14px 14px 28px}
  .g2{grid-template-columns:minmax(0,1fr)}
  .tpl{grid-template-columns:minmax(0,1fr)}
  .cards{grid-template-columns:minmax(0,1fr)}
  /* equipo: los números en una fila, la órbita más chica y la tabla como lista */
  .stats{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:14px}
  .stat{flex-direction:column;align-items:flex-start;gap:4px;padding:9px 9px 10px;border-radius:12px}
  .stat .v{font-size:20px;gap:6px}
  .stat .v .d{width:7px;height:7px}
  .stat .v .i{width:15px;height:15px}
  .stat .k{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .stat .k small,.stat .k .dk{display:none}
  .bigseg{display:none}
  .sys .orbit{max-width:168px}
  .tblw{overflow:visible}
  .tbl,.tbl tbody,.tbl td{display:block;min-width:0}
  .tbl colgroup,.tbl thead,.tbl .c-opt{display:none}
  .tbl tr{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
  .tbl td{border:0;padding:4px 0;overflow:visible}
  .tbl td:first-child{flex:1;min-width:0}
  .tbl tr:hover td{background:none}
  .mt-top{padding:14px 16px 12px;gap:10px}
  .mt-top h1{font-size:18px}
  .mt-top .acts{width:100%}
  .mt-top .acts .btn{flex:1;padding:0 8px}
  .mt{grid-template-columns:minmax(0,1fr)}
  .mt>.av{display:none}
  .mt.you{grid-template-columns:minmax(0,1fr)}
  .mt-b{padding:10px 12px 11px}
  .mcmp{position:sticky;bottom:0;padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
  /* aprobaciones: lo más importante en el celular, sin tarjeta dentro de tarjeta y con botones grandes */
  .inbox.pagina{border:0;background:none;border-radius:0}
  .inbox.pagina .ib-h{padding:4px 2px 12px}
  .inbox.pagina .ib-sel{padding:10px 4px;border-top:0}
  .inbox.pagina .ib-list{padding:2px 0 12px}
  .inbox.pagina .ib-list h3{margin:14px 4px 8px}
  .inbox.pagina .ib-bar{margin:0 -16px;border-radius:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom))}
  .ib-bar-a>.btn.sig{flex:1 1 100%}
  .ib-bar-a>.btn.ghost,.ib-bar-a .siempre{flex:1}
  .ai,.ai.solo{grid-template-columns:minmax(0,1fr);padding:12px;border-radius:14px}
  .ai>.cb,.ai>.av{display:none}
  .ai-3{flex-direction:column;align-items:stretch}
  .ai-3 code,.ai-3 details{flex:1 1 auto}
  .ai-act{width:100%;margin-top:4px}
  .ai-act .btn{height:42px;font-size:14px;border-radius:12px}
  .ai-act .btn.sig{flex:1}
  .ai-act .btn.ghost{padding:0 18px;box-shadow:inset 0 0 0 1px var(--line2)}
  .reu{grid-template-columns:minmax(0,1fr) auto}
  .reu>.stack{display:none}
  /* diálogos: hojas que suben desde abajo */
  dialog.dlg,dialog.dlg.chico{margin:auto 0 0;width:100%;max-width:100%;max-height:92dvh;border-radius:22px 22px 0 0;border-bottom:0;border-left:0;border-right:0;padding-bottom:env(safe-area-inset-bottom)}
  dialog.dlg[open]{animation:sube .24s cubic-bezier(.2,.8,.2,1)}
  dialog.dlg.alto{height:92dvh}
  .dlg-f{max-height:calc(92dvh - env(safe-area-inset-bottom));padding:8px 16px 18px}
  .dlg-f::before{content:"";flex:none;align-self:center;width:36px;height:4px;border-radius:2px;background:var(--line2);margin-bottom:4px}
  .dlg-f .acts{bottom:-18px}
  .dlg-f .acts .btn{flex:1;height:44px}
  .toasts{bottom:76px}
  body.en-chat .toasts{bottom:96px}
}
@keyframes sube{from{transform:translateY(36px);opacity:.5}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

<script>
"use strict";
(() => {
// ================================================================ utilidades
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ESC[c]);
class Crudo { constructor(s) { this.s = s; } toString() { return this.s; } }
const crudo = (s) => new Crudo(String(s));
const val = (v) => (v == null || v === false || v === true ? "" : v instanceof Crudo ? v.s : Array.isArray(v) ? v.map(val).join("") : esc(v));
const html = (partes, ...vals) => { let o = partes[0]; for (let i = 0; i < vals.length; i++) o += val(vals[i]) + partes[i + 1]; return new Crudo(o); };
const si = (cond, attr) => (cond ? crudo(attr) : "");
const ico = (n, c = "") => crudo(`<svg class="i ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`);
// Glifo de puesto (auriculares, balanza…): solo si está en el sprite; si no, nada (el avatar muestra la inicial).
const hayGlifoCache = new Map();
const hayGlifo = (n) => { if (!n || !/^[a-z0-9-]{1,30}$/.test(n)) return false; if (!hayGlifoCache.has(n)) hayGlifoCache.set(n, !!document.getElementById(`g-${n}`)); return hayGlifoCache.get(n); };
const glifo = (n, c = "") => (hayGlifo(n) ? crudo(`<svg class="i g ${c}" aria-hidden="true"><use href="#g-${n}"/></svg>`) : "");
const norm = (s) => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const plural = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`;
const guardarLocal = (k, v) => { try { localStorage.setItem(k, typeof v === "string" ? v : JSON.stringify(v)); } catch {} };
const leerLocal = (k, def = null) => { try { const v = localStorage.getItem(k); return v == null ? def : v; } catch { return def; } };

// Pinta HTML en un contenedor sin perder el foco (por data-k) ni la posición del cursor.
function pintar(el, contenido) {
  if (!el) return;
  const act = document.activeElement;
  let k = null, s0 = null, s1 = null;
  if (act && act !== el && el.contains(act)) {
    k = act.dataset?.k || null;
    try { s0 = act.selectionStart; s1 = act.selectionEnd; } catch {}
  }
  el.innerHTML = val(contenido);
  if (k) {
    const n = el.querySelector(`[data-k="${CSS.escape(k)}"]`);
    if (n) { n.focus({ preventScroll: true }); if (s0 != null) try { n.setSelectionRange(s0, s1); } catch {} }
  }
}

class ErrorApi extends Error { constructor(status, msg) { super(msg); this.status = status; } }
async function api(metodo, ruta, cuerpo) {
  const op = { method: metodo, headers: {} };
  // El servidor exige JSON en todo lo que no sea GET (protección contra otros sitios).
  if (metodo !== "GET") { op.headers["Content-Type"] = "application/json"; op.body = JSON.stringify(cuerpo ?? {}); }
  let r;
  try { r = await fetch(ruta, op); } catch { throw new ErrorApi(0, "No hay conexión con Gravity. Revisá que siga corriendo."); }
  if (r.status === 401 && !S.local) { location.reload(); throw new ErrorApi(401, "Iniciá sesión."); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new ErrorApi(r.status, d.error || `Error ${r.status}`);
  return d;
}

function toast(texto, tipo = "", enlace = null) {
  const t = document.createElement("div");
  t.className = `toast ${tipo}`;
  const sp = document.createElement("span");
  sp.textContent = texto;
  t.append(sp);
  if (enlace) { const a = document.createElement("a"); a.href = enlace.href; a.textContent = enlace.texto; a.addEventListener("click", () => t.remove()); t.append(a); }
  // Como mucho tres a la vez: el más viejo se va (en el celular taparían la pantalla).
  const cont = $("#toasts");
  while (cont.children.length >= 3) cont.firstElementChild.remove();
  cont.append(t);
  setTimeout(() => t.remove(), tipo === "err" ? 6500 : tipo === "sig" ? 9000 : 3800);
}
const fallo = (err) => { console.warn(err); toast(err?.message || "Algo falló.", "err"); };
const intentar = (fn) => async (...a) => { try { return await fn(...a); } catch (err) { fallo(err); } };
async function conCarga(boton, fn) {
  if (boton) { boton.setAttribute("aria-busy", "true"); boton.disabled = true; }
  try { return await fn(); } catch (err) { fallo(err); return undefined; } finally { if (boton && boton.isConnected) { boton.removeAttribute("aria-busy"); boton.disabled = false; } }
}

// ---- fechas y números
const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const DIAS = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
const fmtH = new Intl.DateTimeFormat("es-AR", { hour: "2-digit", minute: "2-digit", hour12: false });
function fecha(s) {
  if (!s) return null;
  if (s instanceof Date) return s;
  const m = /^(\d{4})-(\d\d)-(\d\d) (\d\d):(\d\d)$/.exec(s);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]);
  const d = new Date(s);
  return isNaN(d) ? null : d;
}
const mismoDia = (a, b) => a.toDateString() === b.toDateString();
const esHoy = (s) => { const d = fecha(s); return !!d && mismoDia(d, new Date()); };
const hora = (s) => { const d = fecha(s); return d ? fmtH.format(d) : ""; };
function diaHora(s) {
  const d = fecha(s);
  if (!d) return "";
  if (mismoDia(d, new Date())) return `hoy ${fmtH.format(d)}`;
  if (mismoDia(d, new Date(Date.now() - 864e5))) return `ayer ${fmtH.format(d)}`;
  if (mismoDia(d, new Date(Date.now() + 864e5))) return `mañana ${fmtH.format(d)}`;
  return `${d.getDate()} ${MESES[d.getMonth()]} ${fmtH.format(d)}`;
}
function cuanto(s) {
  const d = fecha(s);
  if (!d) return "";
  const min = Math.max(0, Math.round((Date.now() - d) / 60000));
  if (min < 1) return "ahora";
  if (min < 60) return `${min} min`;
  const h = Math.floor(min / 60);
  if (h < 24) return `${h} h`;
  return `${Math.floor(h / 24)} d`;
}
const hace = (s) => { const c = cuanto(s); return !c ? "" : c === "ahora" ? "recién" : `hace ${c}`; };
function falta(s) {
  const d = fecha(s);
  if (!d) return "";
  const min = Math.round((d - Date.now()) / 60000);
  if (min <= 0) return "ya venció";
  if (min < 60) return `en ${min} min`;
  if (min < 24 * 60) return `en ${Math.floor(min / 60)} h ${min % 60 ? `${min % 60} min` : ""}`.trim();
  return diaHora(d);
}
function reloj(s) {
  const d = fecha(s);
  if (!d) return "";
  const t = Math.max(0, Math.floor((Date.now() - d) / 1000));
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), sg = t % 60;
  return `${h ? `${h}:` : ""}${h ? String(m).padStart(2, "0") : m}:${String(sg).padStart(2, "0")}`;
}
const usd = (n) => `US$${(Number(n) || 0).toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: n > 0 && n < 0.1 ? 3 : 2 })}`;
const tamano = (n) => (n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toLocaleString("es-AR", { maximumFractionDigits: 1 })} KB` : `${(n / 1048576).toLocaleString("es-AR", { maximumFractionDigits: 1 })} MB`);

// ================================================================ estado
const S = {
  cargado: false,
  bots: [], habilidades: [], reglas: [], aprobaciones: [], plantillas: [], plantillasEquipo: [], nombres: [],
  categorias: [], iconos: [], limites: { maxBots: 50, maxEquipo: 30 },
  config: {}, ajustes: {}, gasto: {}, cupo: {}, tareas: [], reuniones: [], local: true,
  ruta: { vista: "chats", id: null, sub: null },
  botId: null, pestana: "chat",
  items: {}, stream: {}, corte: {}, cola: {}, borrador: {}, sinLeer: {}, desde: {},
  pegado: true, abiertos: new Set(), alcances: {},
  filtro: "todos", busqueda: "", orden: leerLocal("gravity-orden", "estado"),
  plegados: null,
  sel: new Set(), alcanceLote: "bot",
  eqBusqueda: "", eqFiltro: "todos", eqOrden: { col: "estado", dir: 1 }, eqSel: null,
  reunion: null, programadas: [],
  compu: null, compuSel: null, compuTexto: null, compuFiltro: "", compuAbiertas: new Set(),
  rutinas: null, editRutina: null,
  memoria: null, memSucias: new Set(),
  conexiones: undefined,
  // mensajes: estado de la escucha, lista de conversaciones, la abierta y lo compartido desde el celular
  msjEstado: null, chats: null, chat: null, chatId: null, msjPegado: true, msjBorrador: {},
  compartidos: null, compartido: null,
};
const TABS = [["chat", "Chat", "chat"], ["computadora", "Computadora", "computer"], ["rutinas", "Rutinas", "clock"], ["memoria", "Memoria", "memory"], ["perfil", "Perfil", "user"]];
const VISTAS = ["chats", "equipo", "mensajes", "reuniones", "aprobaciones", "computadora", "conexiones", "ajustes", "compartido", "llamada", "proyectos", "operaciones", "arquitecto", "buscar", "laboratorio", "mapa", "studio", "automatizaciones", "universo", "code", "datos", "canales", "investigacion", "midia", "creativo", "cloud", "conocimiento", "vision", "audio", "navegador", "labs"];
const HUES = ["jade", "iris", "lilac", "steel", "orchid", "sage"];
const ESF = { low: "Económico", medium: "Normal", high: "Cuidadoso", xhigh: "Muy cuidadoso", max: "Máximo" };

// ---- organigrama
let porId = new Map(), hijos = new Map(), hue = new Map(), tonoK = new Map();
function indexar() {
  porId = new Map(S.bots.map((b) => [b.id, b]));
  hijos = new Map();
  for (const b of S.bots) if (b.reportaA && porId.has(b.reportaA)) { if (!hijos.has(b.reportaA)) hijos.set(b.reportaA, []); hijos.get(b.reportaA).push(b); }
  hue = new Map();
  let i = 0;
  const mgrs = S.bots.filter((b) => b.cargo === "manager").sort((a, b) => String(a.creado).localeCompare(String(b.creado)));
  for (const m of mgrs) hue.set(m.id, esDirector(m) ? "ink" : HUES[i++ % HUES.length]);
  for (const b of S.bots) {
    if (b.cargo === "manager") continue;
    const j = b.reportaA && porId.get(b.reportaA);
    if (j) hue.set(b.id, hue.get(j.id));
    else { let h = 0; for (const c of b.id) h = (h * 31 + c.charCodeAt(0)) >>> 0; hue.set(b.id, HUES[h % HUES.length]); }
  }
  // Dentro de un mismo equipo, tonos que se alternan: dos vecinos nunca son el mismo planeta.
  tonoK = new Map();
  const grupos = new Map();
  for (const b of [...S.bots].sort((x, y) => String(x.creado).localeCompare(String(y.creado)))) {
    const g = b.reportaA && porId.has(b.reportaA) ? b.reportaA : "";
    if (!grupos.has(g)) grupos.set(g, 0);
    tonoK.set(b.id, (grupos.get(g) + (g ? 1 : 0)) % 4);
    grupos.set(g, grupos.get(g) + 1);
  }
}
const bot = (id) => (id ? porId.get(id) : undefined);
const directos = (id) => hijos.get(id) ?? [];
const esDirector = (b) => !!b && b.cargo === "manager" && directos(b.id).some((x) => x.cargo === "manager");
const subarbol = (id) => directos(id).flatMap((b) => [b, ...subarbol(b.id)]);
const jefe = (b) => (b?.reportaA ? bot(b.reportaA) : undefined);
const aprobacionesDe = (id) => S.aprobaciones.filter((a) => a.botId === id);
function est(b) {
  if (!b) return "idle";
  if (b.estado === "esperando" || aprobacionesDe(b.id).length) return "wait";
  return b.estado === "trabajando" ? "work" : "idle";
}
const conteo = (xs) => ({ work: xs.filter((b) => est(b) === "work").length, wait: xs.filter((b) => est(b) === "wait").length, idle: xs.filter((b) => est(b) === "idle").length });
const ORD_EST = { wait: 0, work: 1, idle: 2 };
const porNombre = (a, b) => a.nombre.localeCompare(b.nombre, "es");
const ordenar = (xs, modo = S.orden) => [...xs].sort((a, b) => (b.favorito ? 1 : 0) - (a.favorito ? 1 : 0) || (modo === "estado" ? ORD_EST[est(a)] - ORD_EST[est(b)] : 0) || porNombre(a, b));
function equipoDe(b) {
  if (!b) return null;
  if (b.cargo === "manager" && directos(b.id).length) return b;
  return jefe(b) || (b.cargo === "manager" ? b : null);
}
const nombreEquipo = (m) => (m ? m.titulo : "Directo con vos");
// Panel de novedades (Ajustes): lo último que se sumó, para descubrir funciones.
const NOVEDADES = [
  ["Gravity Architect", "contá un objetivo y te propone el equipo, los permisos, las rutinas y el proyecto (Equipo > Architect)."],
  ["Centro de operaciones", "quién trabaja y en qué, qué espera, actividad reciente, rendimiento y auditoría."],
  ["Proyectos", "tareas con responsables, dependencias y revisión cruzada automática del coordinador."],
  ["Reuniones tipo Debate", "propuestas, críticas y votación con el conteo en el acta; se pueden pausar."],
  ["Llamadas con robot 3D", "con fotos (botón Foto), interrupción tocando al robot y resumen automático al cortar."],
  ["Compañeros a medida", "personalidad, modelo (Auto/Rápido/Potente, también desde el chat), tope de gasto, permisos, modo enseñanza, temporales y archivo."],
  ["Buscador", "compañeros, chats, proyectos, reuniones, memorias y archivos."],
  ["Automatizaciones y webhooks", "«si pasa X, que tal compañero haga Y» y direcciones para que otros servicios le encarguen trabajo."],
  ["Copia de seguridad", "exportar e importar todo en un .zip."],
];
const tipoReu = (t) => ({ standup: "Daily", discusion: "Discusión", debate: "Debate" })[t] || t;
const reunionesVivas = () => S.reuniones.filter((r) => r.estado === "en_curso" || r.estado === "cierre");
const tareaAbierta = (t) => ["pendiente", "en_curso", "esperando_equipo"].includes(t.estado);
function iniciales(n) {
  const p = String(n || "?").trim().split(/\s+/);
  if (p.length > 1) return (p[0][0] + p[1][0]).toUpperCase();
  return p[0].slice(0, 1).toUpperCase();
}
const botPorNombre = (n) => S.bots.find((b) => norm(b.nombre) === norm(n));

const hashId = (id) => { let h = 0; for (const c of String(id ?? "")) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
function av(b, sz = 24, o = {}) {
  if (!b) return html`<span class="av" data-s="idle" style="--h:var(--h-ink);--sz:${sz}px" aria-hidden="true">?<i></i></span>`;
  const s = o.s ?? est(b);
  // Chicos: una sola inicial (se lee mejor); grandes: dos.
  const ini = sz < 32 ? iniciales(b.nombre).slice(0, 1) : iniciales(b.nombre);
  const cls = ["av", b.cargo === "manager" && (esDirector(b) ? "dr" : "mg"), ini.length > 1 && "dos", o.cls].filter(Boolean).join(" ");
  return html`<span class="${cls}" data-s="${s}" style="--h:var(--h-${o.h || hue.get(b.id) || "ink"});--sz:${sz}px;--k:${tonoK.get(b.id) ?? hashId(b.id) % 4}" aria-hidden="true">${ini}<i></i></span>`;
}

// ---- órbita
function orbita(centro, miembros, w, o = {}) {
  const n = miembros.length;
  let anillos;
  if (n <= 12) anillos = [{ r: 38, k: n }];
  else { const k1 = Math.ceil(n * 0.58); anillos = [{ r: n > 22 ? 44 : 42, k: k1 }, { r: n > 22 ? 28 : 26, k: n - k1 }]; }
  const sz = o.sz ?? (n <= 12 ? 24 : n <= 22 ? 20 : 17);
  const pos = [];
  anillos.forEach((a, ai) => { for (let j = 0; j < a.k; j++) { const ang = -Math.PI / 2 + (j * 2 * Math.PI) / a.k + (ai ? Math.PI / a.k : 0); pos.push([50 + a.r * Math.cos(ang), 50 + a.r * Math.sin(ang)]); } });
  const anillo = anillos[0].r;
  const items = miembros.map((m, i) => {
    const [x, y] = pos[i];
    const est_ = m.vos ? avVos(sz) : av(m, sz, { cls: o.habla?.includes(m.id) ? "talk" : "" });
    return html`<span class="o-m ${o.resaltar === m.id ? "hl" : ""}" style="left:${x.toFixed(2)}%;top:${y.toFixed(2)}%" ${si(!m.vos && o.links, `data-a="ir-bot" data-id="${esc(m.id)}"`)} title="${m.vos ? "Vos" : `${m.nombre} · ${textoEstado(m)}`}">${est_}${o.badge ? o.badge(m) : ""}${o.etiquetas || o.resaltar === m.id ? html`<em>${m.vos ? "Vos" : m.nombre}</em>` : ""}</span>`;
  });
  return html`<div class="orbit ${o.fantasma ? "ghost" : ""}" style="--w:${w}px" role="img" aria-label="${o.label || ""}"><svg class="rings" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="49" class="r2"/><circle cx="50" cy="50" r="${anillo}" class="r1"/>${anillos[1] ? html`<circle cx="50" cy="50" r="${anillos[1].r}" class="r0"/>` : html`<circle cx="50" cy="50" r="19" class="r0"/>`}</svg><span class="o-c">${centro}</span>${items}</div>`;
}

// ================================================================ markdown seguro
// Se escapa todo primero y después solo se agregan etiquetas conocidas; los links solo pueden ser http(s).
function enLineaMd(s) {
  return s.split(/(`[^`]+`)/).map((p, i) => i % 2 ? `<code>${p.slice(1, -1)}</code>` : p
    .replace(/\*\*([^*\n]+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*\w])\*([^*\s][^*\n]*?)\*(?![\w*])/g, "$1<em>$2</em>")
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+[^\s<).,;:!?])/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>')).join("");
}
function tablaMd(filas) {
  const celdas = (f) => f.replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
  const esSep = (f) => /^\|?(\s*:?-{2,}:?\s*\|)*\s*:?-{2,}:?\s*\|?$/.test(f);
  let cab = null, cuerpo = filas;
  if (filas.length > 1 && esSep(filas[1])) { cab = celdas(filas[0]); cuerpo = filas.slice(2); }
  else cuerpo = filas.filter((f) => !esSep(f));
  const fs = cuerpo.map(celdas);
  const cols = Math.max(cab?.length ?? 0, ...fs.map((f) => f.length));
  const num = (c) => /^[-+]?(US\$|\$|€)?\s?[\d.,]+\s?(%|u\.?|usd|ars|kb|mb)?$/i.test(c);
  const esNum = Array.from({ length: cols }, (_, i) => fs.length > 0 && fs.every((f) => !f[i] || num(f[i])) && fs.some((f) => f[i]));
  const td = (t, c, i) => `<${t}${esNum[i] ? ' class="num"' : ""}>${enLineaMd(c ?? "")}</${t}>`;
  return `<div class="tw"><table>${cab ? `<thead><tr>${cab.map((c, i) => td("th", c, i)).join("")}</tr></thead>` : ""}<tbody>${fs.map((f) => `<tr>${Array.from({ length: cols }, (_, i) => td("td", f[i], i)).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function bloquesMd(texto, out) {
  const lineas = esc(texto).split("\n");
  let par = [], lista = null, tabla = null, cita = null;
  const cerrar = () => {
    if (par.length) out.push(`<p>${par.map(enLineaMd).join("<br>")}</p>`);
    if (lista) out.push(`<${lista.t}>${lista.items.map((x) => `<li>${enLineaMd(x)}</li>`).join("")}</${lista.t}>`);
    if (tabla) out.push(tablaMd(tabla));
    if (cita) out.push(`<blockquote>${cita.map(enLineaMd).join("<br>")}</blockquote>`);
    par = []; lista = null; tabla = null; cita = null;
  };
  for (const l of lineas) {
    let m;
    if (!l.trim()) { cerrar(); continue; }
    if ((m = /^\s*#{1,6}\s+(.*)/.exec(l))) { cerrar(); out.push(`<h4>${enLineaMd(m[1])}</h4>`); continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { cerrar(); out.push("<hr>"); continue; }
    if (/^\s*\|/.test(l)) { if (!tabla) cerrar(); (tabla ??= []).push(l.trim()); continue; }
    if ((m = /^\s*&gt;\s?(.*)/.exec(l))) { if (!cita) cerrar(); (cita ??= []).push(m[1]); continue; }
    const it = /^\s*[-*•]\s+(.*)/.exec(l) || /^\s*\d+[.)]\s+(.*)/.exec(l);
    if (it) {
      const t = /^\s*\d/.test(l) ? "ol" : "ul";
      if (!lista || lista.t !== t) { cerrar(); lista = { t, items: [] }; }
      lista.items.push(it[1]);
      continue;
    }
    if (lista && /^\s{2,}\S/.test(l)) { lista.items[lista.items.length - 1] += ` ${l.trim()}`; continue; }
    if (lista || tabla || cita) cerrar();
    par.push(l);
  }
  cerrar();
}
function md(texto) {
  const out = [];
  const src = String(texto ?? "").replace(/\r\n?/g, "\n");
  const re = /```[^\n`]*\n([\s\S]*?)(?:```|$)/g;
  let ultimo = 0, m;
  while ((m = re.exec(src))) {
    bloquesMd(src.slice(ultimo, m.index), out);
    out.push(`<pre class="code"><code>${esc(m[1].replace(/\n$/, ""))}</code></pre>`);
    ultimo = re.lastIndex;
    if (m[0].length === 0) break;
  }
  bloquesMd(src.slice(ultimo), out);
  return crudo(out.join(""));
}

  }
  if (v === "aprobaciones") { vista.innerHTML = `<div class="pag"><div class="pag-in angosta"><div class="inbox pagina" id="bandeja" aria-label="Aprobaciones"></div></div></div>`; pintarBandejas(); return; }

// Logo de Gravity en 3D (bienvenida): órbita de tres cuartos, masa central y el satélite girando. Si no hay
// WebGL o se pidió reducir el movimiento, queda el logo plano.
function montarLogo3D() {
  const el = $("#logo3d");
  if (!el || el.dataset.listo || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  el.dataset.listo = "1";
  cargarThree().then((T) => {
    if (!el.isConnected) return;
    let renderer;
    try { renderer = new T.WebGLRenderer({ antialias: true, alpha: true }); } catch { return; }
    const lado = 56;
    renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
    renderer.setSize(lado, lado);
    const escena = new T.Scene();
    const camara = new T.PerspectiveCamera(35, 1, 0.1, 50);
    camara.position.set(0, 0, 6.2);
    escena.add(new T.AmbientLight(0xffffff, 0.7));
    const luz = new T.DirectionalLight(0xffffff, 1.6); luz.position.set(2, 3, 4); escena.add(luz);
    const blanco = new T.MeshStandardMaterial({ color: 0xe8ecf5, roughness: 0.35, metalness: 0.1 });
    const cian = new T.MeshStandardMaterial({ color: 0x6cd3f0, emissive: 0x6cd3f0, emissiveIntensity: 0.6, roughness: 0.3 });
    const grupo = new T.Group();
    const orbita = new T.Mesh(new T.TorusGeometry(1.25, 0.24, 20, 72, Math.PI * 1.5), blanco);
    orbita.rotation.z = Math.PI / 2;
    grupo.add(orbita);
    const barra = new T.Mesh(new T.CylinderGeometry(0.24, 0.24, 1.25, 16), blanco);
    barra.rotation.z = Math.PI / 2; barra.position.set(0.62, 0, 0);
    grupo.add(barra);
    grupo.add(new T.Mesh(new T.SphereGeometry(0.5, 32, 20), blanco));
    const sat = new T.Mesh(new T.SphereGeometry(0.34, 24, 16), cian);
    grupo.add(sat);
    escena.add(grupo);
    el.replaceChildren(renderer.domElement);
    const t0 = performance.now();
    const cuadro = (now) => {
      if (!el.isConnected) { renderer.dispose(); return; }
      const t = (now - t0) / 1000;
      grupo.rotation.y = Math.sin(t * 0.6) * 0.5;
      grupo.rotation.x = Math.sin(t * 0.4) * 0.15;
      sat.position.set(Math.cos(t * 1.4 + 0.8) * 1.6, Math.sin(t * 1.4 + 0.8) * 1.6, Math.sin(t * 0.9) * 0.4);
      renderer.render(escena, camara);
      if (!document.hidden) requestAnimationFrame(cuadro); else setTimeout(() => requestAnimationFrame(cuadro), 500);
    };
    requestAnimationFrame(cuadro);
  }).catch(() => {});
}

function htmlLista() {
  const bots = S.bots;
  // Sin nadie, la bienvenida de al lado (o la del celular) tiene los botones para empezar.
  if (!bots.length) return html`<div class="side-vacio"><p>Acá van a aparecer tus compañeros, agrupados por equipo.</p></div>`;
  const q = norm(S.busqueda.trim());
  if (q || S.filtro !== "todos") {
    const xs = ordenar(bots.filter((b) => (S.filtro === "todos" || est(b) === S.filtro) && (!q || norm(`${b.nombre} ${b.titulo} ${nombreEquipo(equipoDe(b))} ${jefe(b)?.nombre || ""}`).includes(q))));
    return html`<div class="lbl"><span class="micro">${plural(xs.length, "resultado", "resultados")}</span></div>${xs.length ? xs.map((b) => fila(b, true)) : html`<p class="side-vacio">Nadie coincide.</p>`}`;
  }
  if (S.plegados == null) {
    const guardados = leerLocal("gravity-plegados");
    if (guardados) { try { S.plegados = new Set(JSON.parse(guardados)); } catch { S.plegados = new Set(); } }
    else {
      const equipos = bots.filter((b) => b.cargo === "manager" && directos(b.id).length);
      const mio = equipoDe(bot(S.botId))?.id;
      S.plegados = new Set(equipos.length > 2 ? equipos.filter((m) => m.id !== mio).map((m) => m.id) : []);
    }
  }
  const dirs = bots.filter(esDirector).sort(porNombre);
  const leads = ordenar(bots.filter((b) => b.cargo === "manager" && !esDirector(b)), "nombre");
  const solos = ordenar(bots.filter((b) => b.cargo !== "manager" && !b.reportaA));
  return html`
    ${dirs.length ? html`<div class="lbl"><span class="micro">Dirección</span></div>${dirs.map(grupo)}` : ""}
    ${leads.length ? html`<div class="lbl"><span class="micro">Equipos</span><span class="tools"><button data-a="orden" data-k="orden" aria-label="Ordenar por ${S.orden === "estado" ? "nombre" : "estado"}">${ico("sort", "s")}${S.orden === "estado" ? "Estado" : "Nombre"}</button></span></div>${leads.map(grupo)}` : ""}
    ${solos.length ? html`<div class="lbl"><span class="micro">${leads.length || dirs.length ? "Directo con vos" : "Compañeros"}</span></div>${solos.map((b) => fila(b))}` : ""}`;
}

function estadoCorto(b) {

function autoAlto(ta) { ta.style.height = "auto"; ta.style.height = `${Math.min(ta.scrollHeight, ta.closest(".mcmp") ? 160 : 200)}px`; }
function pintarCompositor() {

}

const cargando = new Map();
async function cargarConv(id) {
  if (cargando.has(id)) { cargando.get(id).otra = true; return; }
  const ctl = { otra: false };
  cargando.set(id, ctl);
  try {
    do {
      ctl.otra = false;
      const corte = S.corte[id] || 0;
      const items = await api("GET", `/api/bots/${id}/conversacion`);
      S.items[id] = items;
      S.stream[id] = (S.stream[id] || "").slice(corte);
      S.corte[id] = Math.max(0, (S.corte[id] || 0) - corte);
      const b = bot(id);
      S.cola[id] = (S.cola[id] || []).slice(-(b?.enCola || 0) || S.cola[id]?.length);
      if (!b?.enCola) S.cola[id] = [];
      if (id === S.botId && S.pestana === "chat") { pintarHist(); pintarVivo(); }
    } while (ctl.otra);
  } catch (err) { if (id === S.botId) fallo(err); } finally { cargando.delete(id); }
  marcarLeido();
}
function marcarLeido() {
  const b = bot(S.botId);
  if (!b || S.ruta.vista !== "chats" || S.pestana !== "chat" || document.visibilityState !== "visible") return;
  const tenia = b.noLeido || S.sinLeer[b.id];
  S.sinLeer[b.id] = 0;
  if (b.noLeido) { b.noLeido = false; api("POST", `/api/bots/${b.id}/leido`, {}).catch(() => {}); }
  if (tenia) programar("side");
}
function bajar(forzar) { const t = $("#thread"); if (t && (forzar || S.pegado)) t.scrollTop = t.scrollHeight; }

function pintarHist() {
  const b = bot(S.botId), h = $("#hist");
  if (!b || !h) return;
  const items = S.items[b.id] || [];
  const pegado = S.pegado;
  pintar(h, items.length ? htmlItems(items, b) : html`<div class="chat-vacio">${av(b, 56, { s: "idle" })}<b>${b.nombre}</b><span class="sub">${b.titulo}</span><p>Escribile qué necesitás. Puede buscar en la web, trabajar en la computadora${b.cargo === "manager" ? ", repartir trabajo en su equipo" : ""} y programar rutinas.</p></div>`);
  if (pegado) bajar(true);
}
function htmlItems(items, b) {
  const out = [];
  let turno = null;
  const cerrar = () => { if (turno) { out.push(htmlTurno(b, turno)); turno = null; } };
  items.forEach((it, i) => {
    if (it.tipo === "usuario") { cerrar(); out.push(html`<div class="mu"><span class="meta">Vos${it.fecha ? ` · ${hora(it.fecha)}` : ""}</span><div class="bub">${it.texto}</div></div>`); }
    else if (it.tipo === "origen") { cerrar(); out.push(htmlOrigen(it, i)); }
    else if (it.tipo === "aviso") { cerrar(); out.push(html`<div class="aviso ${it.error ? "err" : ""}" role="${it.error ? "alert" : "note"}">${ico(it.error ? "warn" : "dot", "s")}<span>${it.texto}</span>${it.fecha ? html`<time>${hora(it.fecha)}</time>` : ""}</div>`); }
    else (turno ??= []).push([it, i]);
  });
  cerrar();

function htmlTurno(b, partes, extra = "") {
  const bloques = [];
  let trail = null;
  const volcar = () => { if (trail) { bloques.push(html`<div class="trail" aria-label="Lo que hizo">${trail}</div>`); trail = null; } };
  for (const [it, i] of partes) {
    if (it.tipo === "accion") { (trail ??= []).push(htmlAccion(it, i, b)); continue; }
    volcar();
    if (it.tipo === "nota") bloques.push(htmlNota(it, i));
    else if (it.tipo === "bot") bloques.push(html`<div class="md">${md(it.texto)}</div>`);
  }
  volcar();
  return html`<article class="turn">${av(b, 30, { s: "idle" })}<div class="turn-c"><div class="turn-h">${av(b, 22, { s: "idle", cls: "m-av" })}<b>${b.nombre}</b><span>${b.titulo}</span></div>${bloques}${extra}</div></article>`;
}
function htmlNota(it, i) {
  const t = it.texto;

  const k = `h-${i}`;

function rutaEnCompu(p) {
  const raiz = String(S.config.computadora || "").replace(/\/$/, "");
  if (raiz && p.startsWith(`${raiz}/`)) return p.slice(raiz.length + 1);
  if (!p.startsWith("/") && !p.startsWith("..")) return p.replace(/^\.\//, "");

}
function htmlAccion(it, i, b) {
  const t = it.texto, h = it.herramienta;
  let icono = "dot", verbo = t, arg = "", extra = "", abrir = null, m;
  if (h === "bash") { icono = "term"; if (t === "Reinició la terminal") verbo = t; else { verbo = "Ejecutó"; arg = t; } }
  else if (h === "web_search") { icono = "globe"; verbo = "Buscó en la web"; arg = t.replace(/^Buscó en la web:\s*/, ""); }
  else if (h === "web_fetch") { icono = "globe"; verbo = "Leyó"; arg = t.replace(/^Leyó\s*/, ""); }
  else if ((m = /^(Escribió|Editó|Leyó) (.+)$/s.exec(t)) && ["write", "edit", "read"].includes(h)) { icono = "file"; verbo = m[1]; arg = m[2]; if (h !== "read") abrir = rutaEnCompu(arg); }
  else if (h === "glob" || h === "grep") icono = "search";
  else if (h === "memory") { icono = "memory"; if ((m = /^(Guardó en su memoria|Borró de su memoria) (.+)$/.exec(t))) { verbo = m[1]; arg = m[2]; } }
  else if (h === "rutinas") icono = "clock";
  else if (h === "habilidades") icono = "bolt";
  else if (h === "delegar") { icono = "team"; if ((m = /^Repartió «(.+)» en (\d+) encargo\(s\): (.*)$/s.exec(t))) { verbo = "Repartió"; arg = m[1]; extra = `en ${plural(+m[2], "encargo", "encargos")}: ${m[3]}`; } }

  const cuerpo = html`${ico(icono)}<b>${verbo}</b>${arg ? html`<span class="arg" title="${arg}">${arg}</span>` : ""}${extra ? html`<span class="x" title="${extra}">${extra}</span>` : ""}${it.error ? html`<span class="tag-err">${ico("x")}falló</span>` : ""}`;
  if (it.detalle) {
    const k = `h-${i}`, n = it.detalle.split("\n").filter(Boolean).length;
    const etiqueta = h === "web_search" ? plural(n, "fuente", "fuentes") : h === "bash" ? `Salida · ${plural(n, "línea", "líneas")}` : it.error ? "Error" : "Detalle";
    return html`<details class="tlw ${it.error ? "err" : ""}" data-k="${k}" ${si(S.abiertos.has(k), "open")}><summary class="tl ${it.error ? "err" : ""}">${cuerpo}<span class="tog">${ico("right")}${etiqueta}</span></summary><pre class="pre">${it.detalle}</pre></details>`;
  }
  return html`<div class="tl ${it.error ? "err" : ""}">${cuerpo}${abrir ? html`<button class="x" data-a="abrir-archivo" data-ruta="${abrir}" data-id="${b.id}">Abrir</button>` : ""}</div>`;
}
function htmlOrigen(it, i) {

function grupoDe(a) {
  const h = String(a.firma).split(":")[0];

const CAMPOS_CX = { para: "Para", cc: "Cc", asunto: "Asunto", cuerpo: "Mensaje", id: "Id", carpeta: "Carpeta", inicio: "Empieza", fin: "Termina", ubicacion: "Lugar", asistentes: "Invitados", origen: "Archivo", destino: "Destino", ruta: "Ruta" };
function cuandoLegible(h) {
  if (!h?.tipo) return "";
  if (h.tipo === "intervalo") return h.minutos ? `cada ${h.minutos} min` : "cada tantos minutos";
  if (h.tipo === "semanal" && h.dia == null) return `una vez por semana${h.hora ? ` a las ${h.hora}` : ""}`;
  return h.hora ? HUMANO_H(h) : h.tipo === "diaria" ? "todos los días" : "una vez por semana";

function detalleLegible(a) {
  const h = String(a.firma).split(":")[0];
  if (!["rutinas", "reunion", "externo"].includes(h) || !a.detalle) return null;
  let d;
  try { d = JSON.parse(a.detalle); } catch { return null; }
  if (!d || typeof d !== "object" || Array.isArray(d)) return null;
  const f = [];
  if (h === "rutinas") {
    if (d.nombre) f.push(["Rutina", d.nombre]);
    if (cuandoLegible(d.horario)) f.push(["Cuándo", cuandoLegible(d.horario)]);
    if (d.instrucciones) f.push(["Qué hace", d.instrucciones, true]);
    if (d.activa === false) f.push(["Estado", "Queda pausada"]);
  } else if (h === "reunion") {
    if (d.titulo) f.push(["Reunión", d.titulo]);
    if (d.tipo) f.push(["Tipo", tipoReu(d.tipo)]);
    if (cuandoLegible(d.horario)) f.push(["Cuándo", cuandoLegible(d.horario)]);
    if (d.agenda) f.push(["Agenda", d.agenda, true]);
  } else {
    for (const [k, v] of Object.entries(d)) {
      if (v == null || v === "") continue;
      const t = Array.isArray(v) ? v.join(", ") : typeof v === "object" ? JSON.stringify(v) : String(v);
      f.push([CAMPOS_CX[k] || k.charAt(0).toUpperCase() + k.slice(1).replace(/_/g, " "), t, t.length > 90]);
    }

  return f.length ? f : null;
}

let compuCarga = null;
function montarCompu(botId) {
  S.compuBot = botId;
  pintarCompu();
  cargarCompu();
}
async function cargarCompu() {
  if (compuCarga) return compuCarga;
  compuCarga = (async () => {
    try { S.compu = await api("GET", "/api/computadora"); pintarCompu(); } catch (err) { fallo(err); } finally { compuCarga = null; }
  })();
  return compuCarga;
}
function arbolDe(archivos) {
  const raiz = { hijos: new Map() };
  for (const a of archivos) {
    const partes = a.ruta.split("/");
    let n = raiz;
    partes.forEach((p, i) => {
      if (!n.hijos.has(p)) n.hijos.set(p, { nombre: p, ruta: partes.slice(0, i + 1).join("/"), hijos: new Map(), archivo: null });
      n = n.hijos.get(p);
    });
    n.archivo = a;
  }
  return raiz;
}
function htmlArbolCompu(n, q) {
  const xs = [...n.hijos.values()].sort((a, b) => (!!b.archivo?.carpeta - !!a.archivo?.carpeta) || (b.hijos.size > 0) - (a.hijos.size > 0) || a.nombre.localeCompare(b.nombre));
  return xs.map((h) => {

// Editor simple (desde el celular también): el texto en un área editable; al guardar, si un compañero

function abrirEditorArchivo() {
  const pre = $("#visor-pre");
  const t = S.compuTexto;

  f.dataset.f = "compu-guardar";
  f.className = "form-card";
  f.innerHTML = html`<label class="fld"><span class="sr">Contenido de ${t.ruta}</span><textarea class="inp" name="contenido" rows="18" spellcheck="false" style="font:13px/1.5 var(--mono);white-space:pre;overflow:auto">${t.texto}</textarea></label><p class="err" role="alert"></p><div class="acts"><button type="button" class="btn ghost" data-a="compu-cancelar">Cancelar</button><button class="btn pri">Guardar</button></div>`.s;

async function mostrarTextoArchivo(sel) {
  const pre = $("#visor-pre");
  if (!pre) return;
  if (S.compuEdit === sel.ruta && S.compuTexto?.ruta === sel.ruta) { abrirEditorArchivo(); return; }
  if (S.compuTexto?.ruta === sel.ruta && S.compuTexto.modificado === sel.modificado) { pre.textContent = S.compuTexto.texto; return; }
  pre.textContent = "Cargando…";
  try {
    const r = await fetch(`/api/computadora/archivo?ruta=${encodeURIComponent(sel.ruta)}`);
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || `Error ${r.status}`);
    const tipo = r.headers.get("content-type") || "";
    const texto = tipo.startsWith("text/") ? await r.text() : "Es un archivo binario o muy grande: descargalo para abrirlo.";
    S.compuTexto = { ruta: sel.ruta, modificado: sel.modificado, texto, editable: tipo.startsWith("text/") };
    if (S.compuTexto.editable && S.compuSel === sel.ruta && !$('[data-a="compu-editar"]')) pintarCompu();
    if ($("#visor-pre") && S.compuSel === sel.ruta) $("#visor-pre").textContent = texto || "(vacío)";
  } catch (err) { if ($("#visor-pre")) $("#visor-pre").textContent = `No se pudo leer: ${err.message}`; }
}

// ================================================================ conexiones
async function cargarConexiones() {
  try {
    const r = await fetch("/api/conexiones");
    if (r.status === 404) { S.conexiones = null; pintarConexiones(); return; }
    if (r.status === 401 && !S.local) { location.reload(); return; }
    const d = await r.json().catch(() => null);
    if (!r.ok || !d) throw new Error(d?.error || `Error ${r.status}`);
    S.conexiones = d;
  } catch (err) { S.conexiones = { error: err.message }; }
  pintarConexiones();
}

const MODOS_MSJ = [
  ["leer", "Leer", "Guarda los mensajes y el compañero la puede consultar. Mandar algo pide tu aprobación."],
  ["atender", "Atender", "Contesta solo a clientes y te la pasa si no sabe o si piden hablar con una persona."],

];
const VERBO_MODO = { leer: "lee", atender: "atiende", charlar: "charla" };
const TOPE_MODO = { atender: 30, charlar: 12 };
// Glifos genéricos por app (no logos de marcas).
function icoApp(paquete, c = "") {
  const p = String(paquete || "");
  if (/instagram/.test(p)) return ico("camara", c);
  if (/telegram/.test(p)) return ico("send", c);
  if (/musically|trill|youtube/.test(p)) return glifo("video", c);
  if (/katana|pages/.test(p)) return glifo("personas", c);
  if (/orca/.test(p)) return ico("chat", c);
  return ico("burbuja", c);
}
const rutaChat = (id) => `#/mensajes/${encodeURIComponent(id)}`;
const apiChat = (id, extra = "") => `/api/mensajeria/conversaciones/${encodeURIComponent(id)}${extra}`;
function horaMsj(ms) {
  const d = new Date(ms);
  if (isNaN(d)) return "";
  if (mismoDia(d, new Date())) return fmtH.format(d);
  if (mismoDia(d, new Date(Date.now() - 864e5))) return "ayer";
  return `${d.getDate()} ${MESES[d.getMonth()]}`;
}
function diaLargo(ms) {
  const d = new Date(ms);
  if (mismoDia(d, new Date())) return "Hoy";
  if (mismoDia(d, new Date(Date.now() - 864e5))) return "Ayer";
  return `${DIAS[d.getDay()].replace(/^./, (c) => c.toUpperCase())} ${d.getDate()} de ${MESES[d.getMonth()]}`;
}
const mavChat = (c, cls = "") => html`<span class="mav ${cls}" aria-hidden="true">${c.esGrupo ? glifo("personas") : iniciales(c.conversacion || c.appNombre)}</span>`;
const quienDeriva = (c) => bot(c.derivada?.botId || c.botId)?.nombre || "Tu compañero";
const textoDerivada = (c) => `${quienDeriva(c)} te pasa la charla con ${c.conversacion || "esta conversación"}: ${minus1(c.derivada?.motivo || "necesita que la sigas vos.").replace(/\.$/, "")}`;

let msjCarga = null;
async function cargarMensajeria(silencioso = false) {
  if (msjCarga) { msjCarga.otra = true; return; }
  const ctl = { otra: false };
  msjCarga = ctl;
  try {
    do {
      ctl.otra = false;
      const [e, xs] = await Promise.all([api("GET", "/api/mensajeria/estado"), api("GET", "/api/mensajeria/conversaciones")]);
      S.msjEstado = e;
      S.chats = Array.isArray(xs) ? xs : [];
    } while (ctl.otra);
  } catch (err) {
    S.chats ??= [];
    if (!silencioso && S.ruta.vista === "mensajes") fallo(err);
  } finally { msjCarga = null; }
  programar("rail", "msj");
}
async function cargarCompartidos() {
  try { const xs = await api("GET", "/api/compartidos"); S.compartidos = Array.isArray(xs) ? xs : []; } catch { S.compartidos ??= []; }
  programar("msj");
}
const cargandoChat = new Map();
async function cargarChat(id) {
  if (cargandoChat.has(id)) { cargandoChat.get(id).otra = true; return; }
  const ctl = { otra: false };
  cargandoChat.set(id, ctl);
  try {
    do {
      ctl.otra = false;
      const c = await api("GET", apiChat(id));
      if (S.chatId !== id) break;
      S.chat = c;
      const r = S.chats?.find((x) => x.id === c.id);
      if (r) { const { mensajes, salientes, ...resumen } = c; Object.assign(r, resumen, { noLeidos: 0 }); }
    } while (ctl.otra);
  } catch (err) { if (S.chatId === id) S.chat = { id, error: err.message, status: err.status }; } finally { cargandoChat.delete(id); }
  programar("msj-chat", "rail");
}

function pillAsignacion(c) {
  const b = bot(c.botId);
  if (c.derivada) return html`<span class="pill a"><i class="d a"></i><span>Te la pasó ${quienDeriva(c)}</span></span>`;
  if (c.modo === "apagado") return html`<span class="pill n"><span>Apagada</span></span>`;
  if (!b) return "";
  return html`<span class="pill ${c.automatica ? "w" : "l"}"><i class="d ${c.automatica ? "w" : "l"}"></i><span>${b.nombre} ${VERBO_MODO[c.modo] || c.modo}${c.automatica && c.hasta ? ` hasta ${hora(c.hasta)}` : ""}</span></span>`;
}
function filaChat(c) {
  const on = c.id === S.chatId;
  const u = c.ultimo;
  // Lo que mandó un compañero ya viene firmado («Ada (asistente IA): …»): no se repite el nombre.
  const firmado = u?.autor && u.autor !== "usuario" && /^[^:\n]{1,60} \(asistente IA\): /.test(u.texto || "");
  const quien = !u || firmado ? "" : u.autor === "usuario" || (u.propio && !u.autor) ? "Vos: " : u.autor ? `${bot(u.autor)?.nombre || "Compañero"}: ` : c.esGrupo && u.de ? `${u.de}: ` : "";
  const nl = c.noLeidos && !on;
  const asig = pillAsignacion(c);
  return html`<a class="mrow ${on ? "on" : ""} ${nl ? "nl" : ""}" href="${rutaChat(c.id)}" data-k="mr-${c.id}" ${si(on, 'aria-current="page"')}>${mavChat(c)}<span class="mtx"><span class="mt1"><b>${c.conversacion || "Sin nombre"}</b>${c.esGrupo ? html`<span class="tag">Grupo</span>` : ""}</span><span class="mt2">${quien}${u?.texto || "Sin mensajes"}</span>${asig ? html`<span class="mt3">${asig}</span>` : ""}</span><span class="mrt">${u ? html`<time>${horaMsj(u.hora)}</time>` : ""}${nl ? html`<span class="un" aria-label="${plural(c.noLeidos, "mensaje sin leer", "mensajes sin leer")}">${c.noLeidos}</span>` : ""}</span></a>`;
}
function filaCompartido(c) {
  const [i, t] = c.tipo === "enlace" ? ["link", c.url] : c.tipo === "texto" ? ["file", c.texto] : [String(c.mime || "").startsWith("image/") ? "image" : String(c.mime || "").startsWith("video/") ? "play" : String(c.mime || "").startsWith("audio/") ? "audio" : "file", c.nombre || c.ruta];
  const para = (c.enviadoA || []).map((id) => bot(id)?.nombre).filter(Boolean);
  return html`<a class="cprow" href="#/compartido/${encodeURIComponent(c.id)}"><span class="gl" aria-hidden="true">${ico(i)}</span><span style="min-width:0"><b>${t || "Compartido"}</b><small>${diaHora(c.creado)}${para.length ? ` · se lo pasaste a ${listaY(para)}` : " · sin mandar"}</small></span></a>`;
}

  const descRegla = (r) => r.herramienta === "bash" ? `Comandos «${r.patron}» sin operadores` : r.herramienta === "editor" ? (r.patron === "*" ? "Escribir y editar cualquier archivo" : `Escribir y editar en ${r.patron}`) : r.herramienta === "rutinas" ? "Crear, cambiar y borrar rutinas" : r.herramienta === "reunion" ? "Convocar y programar reuniones" : `${herr[r.herramienta] || r.herramienta}: ${r.patron}`;
