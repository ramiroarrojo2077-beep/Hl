<script>
"use strict";
(() => {
// ================================================================ utilidades
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ESC[c]);
class Crudo { constructor(s) { this.s = s; } toString() { return this.s; } }
const crudo = (s) => new Crudo(String(s));
const val = (v) => (v == null || v === false || v === true ? "" : v instanceof Crudo ? v.s : Array.isArray(v) ? v.map(val).join("") : esc(v));
const html = (partes, ...vals) => { let o = partes[0]; for (let i = 0; i < vals.length; i++) o += val(vals[i]) + partes[i + 1]; return new Crudo(o); };
const si = (cond, attr) => (cond ? crudo(attr) : "");
const ico = (n, c = "") => crudo(`<svg class="i ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`);
const norm = (s) => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const plural = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`;
const guardarLocal = (k, v) => { try { localStorage.setItem(k, typeof v === "string" ? v : JSON.stringify(v)); } catch {} };
const leerLocal = (k, def = null) => { try { const v = localStorage.getItem(k); return v == null ? def : v; } catch { return def; } };

// Pinta HTML en un contenedor sin perder el foco (por data-k) ni la posición del cursor.
function pintar(el, contenido) {
  if (!el) return;
  const act = document.activeElement;
  let k = null, s0 = null, s1 = null;
  if (act && act !== el && el.contains(act)) {
    k = act.dataset?.k || null;
    try { s0 = act.selectionStart; s1 = act.selectionEnd; } catch {}
  }
  el.innerHTML = val(contenido);
  if (k) {
    const n = el.querySelector(`[data-k="${CSS.escape(k)}"]`);
    if (n) { n.focus({ preventScroll: true }); if (s0 != null) try { n.setSelectionRange(s0, s1); } catch {} }
  }
}

class ErrorApi extends Error { constructor(status, msg) { super(msg); this.status = status; } }
async function api(metodo, ruta, cuerpo) {
  const op = { method: metodo, headers: {} };
  // El servidor exige JSON en todo lo que no sea GET (protección contra otros sitios).
  if (metodo !== "GET") { op.headers["Content-Type"] = "application/json"; op.body = JSON.stringify(cuerpo ?? {}); }
  let r;
  try { r = await fetch(ruta, op); } catch { throw new ErrorApi(0, "No hay conexión con Gravity. Revisá que siga corriendo."); }
  if (r.status === 401 && !S.local) { location.reload(); throw new ErrorApi(401, "Iniciá sesión."); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new ErrorApi(r.status, d.error || `Error ${r.status}`);
  return d;
}

function toast(texto, tipo = "") {
  const t = document.createElement("div");
  t.className = `toast ${tipo}`;
  t.textContent = texto;
  $("#toasts").append(t);
  setTimeout(() => t.remove(), tipo === "err" ? 6500 : 3800);
}
const fallo = (err) => { console.warn(err); toast(err?.message || "Algo falló.", "err"); };
const intentar = (fn) => async (...a) => { try { return await fn(...a); } catch (err) { fallo(err); } };
async function conCarga(boton, fn) {
  if (boton) { boton.setAttribute("aria-busy", "true"); boton.disabled = true; }
  try { return await fn(); } catch (err) { fallo(err); return undefined; } finally { if (boton && boton.isConnected) { boton.removeAttribute("aria-busy"); boton.disabled = false; } }
}

// ---- fechas y números
const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const DIAS = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
const fmtH = new Intl.DateTimeFormat("es-AR", { hour: "2-digit", minute: "2-digit", hour12: false });
function fecha(s) {
  if (!s) return null;
  if (s instanceof Date) return s;
  const m = /^(\d{4})-(\d\d)-(\d\d) (\d\d):(\d\d)$/.exec(s);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]);
  const d = new Date(s);
  return isNaN(d) ? null : d;
}
const mismoDia = (a, b) => a.toDateString() === b.toDateString();
const esHoy = (s) => { const d = fecha(s); return !!d && mismoDia(d, new Date()); };
const hora = (s) => { const d = fecha(s); return d ? fmtH.format(d) : ""; };
function diaHora(s) {
  const d = fecha(s);
  if (!d) return "";
  if (mismoDia(d, new Date())) return `hoy ${fmtH.format(d)}`;
  if (mismoDia(d, new Date(Date.now() - 864e5))) return `ayer ${fmtH.format(d)}`;
  if (mismoDia(d, new Date(Date.now() + 864e5))) return `mañana ${fmtH.format(d)}`;
  return `${d.getDate()} ${MESES[d.getMonth()]} ${fmtH.format(d)}`;
}
function cuanto(s) {
  const d = fecha(s);
  if (!d) return "";
  const min = Math.max(0, Math.round((Date.now() - d) / 60000));
  if (min < 1) return "ahora";
  if (min < 60) return `${min} min`;
  const h = Math.floor(min / 60);
  if (h < 24) return `${h} h`;
  return `${Math.floor(h / 24)} d`;
}
const hace = (s) => { const c = cuanto(s); return !c ? "" : c === "ahora" ? "recién" : `hace ${c}`; };
function falta(s) {
  const d = fecha(s);
  if (!d) return "";
  const min = Math.round((d - Date.now()) / 60000);
  if (min <= 0) return "ya venció";
  if (min < 60) return `en ${min} min`;
  if (min < 24 * 60) return `en ${Math.floor(min / 60)} h ${min % 60 ? `${min % 60} min` : ""}`.trim();
  return diaHora(d);
}
function reloj(s) {
  const d = fecha(s);
  if (!d) return "";
  const t = Math.max(0, Math.floor((Date.now() - d) / 1000));
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), sg = t % 60;
  return `${h ? `${h}:` : ""}${h ? String(m).padStart(2, "0") : m}:${String(sg).padStart(2, "0")}`;
}
const usd = (n) => `US$${(Number(n) || 0).toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: n > 0 && n < 0.1 ? 3 : 2 })}`;
const tamano = (n) => (n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toLocaleString("es-AR", { maximumFractionDigits: 1 })} KB` : `${(n / 1048576).toLocaleString("es-AR", { maximumFractionDigits: 1 })} MB`);

// ================================================================ estado
const S = {
  cargado: false,
  bots: [], habilidades: [], reglas: [], aprobaciones: [], plantillas: [], plantillasEquipo: [], nombres: [],
  config: {}, ajustes: {}, gasto: {}, cupo: {}, tareas: [], reuniones: [], local: true,

// ================================================================ markdown seguro
// Se escapa todo primero y después solo se agregan etiquetas conocidas; los links solo pueden ser http(s).
function enLineaMd(s) {
  return s.split(/(`[^`]+`)/).map((p, i) => i % 2 ? `<code>${p.slice(1, -1)}</code>` : p
    .replace(/\*\*([^*\n]+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*\w])\*([^*\s][^*\n]*?)\*(?![\w*])/g, "$1<em>$2</em>")
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+[^\s<).,;:!?])/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>')).join("");
}
function tablaMd(filas) {
  const celdas = (f) => f.replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
  const esSep = (f) => /^\|?(\s*:?-{2,}:?\s*\|)*\s*:?-{2,}:?\s*\|?$/.test(f);
  let cab = null, cuerpo = filas;
  if (filas.length > 1 && esSep(filas[1])) { cab = celdas(filas[0]); cuerpo = filas.slice(2); }

  const fs = cuerpo.map(celdas);
  const cols = Math.max(cab?.length ?? 0, ...fs.map((f) => f.length));
  const num = (c) => /^[-+]?(US\$|\$|€)?\s?[\d.,]+\s?(%|u\.?|usd|ars|kb|mb)?$/i.test(c);
  const esNum = Array.from({ length: cols }, (_, i) => fs.length > 0 && fs.every((f) => !f[i] || num(f[i])) && fs.some((f) => f[i]));
  const td = (t, c, i) => `<${t}${esNum[i] ? ' class="num"' : ""}>${enLineaMd(c ?? "")}</${t}>`;
  return `<div class="tw"><table>${cab ? `<thead><tr>${cab.map((c, i) => td("th", c, i)).join("")}</tr></thead>` : ""}<tbody>${fs.map((f) => `<tr>${Array.from({ length: cols }, (_, i) => td("td", f[i], i)).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function bloquesMd(texto, out) {
  const lineas = esc(texto).split("\n");
  let par = [], lista = null, tabla = null, cita = null;
  const cerrar = () => {
    if (par.length) out.push(`<p>${par.map(enLineaMd).join("<br>")}</p>`);
    if (lista) out.push(`<${lista.t}>${lista.items.map((x) => `<li>${enLineaMd(x)}</li>`).join("")}</${lista.t}>`);
    if (tabla) out.push(tablaMd(tabla));
    if (cita) out.push(`<blockquote>${cita.map(enLineaMd).join("<br>")}</blockquote>`);
    par = []; lista = null; tabla = null; cita = null;
  };
  for (const l of lineas) {
    let m;
    if (!l.trim()) { cerrar(); continue; }
    if ((m = /^\s*#{1,6}\s+(.*)/.exec(l))) { cerrar(); out.push(`<h4>${enLineaMd(m[1])}</h4>`); continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { cerrar(); out.push("<hr>"); continue; }
    if (/^\s*\|/.test(l)) { if (!tabla) cerrar(); (tabla ??= []).push(l.trim()); continue; }
    if ((m = /^\s*&gt;\s?(.*)/.exec(l))) { if (!cita) cerrar(); (cita ??= []).push(m[1]); continue; }
    const it = /^\s*[-*•]\s+(.*)/.exec(l) || /^\s*\d+[.)]\s+(.*)/.exec(l);
    if (it) {
      const t = /^\s*\d/.test(l) ? "ol" : "ul";

      lista.items.push(it[1]);

    }
    if (lista && /^\s{2,}\S/.test(l)) { lista.items[lista.items.length - 1] += ` ${l.trim()}`; continue; }

function md(texto) {
  const out = [];
  const src = String(texto ?? "").replace(/\r\n?/g, "\n");
  const re = /```[^\n`]*\n([\s\S]*?)(?:```|$)/g;
  let ultimo = 0, m;
  while ((m = re.exec(src))) {
    bloquesMd(src.slice(ultimo, m.index), out);
    out.push(`<pre class="code"><code>${esc(m[1].replace(/\n$/, ""))}</code></pre>`);
    ultimo = re.lastIndex;

// ================================================================ chat
function autoAlto(ta) { ta.style.height = "auto"; ta.style.height = `${Math.min(ta.scrollHeight, ta.closest(".mcmp") ? 160 : 200)}px`; }
function pintarCompositor() {
  const b = bot(S.botId);
  const ta = $("#ta");
  if (!b || !ta) return;
  const ocupado = b.estado !== "libre";
  // El estado ya lo dice la pastilla de la cabecera: el texto de ayuda queda corto.
  ta.placeholder = `Escribile a ${b.nombre}…`;
  $("#cmp-det").hidden = !ocupado;
  const hint = $("#cmp-hint");
  hint.className = `hint ${ocupado ? "w" : ""}`;
  hint.textContent = ocupado ? `${est(b) === "wait" ? "Espera tu aprobación" : "Está trabajando"}: lo que mandes queda en cola y lo lee al terminar.` : "Enter envía · Shift+Enter, nueva línea";
}

const cargando = new Map();
async function cargarConv(id) {
  if (cargando.has(id)) { cargando.get(id).otra = true; return; }
  const ctl = { otra: false };
  cargando.set(id, ctl);
  try {
    do {
      ctl.otra = false;
      const corte = S.corte[id] || 0;
      const items = await api("GET", `/api/bots/${id}/conversacion`);
      S.items[id] = items;
      S.stream[id] = (S.stream[id] || "").slice(corte);
      S.corte[id] = Math.max(0, (S.corte[id] || 0) - corte);
      const b = bot(id);
      S.cola[id] = (S.cola[id] || []).slice(-(b?.enCola || 0) || S.cola[id]?.length);
      if (!b?.enCola) S.cola[id] = [];
      if (id === S.botId && S.pestana === "chat") { pintarHist(); pintarVivo(); }
    } while (ctl.otra);
  } catch (err) { if (id === S.botId) fallo(err); } finally { cargando.delete(id); }
  marcarLeido();
}
function marcarLeido() {
  const b = bot(S.botId);
  if (!b || S.ruta.vista !== "chats" || S.pestana !== "chat" || document.visibilityState !== "visible") return;
  const tenia = b.noLeido || S.sinLeer[b.id];
  S.sinLeer[b.id] = 0;
  if (b.noLeido) { b.noLeido = false; api("POST", `/api/bots/${b.id}/leido`, {}).catch(() => {}); }
  if (tenia) programar("side");
}
function bajar(forzar) { const t = $("#thread"); if (t && (forzar || S.pegado)) t.scrollTop = t.scrollHeight; }

function pintarHist() {
  const b = bot(S.botId), h = $("#hist");
  if (!b || !h) return;
  const items = S.items[b.id] || [];
  const pegado = S.pegado;
  pintar(h, items.length ? htmlItems(items, b) : html`<div class="chat-vacio">${av(b, 56, { s: "idle" })}<b>${b.nombre}</b><span class="sub">${b.titulo}</span><p>Escribile qué necesitás. Puede buscar en la web, trabajar en la computadora${b.cargo === "manager" ? ", repartir trabajo en su equipo" : ""} y programar rutinas.</p></div>`);
  if (pegado) bajar(true);
}
function htmlItems(items, b) {
  const out = [];
  let turno = null;
  const cerrar = () => { if (turno) { out.push(htmlTurno(b, turno)); turno = null; } };
  items.forEach((it, i) => {

// ================================================================ bandeja de aprobaciones
// Título del grupo en la bandeja: el tipo de pedido, sin el comando (ese va en el detalle, tal cual).
function etiquetaFirma(a) {
  const [h, ...r] = String(a.firma).split(":");
  const resto = r.join(":");
  if (h === "bash") return a.regla ? `Comandos «${resto}»` : "Comandos en la terminal";
  if (h === "editor") return resto === "*" || !resto ? "Escribir archivos" : `Escribir en ${resto}`;
  if (h === "rutinas") return "Cambios en rutinas";
  if (h === "reunion") return "Reuniones";
  return a.regla ? a.regla.charAt(0).toUpperCase() + a.regla.slice(1) : a.titulo;
}
// Pedidos que van juntos en la bandeja (y que «seleccionar el grupo» marca de una).
function grupoDe(a) {
  const h = String(a.firma).split(":")[0];
  return (h === "bash" && !a.regla) || h === "rutinas" || h === "reunion" ? `${h}:*` : a.firma;
}
// Rutinas, reuniones y apps mandan su pedido como JSON: se muestra como datos legibles.
const CAMPOS_CX = { para: "Para", cc: "Cc", asunto: "Asunto", cuerpo: "Mensaje", id: "Id", carpeta: "Carpeta", inicio: "Empieza", fin: "Termina", ubicacion: "Lugar", asistentes: "Invitados", origen: "Archivo", destino: "Destino", ruta: "Ruta" };
function cuandoLegible(h) {
  if (!h?.tipo) return "";
  if (h.tipo === "intervalo") return h.minutos ? `cada ${h.minutos} min` : "cada tantos minutos";
  if (h.tipo === "semanal" && h.dia == null) return `una vez por semana${h.hora ? ` a las ${h.hora}` : ""}`;
  return h.hora ? HUMANO_H(h) : h.tipo === "diaria" ? "todos los días" : "una vez por semana";
}
function detalleLegible(a) {
  const h = String(a.firma).split(":")[0];
  if (!["rutinas", "reunion", "externo"].includes(h) || !a.detalle) return null;
  let d;
  try { d = JSON.parse(a.detalle); } catch { return null; }
  if (!d || typeof d !== "object" || Array.isArray(d)) return null;
  const f = [];
  if (h === "rutinas") {
    if (d.nombre) f.push(["Rutina", d.nombre]);
    if (cuandoLegible(d.horario)) f.push(["Cuándo", cuandoLegible(d.horario)]);
    if (d.instrucciones) f.push(["Qué hace", d.instrucciones, true]);
    if (d.activa === false) f.push(["Estado", "Queda pausada"]);
  } else if (h === "reunion") {
    if (d.titulo) f.push(["Reunión", d.titulo]);
    if (d.tipo) f.push(["Tipo", d.tipo === "standup" ? "Daily" : "Discusión"]);
    if (cuandoLegible(d.horario)) f.push(["Cuándo", cuandoLegible(d.horario)]);
    if (d.agenda) f.push(["Agenda", d.agenda, true]);
  } else {
    for (const [k, v] of Object.entries(d)) {
      if (v == null || v === "") continue;
      const t = Array.isArray(v) ? v.join(", ") : typeof v === "object" ? JSON.stringify(v) : String(v);
      f.push([CAMPOS_CX[k] || k.charAt(0).toUpperCase() + k.slice(1).replace(/_/g, " "), t, t.length > 90]);
    }
  }
  return f.length ? f : null;
}

    ${nSel ? html`<footer class="ib-bar"><div class="ib-bar-t"><b>${nSel} ${nSel === 1 ? "seleccionado" : "seleccionados"}</b><span>${nombres}</span></div>

// ================================================================ computadora
let compuCarga = null;
function montarCompu(botId) {
  S.compuBot = botId;
  pintarCompu();
  cargarCompu();
}
async function cargarCompu() {
  if (compuCarga) return compuCarga;
  compuCarga = (async () => {
    try { S.compu = await api("GET", "/api/computadora"); pintarCompu(); } catch (err) { fallo(err); } finally { compuCarga = null; }
  })();
  return compuCarga;
}
function arbolDe(archivos) {
  const raiz = { hijos: new Map() };
  for (const a of archivos) {
    const partes = a.ruta.split("/");
    let n = raiz;
    partes.forEach((p, i) => {
      if (!n.hijos.has(p)) n.hijos.set(p, { nombre: p, ruta: partes.slice(0, i + 1).join("/"), hijos: new Map(), archivo: null });
      n = n.hijos.get(p);
    });
    n.archivo = a;
  }
  return raiz;
}
function htmlArbolCompu(n, q) {
  const xs = [...n.hijos.values()].sort((a, b) => (!!b.archivo?.carpeta - !!a.archivo?.carpeta) || (b.hijos.size > 0) - (a.hijos.size > 0) || a.nombre.localeCompare(b.nombre));
  return xs.map((h) => {
    const carpeta = h.archivo?.carpeta || h.hijos.size > 0;
    if (carpeta) {
      const abierta = q || S.compuAbiertas.has(h.ruta);
      const dentro = htmlArbolCompu(h, q);
      if (q && !dentro.length) return "";
      return html`<li><button data-a="compu-carpeta" data-ruta="${h.ruta}" aria-expanded="${!!abierta}">${ico(abierta ? "down" : "right", "s")}${ico("folder", "s")}<span>${h.nombre}</span></button>${abierta ? html`<ul>${dentro}</ul>` : ""}</li>`;
    }
    if (q && !norm(h.ruta).includes(q)) return "";
    return html`<li><button data-a="compu-archivo" data-ruta="${h.ruta}" aria-current="${S.compuSel === h.ruta}">${ico("file", "s")}<span>${h.nombre}</span><small>${tamano(h.archivo?.tamano || 0)}</small></button></li>`;
  }).filter((x) => x);
}
function pintarCompu() {
  const el = $("#pc");
  if (!el) return;
  const c = S.compu;
  const b = bot(S.compuBot);
  if (!c) { pintar(el, html`<div class="carga">Cargando la computadora…</div>`); return; }
  if (b && !S.compuIniciada) {
    S.compuIniciada = true;
    const carpeta = (equipoDe(b)?.carpetaEquipo || "").replace(/\/$/, "");
    if (carpeta) { let acc = ""; for (const p of carpeta.split("/")) { acc = acc ? `${acc}/${p}` : p; S.compuAbiertas.add(acc); } }
  }
  const q = norm(S.compuFiltro.trim());
  const archivos = c.archivos.filter((a) => !a.carpeta);
  const comandos = [...c.comandos].reverse().filter((x) => !b || x.botId === b.id).slice(0, 60);
  const sel = c.archivos.find((a) => a.ruta === S.compuSel);
  const arbol = htmlArbolCompu(arbolDe(c.archivos), q);
  pintar(el, html`<div class="pc">
    <section class="card" aria-label="Archivos"><div class="box-h"><span class="micro">Archivos · ${archivos.length}</span><button class="ib" data-a="compu-recargar" aria-label="Actualizar" title="Actualizar">${ico("refresh", "s")}</button></div>
      <label class="field" style="margin-top:6px">${ico("search", "s")}<input type="search" placeholder="Filtrar archivos" aria-label="Filtrar archivos" data-i="compu-filtro" data-k="compu-filtro" value="${S.compuFiltro}"></label>
      <div class="arbol-w">${arbol.length ? html`<ul class="arbol">${arbol}</ul>` : html`<p class="muted" style="font-size:13px;padding:8px 4px">${archivos.length ? "Nada coincide." : "La computadora está vacía. Lo que escriban los compañeros aparece acá."}</p>`}</div></section>
    <div class="pc-col">
      <section class="card visor" aria-label="Visor de archivos">${sel ? html`<div class="visor-h">${ico("file", "s")}<b>${sel.ruta}</b><span class="muted" style="font-size:12px">${tamano(sel.tamano)} · ${diaHora(sel.modificado)}</span><span class="sp"></span><a class="btn out sm" href="/api/computadora/archivo?ruta=${encodeURIComponent(sel.ruta)}&descargar=1" download>${ico("download", "s")}Descargar</a></div><pre class="pre" id="visor-pre"></pre>` : html`<p class="muted" style="font-size:13px">Elegí un archivo para verlo acá.</p>`}</section>
      <section class="card" aria-label="Terminal"><div class="box-h"><span class="micro">Terminal${b ? ` de ${b.nombre}` : ""} · últimos ${comandos.length}</span></div>
        ${comandos.length ? html`<ul class="term" style="margin-top:8px">${comandos.map((x, i) => { const k = `cmd-${x.fecha}-${i}`; return html`<li><details data-k="${k}" ${si(S.abiertos.has(k), "open")}><summary>${ico("term", "s")}<code>$ ${x.comando}</code>${x.error ? html`<span class="tag-err">${ico("x")}error</span>` : ""}<small>${b ? "" : `${x.bot} · `}${hora(x.fecha)}</small></summary><pre class="pre">${x.salida || "(sin salida)"}</pre></details></li>`; })}</ul>` : html`<p class="muted" style="font-size:13px;margin-top:6px">Todavía no hubo comandos${b ? ` de ${b.nombre}` : ""}.</p>`}</section>
    </div></div>`);
  if (sel) mostrarTextoArchivo(sel);
}
async function mostrarTextoArchivo(sel) {
  const pre = $("#visor-pre");
  if (!pre) return;
  if (S.compuTexto?.ruta === sel.ruta && S.compuTexto.modificado === sel.modificado) { pre.textContent = S.compuTexto.texto; return; }
  pre.textContent = "Cargando…";
  try {
    const r = await fetch(`/api/computadora/archivo?ruta=${encodeURIComponent(sel.ruta)}`);
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || `Error ${r.status}`);
    const tipo = r.headers.get("content-type") || "";
    const texto = tipo.startsWith("text/") ? await r.text() : "Es un archivo binario o muy grande: descargalo para abrirlo.";
    S.compuTexto = { ruta: sel.ruta, modificado: sel.modificado, texto };
    if ($("#visor-pre") && S.compuSel === sel.ruta) $("#visor-pre").textContent = texto || "(vacío)";
  } catch (err) { if ($("#visor-pre")) $("#visor-pre").textContent = `No se pudo leer: ${err.message}`; }
}

      <label class="fld h-min" ${si(h.tipo !== "intervalo", "hidden")}><span>Minutos</span><input class="inp" type="number" name="minutos" min="5" max="10080" value="${h.minutos || 60}"></label></div>

    <p class="err" role="alert"></p>
    <div class="acts"><button type="button" class="btn ghost" data-a="rutina-cancelar">Cancelar</button><button class="btn pri">${r ? "Guardar" : "Crear rutina"}</button></div></form>`;
}
function datosRutina(f) {
  const d = new FormData(f);
  const tipo = d.get("tipo");
  const horario = tipo === "intervalo" ? { tipo, minutos: Number(d.get("minutos")) } : tipo === "semanal" ? { tipo, dia: Number(d.get("dia")), hora: d.get("hora") } : { tipo, hora: d.get("hora") };
  const esReu = d.get("esReunion") === "on";
  return { nombre: d.get("nombre"), instrucciones: d.get("instrucciones"), habilidadId: d.get("habilidadId") || null, horario, activa: d.get("activa") === "on", reunion: esReu ? { tipo: d.get("tipoReunion"), participantes: null, confirmarAcciones: d.get("confirmar") === "on" } : null };
}

// ================================================================ conexiones
async function cargarConexiones() {
  try {
    const r = await fetch("/api/conexiones");
    if (r.status === 404) { S.conexiones = null; pintarConexiones(); return; }
    if (r.status === 401 && !S.local) { location.reload(); return; }
    const d = await r.json().catch(() => null);
    if (!r.ok || !d) throw new Error(d?.error || `Error ${r.status}`);
    S.conexiones = d;
  } catch (err) { S.conexiones = { error: err.message }; }
  pintarConexiones();
}

// ================================================================ diálogos
const dlg = () => $("#dlg");
let alCerrarDlg = null, cierresIgnorados = 0;
// Con un diálogo abierto, «atrás» (el del celular o el del navegador) lo cierra en vez de cambiar de
// pantalla: al abrir se suma una entrada al historial y al cerrar se saca.
let dlgHist = false, volviendo = false, irPendiente = null;
function soltarHistoria() {
  if (!dlgHist) return;
  dlgHist = false;
  volviendo = true;
  history.back();
  setTimeout(terminarVuelta, 500); // por si el navegador no avisa
}
function terminarVuelta() {
  if (!volviendo) return;
  volviendo = false;
  const h = irPendiente;
  irPendiente = null;
  if (h) ir(h);
}
window.addEventListener("popstate", () => {
  if (volviendo) { terminarVuelta(); return; }
  if (dlgHist) { dlgHist = false; if (dlg().open) dlg().close(); }
});
function abrirDialogo(contenido, chico = false, alCerrar = null) {
  const d = dlg();
  // Uno reemplaza a otro (p. ej. una hoja que abre una confirmación): el anterior se cierra sin
  // que su aviso de cierre borre al nuevo.
  if (d.open) { const f = alCerrarDlg; alCerrarDlg = null; cierresIgnorados++; d.close(); f?.(); }
  d.className = `dlg ${chico ? "chico" : ""}`;
  d.innerHTML = val(contenido);
  alCerrarDlg = alCerrar;
  const foco = d.querySelector("[autofocus]") || d.querySelector("input:not([type=hidden]):not([type=radio]):not([type=checkbox]),select,textarea,button");
  // En el celular el teclado no se abre solo (taparía media hoja): el foco va a la hoja.
  const sinTeclado = celular() && foco?.matches("input,textarea,select");
  if (sinTeclado) { foco.removeAttribute("autofocus"); const f = d.querySelector(".dlg-f"); if (f) { f.tabIndex = -1; f.setAttribute("autofocus", ""); } }
  d.showModal();
  if (!dlgHist && !volviendo) { history.pushState({ dlg: true }, "", location.href); dlgHist = true; }
  if (!sinTeclado) foco?.focus();
}
function cerrarDialogo() { const d = dlg(); if (d.open) { soltarHistoria(); d.close(); } }
dlg().addEventListener("close", () => {
  if (cierresIgnorados) { cierresIgnorados--; return; }
  soltarHistoria();
  const f = alCerrarDlg; alCerrarDlg = null; dlg().innerHTML = ""; f?.();
});
dlg().addEventListener("click", (e) => { if (e.target === dlg()) cerrarDialogo(); });
function confirmar(titulo, texto, si_ = "Confirmar", peligro = false) {
  return new Promise((res) => {
    let ok = false;
    abrirDialogo(html`<form class="dlg-f" data-f="confirmar"><h2 id="dlg-t">${titulo}</h2><p>${texto}</p><div class="acts"><button type="button" class="btn ghost" data-a="cerrar-dlg">Cancelar</button><button class="btn ${peligro ? "out" : "pri"}" autofocus>${si_}</button></div></form>`, true, () => res(ok));
    F.confirmar = () => { ok = true; cerrarDialogo(); };
  });
}

function nombresLibres(n, extra = []) {
  const usados = new Set([...S.bots.map((b) => norm(b.nombre)), ...extra.map(norm)]);
  const out = [];
  for (const x of S.nombres) { if (out.length >= n) break; if (!usados.has(norm(x))) { out.push(x); usados.add(norm(x)); } }
  let i = 2;
  while (out.length < n) { for (const x of S.nombres) { if (out.length >= n) break; const y = `${x} ${i}`; if (!usados.has(norm(y))) { out.push(y); usados.add(norm(y)); } } i++; }
  return out;
}

function cambiarN(n) {
  const f = $("#dlg form");

  if (nuevos.length < n) nuevos = nuevos.concat(nombresLibres(n - nuevos.length, [f.mNombre.value, ...nuevos]));
  $("#ce-nombres").innerHTML = nuevos.map((x, i) => html`<input class="inp" name="nom${i}" value="${x}" maxlength="40" aria-label="Nombre ${i + 1}" data-i="ce-nombre">`.s).join("");

function quitarAprobacion(id) {

  intentar(f)(t, e);
});
document.addEventListener("change", (e) => { const t = e.target.closest("[data-c]"); if (t && C[t.dataset.c]) intentar(C[t.dataset.c])(t, e); });
document.addEventListener("input", (e) => { const t = e.target.closest("[data-i]"); if (t && I[t.dataset.i]) I[t.dataset.i](t, e); });
document.addEventListener("submit", (e) => { const f = e.target.closest("form[data-f]"); if (!f) return; e.preventDefault(); if (F[f.dataset.f]) intentar(F[f.dataset.f])(f, e); });
document.addEventListener("toggle", (e) => {
  const d = e.target;
  if (!(d instanceof HTMLDetailsElement) || !d.dataset.k) return;
  if (d.open) { S.abiertos.add(d.dataset.k); S.abiertos.delete(`${d.dataset.k}-c`); } else { S.abiertos.delete(d.dataset.k); S.abiertos.add(`${d.dataset.k}-c`); }
}, true);
document.addEventListener("keydown", (e) => {
  const t = e.target;
  if ((t.id === "ta" || t.id === "mta") && e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); t.form.requestSubmit(); return; }
  if (e.key === "/" && !e.ctrlKey && !e.metaKey && !t.closest("input,textarea,select,[contenteditable]") && !dlg().open) {
    const q = $("#buscar") || $("[data-k=eq-buscar]");
    if (q && q.offsetParent) { e.preventDefault(); q.focus(); q.select(); }
  }
  if (e.key === "Escape" && t.id === "buscar" && t.value) { t.value = ""; S.busqueda = ""; pintar($("#side-lista"), htmlLista()); }
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) marcarLeido(); });

// ================================================================ repintado agrupado
const pendientes = new Set();
let marco = 0;
function programar(...xs) {
  xs.forEach((x) => pendientes.add(x));
  if (!marco) marco = requestAnimationFrame(repintar);
}
function repintar() {
  marco = 0;
  const p = new Set(pendientes);
  pendientes.clear();
  const v = S.ruta.vista;
  if (p.has("rail")) pintarRail();
  if (p.has("avisos")) pintarAvisos();
  if (v === "chats") {
    if (p.has("side")) pintarSide();
    if (p.has("cab")) { pintarCabecera(); pintarTabs(); }
    if (p.has("cmp")) pintarCompositor();
    if (p.has("vivo")) pintarVivo();
    if (p.has("ctx")) pintarCtx();
    if (p.has("perfil") && S.pestana === "perfil") pintarPerfil();
  }
  if (v === "equipo" && p.has("equipo")) pintarEquipo();
  if ((v === "equipo" || v === "aprobaciones") && p.has("bandeja")) pintarBandejas();
  if (v === "reuniones" && p.has("reuniones")) S.ruta.id ? pintarSala() : pintarReuniones();
  if (v === "ajustes" && p.has("ajustes")) pintarAjustes();
}

// ================================================================ datos y eventos en vivo
let primera = true;
// Aprobaciones que llegaron (o se resolvieron) en vivo. /api/estado puede responder con una foto
// de antes de ese evento: sin esto, un pedido nuevo desaparecía del chat y de la bandeja.
let verAps = 0;
const cambiosAps = new Map();
function anotarAp(id, a) { cambiosAps.set(id, { ver: ++verAps, a }); }
async function cargarEstado() {
  const v0 = verAps;
  const d = await api("GET", "/api/estado");
  for (const k of ["bots", "habilidades", "reglas", "aprobaciones", "plantillas", "plantillasEquipo", "nombres", "config", "ajustes", "gasto", "cupo", "tareas", "reuniones", "local"]) S[k] = d[k];
  for (const [id, c] of cambiosAps) {
    if (c.ver <= v0) { cambiosAps.delete(id); continue; }
    if (c.a && !S.aprobaciones.some((x) => x.id === id)) S.aprobaciones.push(c.a);
    if (!c.a) S.aprobaciones = S.aprobaciones.filter((x) => x.id !== id);
  }
  indexar();
  for (const b of S.bots) if (b.estado !== "libre" && !S.desde[b.id]) S.desde[b.id] = b.tareaId && S.tareas.find((t) => t.id === b.tareaId)?.inicio || null;
  firmaAvisos = "";
  pintarAvisos();
  if (!S.cargado || primera) { S.cargado = true; primera = false; navegar(); return; }
  if (S.ruta.vista === "chats" && S.botId && !bot(S.botId)) { S.botId = null; ir("#/chats"); return; }
  if (S.ruta.vista === "chats" && !S.botId && S.bots.length && !angosto()) { navegar(); return; }
  programar("rail", "side", "cab", "cmp", "vivo", "ctx", "equipo", "bandeja", "reuniones", "ajustes", "perfil");
  if (S.ruta.vista === "chats" && !$("#bh") && S.botId) montarMain();
}
let recarga = null;
const recargarPronto = () => { clearTimeout(recarga); recarga = setTimeout(intentar(cargarEstado), 150); };
function upsertReunion(r) {
  const res = { ...r, turnos: Array.isArray(r.turnos) ? r.turnos.length : r.turnos };
  const i = S.reuniones.findIndex((x) => x.id === r.id);
  if (i >= 0) S.reuniones[i] = res; else S.reuniones.unshift(res);
}

// notificaciones del navegador: solo con la pestaña oculta
let pidioPermiso = false;
function pedirPermisoNotif() {
  if (pidioPermiso || !("Notification" in window) || Notification.permission !== "default") return;
  pidioPermiso = true;
  try { Notification.requestPermission().catch(() => {}); } catch {}
}
function notificar(titulo, cuerpo, tag) {
  if (!document.hidden || !("Notification" in window) || Notification.permission !== "granted") return;
  try { const n = new Notification(titulo, { body: cuerpo, tag, icon: "/iconos/gravity-192.png" }); n.onclick = () => { window.focus(); n.close(); }; } catch {}
}
let ultimaNotif = 0, notifPend = [], notifTimer = null;
function notificarAprobacion(a) {
  if (!document.hidden) return;
  notifPend.push(a);
  if (notifTimer) return;
  notifTimer = setTimeout(() => {
    notifTimer = null;
    const xs = notifPend.filter((x) => S.aprobaciones.some((y) => y.id === x.id));
    notifPend = [];
    if (!xs.length || !document.hidden) return;
    ultimaNotif = Date.now();
    const quien = [...new Set(xs.map((x) => bot(x.botId)?.nombre).filter(Boolean))];
    notificar(xs.length === 1 ? `${quien[0] || "Un compañero"} necesita tu aprobación` : `${xs.length} pedidos esperan tu aprobación`, xs.length === 1 ? xs[0].titulo : `De ${listaY(quien)}.`, "gravity-aprobaciones");
  }, Math.max(1500, ultimaNotif + 30000 - Date.now()));
}

function conectar() {
  const es = new EventSource("/api/eventos");
  const datos = (e) => { try { return JSON.parse(e.data); } catch { return {}; } };
  const on = (tipo, fn) => es.addEventListener(tipo, (e) => { try { fn(datos(e)); } catch (err) { console.warn(err); } });
  es.addEventListener("open", () => { S.stream = {}; S.corte = {}; recargarPronto(); if (S.botId && S.ruta.vista === "chats" && S.pestana === "chat") cargarConv(S.botId); });
  es.addEventListener("error", () => { if (es.readyState === EventSource.CLOSED) setTimeout(conectar, 3000); });
  on("estado", (d) => {
    const b = bot(d.botId);
    if (!b) return;
    const antes = b.estado;
    Object.assign(b, { estado: d.estado, accion: d.accion, enCola: d.enCola, tareaId: d.tareaId });
    if (d.estado !== "libre" && antes === "libre") S.desde[b.id] = new Date().toISOString();
    if (d.estado === "libre" && antes !== "libre") {
      S.desde[b.id] = null;
      if (b.id !== S.botId || document.hidden || S.pestana !== "chat") { S.sinLeer[b.id] = (S.sinLeer[b.id] || 0) + 1; b.noLeido = true; }
      if (b.cargo === "manager") notificar(`${b.nombre} terminó`, "Tiene novedades para vos.", `gravity-fin-${b.id}`);
    }
    if (S.cola[b.id]?.length > (b.enCola || 0) && antes !== "libre") S.cola[b.id] = S.cola[b.id].slice(-(b.enCola || 0) || S.cola[b.id].length);
    programar("rail", "side", "equipo", "ctx");
    if (b.id === S.botId) programar("cab", "cmp", "vivo");
  });
  on("delta", (d) => { S.stream[d.botId] = (S.stream[d.botId] || "") + d.texto; if (d.botId === S.botId) pintarVivo(); });
  on("delta-reinicio", (d) => { S.stream[d.botId] = ""; S.corte[d.botId] = 0; if (d.botId === S.botId) pintarVivo(); });
  on("cambio", (d) => {
    const id = d.botId;
    if (id === S.botId && S.ruta.vista === "chats" && S.pestana === "chat") { S.corte[id] = (S.stream[id] || "").length; cargarConv(id); }
    else { S.stream[id] = ""; S.corte[id] = 0; delete S.items[id]; S.cola[id] = []; }
  });
  on("aprobacion", (a) => {
    anotarAp(a.id, a);
    if (!S.aprobaciones.some((x) => x.id === a.id)) S.aprobaciones.push(a);
    notificarAprobacion(a);
    despues(a.botId);
  });
  on("aprobacion-resuelta", (d) => quitarAprobacion(d.id));
  for (const t of ["bots", "habilidades", "reglas", "ajustes"]) on(t, recargarPronto);
  on("rutinas", (d) => {
    if (d.botId === S.botId && S.pestana === "rutinas" && !S.editRutina) cargarRutinas();
    if (S.ruta.vista === "reuniones" && !S.ruta.id) cargarProgramadas();
    const b = bot(d.botId);
    if (b) api("GET", `/api/bots/${b.id}/rutinas`).then((xs) => { b.rutinas = xs.length; if (b.id === S.botId) programar("cab"); }).catch(() => {});
  });
  on("memoria", (d) => { if (d.botId === S.botId && S.pestana === "memoria") cargarMemoria(); });
  let tCompu = null;
  on("computadora", () => { if ($("#pc")) { clearTimeout(tCompu); tCompu = setTimeout(cargarCompu, 400); } });
  on("tarea", (t) => {
    const i = S.tareas.findIndex((x) => x.id === t.id);
    if (i >= 0) S.tareas[i] = t; else S.tareas.push(t);
    for (const id of [t.paraId, t.deId]) { const b = bot(id); if (b) b.tareasAbiertas = S.tareas.filter((x) => x.paraId === b.id && tareaAbierta(x)).length; }
    programar("ctx", "equipo", "reuniones");
    if (t.paraId === S.botId || t.deId === S.botId) programar("cab");
  });
  on("reunion", (r) => {
    upsertReunion(r);
    if (S.reunion?.id === r.id) S.reunion = r;
    programar("rail", "reuniones", "ctx", "equipo");
  });
  on("gasto", (g) => { S.gasto = g; programar("rail", "avisos", "ajustes"); });
  on("cupo", (c) => { S.cupo = c; programar("avisos"); });
  on("conexiones", () => { if (S.ruta.vista === "conexiones") cargarConexiones(); });
}

// relojes
setInterval(() => {
  for (const e of $$("[data-hace]")) e.textContent = hace(e.dataset.hace);
  for (const e of $$("[data-dura]")) if (e.dataset.dura) e.textContent = cuanto(e.dataset.dura) || "ahora";
}, 15000);
setInterval(() => { for (const e of $$("[data-reloj]")) e.textContent = reloj(e.dataset.reloj); }, 1000);

function aplicarTema() {
  const t = leerLocal("gravity-tema", "");
  if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
}
aplicarTema();
window.addEventListener("hashchange", navegar);
let anchoAntes = angosto();
window.addEventListener("resize", () => { const a = angosto(); if (a !== anchoAntes) { anchoAntes = a; if (S.ruta.vista === "chats") navegar(); } });

(async () => {
  try { await cargarEstado(); }
  catch (err) { $("#vista").innerHTML = html`<div class="hola"><div class="hola-in"><h1>No se pudo cargar Gravity</h1><p>${err.message}</p><button class="btn pri" onclick="location.reload()">Reintentar</button></div></div>`.s; }
  conectar();
})();
if ("serviceWorker" in navigator) { try { navigator.serviceWorker.register("/sw.js").catch(() => {}); } catch {} }
})();
</script>
