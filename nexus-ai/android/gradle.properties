org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Servidor por defecto (editable dentro de la app). 10.0.2.2 = localhost del host desde el emulador.
nexus.defaultServerUrl=http://10.0.2.2:8000

# Firebase Cloud Messaging (opcional). Completar para notificaciones push reales.
# Se obtienen en la consola de Firebase > Configuración del proyecto > Tus apps (Android).
nexus.firebase.applicationId=
nexus.firebase.apiKey=
nexus.firebase.projectId=
nexus.firebase.senderId=
