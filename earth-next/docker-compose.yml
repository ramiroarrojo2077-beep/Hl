# Despliegue de referencia: aplicación + PostgreSQL/PostGIS.
# (No ejecutado en el entorno de desarrollo donde se construyó; revisar antes de producción.)
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: earthnext
      POSTGRES_USER: earthnext
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar-esta-clave}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U earthnext"]
      interval: 5s
      retries: 10
  app:
    build: .
    environment:
      PORT: 8787
      DATABASE_URL: postgres://earthnext:${POSTGRES_PASSWORD:-cambiar-esta-clave}@db:5432/earthnext
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8787:8787"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
