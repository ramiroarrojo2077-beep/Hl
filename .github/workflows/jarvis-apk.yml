name: APK de Jarvis

on:
  push:
    paths:
      - "jarvis/android/**"
      - ".github/workflows/jarvis-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar el APK
        working-directory: jarvis/android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Preparar archivo
        run: cp jarvis/android/app/build/outputs/apk/debug/app-debug.apk jarvis.apk

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: jarvis.apk

      # Deja el APK en una página de descarga fija:
      # https://github.com/<usuario>/<repo>/releases/download/jarvis-android/jarvis.apk
      - name: Publicar para descargar desde el celular
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view jarvis-android >/dev/null 2>&1 || \
            gh release create jarvis-android --title "Jarvis para Android" --prerelease \
              --notes "Descargá jarvis.apk en tu celular e instalalo. Se actualiza solo con cada cambio en la app." \
              --target "${{ github.sha }}"
          gh release upload jarvis-android jarvis.apk --clobber
