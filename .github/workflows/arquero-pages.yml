# Publica Arquero AR en GitHub Pages (la cámara y la realidad aumentada necesitan https).
# Una sola vez: Settings → Pages → Source: "GitHub Actions".
name: Arquero AR en GitHub Pages

on:
  push:
    paths:
      - "arquero/**"
      - ".github/workflows/arquero-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: arquero-pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    # Sólo desde la rama principal del repo (la que GitHub Pages deja publicar).
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: arquero
      - id: deployment
        uses: actions/deploy-pages@v4
