# Compila Gravity para Android, todo en uno (carpeta android/): la APK lleva adentro Node.js
# para Android y el motor de Gravity empaquetado, así no hace falta ninguna compu.
# La publica como gravity.apk en la release "apk-latest" y la deja como artefacto del workflow.
#
# Firma: si el repo tiene los secretos ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS y ANDROID_KEY_PASSWORD se arma una APK release firmada con esa clave.
# Si falta alguno, se arma la APK debug con la firma fija de android/firma/ (también se
# instala encima de la anterior, sin perder las conversaciones).
name: Android

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - "bots/src/**"
      - "bots/public/**"
      - "bots/empaquetar.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  apk:
    name: Compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android

    steps:
      - name: Bajar el código
        uses: actions/checkout@v7

      - name: Instalar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Bajar Node.js para Android y empaquetar el motor
        run: ./preparar.sh

      - name: Instalar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar el SDK de Android
        uses: android-actions/setup-android@v4

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.1"
          cache-provider: basic

      - name: Preparar la firma
        id: firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/gravity.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/gravity.jks" >> "$GITHUB_ENV"
            echo "tipo=release" >> "$GITHUB_OUTPUT"
            echo "Se arma la APK release firmada."
          else
            echo "tipo=debug" >> "$GITHUB_OUTPUT"
            echo "::notice title=APK sin firma propia::Faltan los secretos de firma; se publica la APK debug."
          fi

      - name: Compilar
        env:
          TIPO: ${{ steps.firma.outputs.tipo }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$TIPO" = "release" ]; then
            gradle --no-daemon --stacktrace :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/gravity.apk"
          else
            gradle --no-daemon --stacktrace :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/gravity.apk"
          fi
          ls -l "$GITHUB_WORKSPACE/gravity.apk"

      - name: Revisar que la APK tenga el motor adentro
        run: |
          contenido="$(unzip -l "$GITHUB_WORKSPACE/gravity.apk")"
          for f in lib/arm64-v8a/libnode.so lib/arm64-v8a/libgravity_nodo.so lib/arm64-v8a/libc++_shared.so \
                   assets/motor/gravity/servidor.mjs assets/motor/public/index.html; do
            if ! grep -q " $f\$" <<<"$contenido"; then
              echo "::error title=APK incompleta::Falta $f"
              exit 1
            fi
          done
          echo "La APK tiene Node.js y el motor de Gravity."

      - name: Borrar la clave del runner
        if: always()
        run: rm -f "$RUNNER_TEMP/gravity.jks"

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: gravity-apk
          path: gravity.apk
          if-no-files-found: error

      - name: Publicar en Releases (apk-latest)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: apk-latest
          name: Gravity para Android (última versión)
          prerelease: true
          files: gravity.apk
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            **Gravity para Android**, compilada automáticamente desde `${{ github.ref_name }}` (commit `${{ github.sha }}`, versión 1.0.${{ github.run_number }}, APK ${{ steps.firma.outputs.tipo }}).

            ### Cómo instalarla
            1. En el celu, abrí esta página y tocá **gravity.apk** (más abajo, en *Assets*).
            2. Cuando termine la descarga, abrila. Si Android lo pide, permití **Instalar apps desconocidas** para tu navegador (Ajustes > Apps > Chrome > Instalar apps desconocidas).
            3. Si aparece Play Protect, tocá **Más detalles > Instalar de todos modos**: la app no está en Google Play.
            4. Abrí Gravity, pegá tu clave de la API de Anthropic y listo: el motor arranca dentro del celular.
            5. Cuando lo pida, permití las notificaciones y dejá a Gravity **sin restricciones de batería**: así tus compañeros siguen trabajando con la pantalla apagada y las rutinas corren a horario.

            **Todo corre en el celular**: no hace falta ninguna compu ni servidor. Las conversaciones quedan guardadas en el celular.
            Solo para celulares de 64 bits (arm64, casi todos desde 2017) con Android 8 o más nuevo.

            Para actualizar, bajá la nueva **gravity.apk** e instalala encima: no se pierde nada. Si venías de la versión vieja (la que se conectaba a la compu), desinstalala una vez antes, porque tenía otra firma.

            Guía completa: `bots/MOVIL.md` en el repo.
