name: Orbita APK
on:
  push:
    paths: ['orbita-bot/**', '.github/workflows/orbita-apk.yml']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orbita-bot/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: node build-apk.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: orbita-debug-apk
          path: orbita-bot/mobile/android/app/build/outputs/apk/debug/app-debug.apk
